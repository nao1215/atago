version: "1"

suite:
  name: git + changes (a staged blob touches exactly index + one object)
  description: |
    `git add` is documented as writing a blob and updating the index. This suite
    holds git to that literally: after initializing a repository, staging one
    file must create exactly two things on disk — the staging index, and one
    loose object under `.git/objects` — and nothing else anywhere.

    It is an exhaustive claim, not a spot check. Any extra file git wrote would
    fail the assertion, which is what makes it a real statement about git's
    footprint rather than a restatement of the documentation.

# `git init` (a prior step) lays down the whole .git tree as the delta baseline.
# Object files are hash-named at EXACTLY two levels (objects/<2-hex>/<38-hex>),
# so the glob `repo/.git/objects/*/*` covers them precisely — path.Match '*'
# never crosses '/', so it cannot match a deeper path by accident.
#
# Unlike the rest of the git suite (which runs unchanged on every OS), this
# scenario is POSIX-only: git-for-windows applies core.autocrlf/filemode
# defaults whose exact effect on the loose-object footprint could not be
# verified here, so the delta contract is gated to platforms it was proven on.
scenarios:
  - name: staging one file creates the index and a single loose object (POSIX)
    skip:
      os: windows
    steps:
      # f.txt is a fixture, so it lands before the pre-scan (baseline), not in
      # the delta.
      - fixture:
          file: repo/f.txt
          content: "hello from atago\n"
      # git init's own tree is created here; this step's delta is not asserted.
      - run:
          command: git init -q repo
      - assert:
          exit_code: 0
      # The add is the step under test: index + exactly one loose object.
      - run:
          command: git -C repo add f.txt
      - assert:
          exit_code: 0
          changes:
            created:
              - repo/.git/index
              - repo/.git/objects/*/*
            modified: []
            deleted: []

  - name: git init's whole .git tree is pinned by one recursive glob (POSIX)
    skip:
      os: windows
    steps:
      # The real-world case that motivated #76: `git init` lays down a .git tree
      # of arbitrary, git-version-dependent depth (hooks/, refs/heads/, info/,
      # ...). A single `repo/.git/**` doublestar covers the whole subtree at any
      # depth — the v1 vocabulary needed one glob per directory level and still
      # could not say "and nothing deeper". modified/deleted stay empty, so the
      # exhaustive-both-ways contract still proves init touched only the .git
      # tree and created nothing outside it.
      - run:
          command: git init -q repo
      - assert:
          exit_code: 0
          changes:
            created:
              - "repo/.git/**"
            modified: []
            deleted: []
