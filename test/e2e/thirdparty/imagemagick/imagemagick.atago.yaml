version: "1"

suite:
  name: ImageMagick (image conversion pipeline)
  description: |
    [ImageMagick](https://imagemagick.org/) converts, resizes, and inspects
    images. What this suite pins is the part a converter must not get wrong:
    that the file it wrote really is the image it claims.

    Every output is decoded and checked as an image — format, pixel
    dimensions, alpha channel — never merely "a file appeared". A lossless
    round trip is verified twice over: once by atago comparing the pixels
    against the original, and once by ImageMagick's own `compare -metric AE`,
    an independent oracle that has to agree. The failure side is pinned per
    kind (missing input, corrupt input, unwritable format), and the input
    images are always generated by the tool itself, so the suite carries no
    third-party assets.

# Inputs are synthesized with `xc:` canvases, so no image files are committed
# and every scenario is hermetic. Gate: only where ImageMagick 7 is installed.
scenarios:
  - name: a conversion writes the requested format and nothing else
    only:
      command: magick -version
    steps:
      - run:
          command: magick -size 8x6 xc:red source.png
      - assert:
          exit_code: 0
      - run:
          sandbox_home: true
          command: magick source.png out.jpg
      - assert:
          exit_code: 0
          # Exhaustive: the conversion produced exactly one new file, left the
          # input untouched, and wrote nothing into the sandboxed HOME.
          changes:
            created: [out.jpg]
            modified: []
            deleted: []
      - assert:
          # The format is sniffed from the bytes, not from the extension.
          image:
            path: out.jpg
            format: jpeg
            width: 8
            height: 6

  - name: resize honors the aspect ratio unless it is forced
    only:
      command: magick -version
    steps:
      - run:
          command: magick -size 40x20 xc:white source.png
      - assert:
          exit_code: 0
      # A bare geometry fits the image inside the box, keeping the 2:1 ratio.
      - run:
          command: magick source.png -resize 20x20 fitted.png
      - assert:
          exit_code: 0
          image:
            path: fitted.png
            width: 20
            height: 10
      # A trailing "!" forces the exact geometry and breaks the ratio.
      - run:
          command: magick source.png -resize 20x20! forced.png
      - assert:
          exit_code: 0
          image:
            path: forced.png
            width: 20
            height: 20

  - name: a 1x1 canvas survives the smallest possible conversion
    only:
      command: magick -version
    steps:
      - run:
          command: magick -size 1x1 xc:black tiny.png
      - assert:
          exit_code: 0
          image:
            path: tiny.png
            format: png
            width: 1
            height: 1

  - name: an alpha channel survives PNG but is dropped by JPEG
    only:
      command: magick -version
    steps:
      - run:
          command: magick -size 8x6 xc:none transparent.png
      - assert:
          exit_code: 0
          image:
            path: transparent.png
            format: png
            alpha: true
      # JPEG has no alpha channel: the flattened output must report none.
      - run:
          command: magick transparent.png -background white -flatten flat.jpg
      - assert:
          exit_code: 0
          image:
            path: flat.jpg
            format: jpeg
            alpha: false

  - name: a PNG to PPM round trip restores the original pixels
    only:
      command: magick -version
    steps:
      - run:
          command: magick -size 16x12 gradient:red-blue source.png
      - assert:
          exit_code: 0
      - run:
          command: magick source.png intermediate.ppm
      - assert:
          exit_code: 0
      - run:
          command: magick intermediate.ppm restored.png
      - assert:
          exit_code: 0
          # atago decodes both images and compares them pixel for pixel.
          image:
            path: restored.png
            similar_to: source.png
            max_diff: 0
      # Independent oracle: ImageMagick's own comparison must agree that not a
      # single pixel differs (AE = absolute error count, exit 0 = identical).
      - run:
          command: "magick compare -metric AE source.png restored.png null:"
      - assert:
          exit_code: 0

  - name: comparing different images reports a nonzero difference
    only:
      command: magick -version
    steps:
      - run:
          command: magick -size 8x6 xc:red red.png
      - assert:
          exit_code: 0
      - run:
          command: magick -size 8x6 xc:blue blue.png
      - assert:
          exit_code: 0
      - run:
          command: "magick compare -metric AE red.png blue.png null:"
      - assert:
          # Every one of the 48 pixels differs, and compare says so on stderr.
          exit_code: 1
          stderr:
            contains: "48"

  - name: the JSON report describes the image it just wrote
    only:
      command: magick -version
    steps:
      - run:
          command: magick -size 24x18 xc:red report.png
      - assert:
          exit_code: 0
      - run:
          command: "magick report.png json:"
      - assert:
          exit_code: 0
          stdout:
            json:
              - path: "$[0].image.format"
                equals: PNG
              - path: "$[0].image.geometry.width"
                equals: 24
              - path: "$[0].image.geometry.height"
                equals: 18
              - path: "$[0].image.mimeType"
                equals: image/png

  - name: strip removes an embedded comment from the output bytes
    only:
      command: magick -version
    steps:
      - run:
          command: magick -size 8x6 xc:red -set comment CONFIDENTIAL-MARK marked.png
      - assert:
          exit_code: 0
          file:
            path: marked.png
            contains: CONFIDENTIAL-MARK
      - run:
          command: magick marked.png -strip stripped.png
      - assert:
          exit_code: 0
      - assert:
          # Negative space: the comment is gone from the file the tool wrote.
          file:
            path: stripped.png
            not_contains: CONFIDENTIAL-MARK
      - assert:
          # Stripping metadata is not allowed to change the picture.
          image:
            path: stripped.png
            similar_to: marked.png
            max_diff: 0

  - name: a missing input fails without writing an output
    only:
      command: magick -version
    steps:
      - run:
          command: magick no-such-input.png out.png
      - assert:
          exit_code: 1
          stdout:
            empty: true
          # The message names the file that could not be read. Only the path is
          # asserted: ImageMagick localizes the rest of the sentence.
          stderr:
            contains: "no-such-input.png"
      - assert:
          # Atomicity: the failed run left no half-written output behind.
          file:
            path: out.png
            exists: false

  - name: a corrupt input is rejected rather than converted
    only:
      command: magick -version
    steps:
      - fixture:
          file: broken.png
          content: "this is not a PNG at all\n"
      - run:
          command: magick broken.png out.png
      - assert:
          exit_code: 1
          stdout:
            empty: true
          stderr:
            contains: "broken.png"
      - assert:
          file:
            path: out.png
            exists: false

  # An unfamiliar extension is not an error: ImageMagick keeps the input's
  # encoding and writes it under the name it was given. The file is therefore a
  # PNG whatever the extension claims, which is exactly what a content-sniffing
  # format assertion is for.
  - name: an unknown output extension keeps the input encoding
    only:
      command: magick -version
    steps:
      - run:
          command: magick -size 8x6 xc:red source.png
      - assert:
          exit_code: 0
      - run:
          command: magick source.png out.notaformat
      - assert:
          exit_code: 0
          image:
            path: out.notaformat
            format: png
            width: 8
            height: 6

  - name: identify reads the dimensions back out of a written file
    only:
      command: magick -version
    steps:
      - run:
          command: magick -size 37x11 xc:gray sized.png
      - assert:
          exit_code: 0
      - run:
          command: magick identify -format "%wx%h %m" sized.png
      - assert:
          exit_code: 0
          stdout:
            equals: "37x11 PNG"

  - name: identify on a missing file fails and prints nothing to stdout
    only:
      command: magick -version
    steps:
      - run:
          command: magick identify absent.png
      - assert:
          exit_code: 1
          stdout:
            empty: true
          stderr:
            contains: "absent.png"
