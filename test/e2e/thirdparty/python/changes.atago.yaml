version: "1"

suite:
  name: python3 + changes (bytecode cache footprint)
  description: |
    Running a Python script quietly writes files you did not ask for: importing a
    local module leaves a compiled `.pyc` behind in `__pycache__`, while the
    entry script itself is never cached. That asymmetry surprises people, so it
    is pinned here exactly.

    The paired scenario pins the escape hatch: with `PYTHONDONTWRITEBYTECODE`
    set, the same run creates nothing at all — an empty delta, which is the
    strongest form this assertion can take.

# Gate: only where python3 is installed.
scenarios:
  - name: importing a local module writes exactly one .pyc
    only:
      command: python3 --version
    steps:
      - fixture:
          file: mymod.py
          content: |
            def val():
                return 42
      - fixture:
          file: main.py
          content: |
            import mymod
            print(mymod.val())
      - run:
          command: python3 main.py
      # main.py is the entry point (never cached); only the imported module
      # produces a .pyc. The interpreter-tagged name (mymod.cpython-3XX.pyc) is
      # covered by a single-level glob.
      - assert:
          exit_code: 0
          stdout:
            equals: "42"
          changes:
            created:
              - __pycache__/*.pyc
            modified: []
            deleted: []

  - name: PYTHONDONTWRITEBYTECODE suppresses the cache entirely
    only:
      command: python3 --version
    steps:
      - fixture:
          file: mymod.py
          content: |
            def val():
                return 42
      - fixture:
          file: main.py
          content: |
            import mymod
            print(mymod.val())
      - run:
          command: python3 main.py
          env:
            PYTHONDONTWRITEBYTECODE: "1"
      # No bytecode is written: the run creates nothing at all.
      - assert:
          exit_code: 0
          stdout:
            equals: "42"
          changes:
            created: []
            modified: []
            deleted: []
