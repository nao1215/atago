version: "1"

suite:
  name: sqlite3 + changes (workdir-delta of a database write)
  description: |
    SQLite creates side files while it works — a rollback journal by default, or
    a write-ahead log and shared-memory file in WAL mode. A process that dies
    mid-transaction leaves them behind.

    This suite pins the cleanup guarantee: after a `sqlite3` process exits
    normally, those files are gone — deleted or checkpointed back into the
    database — and the only thing that changed on disk is the database file
    itself. In both journal modes.

    That is a stronger statement than "the write worked", and it is what makes a
    leftover journal file a detectable regression rather than something nobody
    notices until a restore.
defaults:
  scenario:
    # Every scenario here drives sqlite3. Without the program there is nothing to
    # test, so the suite skips rather than erroring: a missing tool is not a
    # result. The gate is declared once so no scenario can be left out of it.
    only:
      command: sqlite3 --version

scenarios:
  - name: default rollback-journal mode creates exactly the db file
    steps:
      - run:
          shell: true
          command: sqlite3 t.db "create table x(a); insert into x values(1)"
      - assert:
          exit_code: 0
          changes:
            created:
              - t.db
            modified: []
            deleted: []

  - name: WAL mode leaves no -wal/-shm behind after a clean close
    steps:
      - run:
          shell: true
          command: sqlite3 t.db "PRAGMA journal_mode=WAL; create table x(a); insert into x values(1)"
      # Only t.db survives: the -wal and -shm files are created and removed
      # within the single invocation, so the delta never sees them.
      - assert:
          exit_code: 0
          changes:
            created:
              - t.db
            modified: []
            deleted: []
