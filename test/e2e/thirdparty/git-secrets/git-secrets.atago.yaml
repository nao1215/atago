version: "1"

suite:
  name: git-secrets (patterns, scanning, and allow-listing)
  description: |
    [git-secrets](https://github.com/awslabs/git-secrets) scans files for
    patterns that must never be committed. It keeps its own test suite in Bats;
    what those tests check is pinned here from outside, against repositories the
    scenarios create and throw away.

    No real credential appears anywhere in this suite. The patterns are invented
    for the scenario that uses them, which is enough to exercise every rule the
    tool has: where a pattern is stored, what a match looks like, which stream it
    goes to, the two ways to allow a false positive, and the exit codes — 0 for
    clean, 1 for a match, 2 when the file is not there, 129 for a command line
    git itself rejects.

defaults:
  scenario:
    only:
      command: command -v git-secrets
    skip:
      os: windows
  run:
    sandbox_home: true
    env:
      # Keeps the messages the underlying tools emit in one language, and gives
      # the installer the terminal database it reaches for.
      LC_ALL: C
      TERM: xterm

scenarios:
  - name: a pattern is stored in the repository's git config
    steps:
      - run:
          shell: true
          command: git init -q && git config user.email atago@example.com && git config user.name atago
      - assert:
          exit_code: 0
      - run:
          command: git secrets --list
      - assert:
          # Nothing configured is exit 1 with nothing printed: an empty list is
          # reported as "no", not as an empty success.
          exit_code: 1
          stdout:
            empty: true
      - run:
          command: git secrets --add topsecret-[0-9]+
      - assert:
          exit_code: 0
          # The pattern is repository state, kept where git keeps everything
          # else about the repository.
          changes:
            created: []
            modified: [.git/config]
            deleted: []
      - assert:
          file:
            path: .git/config
            contains: "patterns = topsecret-[0-9]+"
      - run:
          command: git secrets --list
      - assert:
          exit_code: 0
          stdout:
            equals: |
              secrets.patterns topsecret-[0-9]+

  - name: a clean file passes silently and a match is reported on stderr
    steps:
      - run:
          shell: true
          command: git init -q && git secrets --add topsecret-[0-9]+
      - assert:
          exit_code: 0
      - fixture:
          file: clean.txt
          content: |
            nothing of interest here
      - run:
          command: git secrets --scan clean.txt
      - assert:
          exit_code: 0
          stdout:
            empty: true
          stderr:
            empty: true
      - fixture:
          file: leaky.txt
          content: |
            first line is fine
            token = topsecret-4242
      - run:
          command: git secrets --scan leaky.txt
      - assert:
          # Everything goes to stderr, including the match itself, so a pipeline
          # reading stdout gets nothing and has only the exit code to go on.
          exit_code: 1
          stdout:
            empty: true
          stderr:
            contains:
              - "leaky.txt:2:token = topsecret-4242"
              - "[ERROR] Matched one or more prohibited patterns"
              # The failure does not stop at "no": it lists every way out, which
              # is what a developer blocked by a hook actually needs.
              - "- Mark false positives as allowed using: git config --add secrets.allowed ..."
              - "- Use --no-verify if this is a one-time false positive"

  - name: a false positive is allowed either in the config or in a file
    steps:
      - run:
          shell: true
          command: git init -q && git secrets --add topsecret-[0-9]+
      - assert:
          exit_code: 0
      - fixture:
          file: leaky.txt
          content: |
            token = topsecret-4242
      - run:
          command: git secrets --scan leaky.txt
      - assert:
          exit_code: 1
      - run:
          command: git secrets --add --allowed topsecret-4242
      - assert:
          exit_code: 0
      - run:
          command: git secrets --scan leaky.txt
      - assert:
          # Same file, same prohibited pattern, allowed: the tool is a pair of
          # lists rather than one.
          exit_code: 0
          stderr:
            empty: true
      - run:
          shell: true
          command: git config --unset-all secrets.allowed
      - assert:
          exit_code: 0
      - fixture:
          file: .gitallowed
          content: |
            topsecret-42[0-9][0-9]
      - run:
          command: git secrets --scan leaky.txt
      - assert:
          # The second way exists so the allowances can be committed and shared;
          # this one is a file in the repository rather than local config.
          exit_code: 0
          stderr:
            empty: true

  - name: a literal pattern is escaped so its metacharacters mean themselves
    steps:
      - run:
          shell: true
          command: git init -q
      - assert:
          exit_code: 0
      - run:
          command: git secrets --add --literal a.b*c
      - assert:
          exit_code: 0
      - run:
          command: git secrets --list
      - assert:
          # Stored escaped, which is the whole job: without it the dot and the
          # star would quietly match far more than the text that was typed.
          exit_code: 0
          stdout:
            equals: |
              secrets.patterns a\.b\*c
      - fixture:
          file: literal.txt
          content: |
            a.b*c
      - fixture:
          file: regexy.txt
          content: |
            aXbbbc
      - run:
          command: git secrets --scan literal.txt
      - assert:
          exit_code: 1
          stderr:
            contains: "literal.txt:1:a.b*c"
      - run:
          command: git secrets --scan regexy.txt
      - assert:
          # The text a regex reading of the pattern would have matched is clean.
          exit_code: 0
          stderr:
            empty: true

  - name: scanning a directory needs the recursive flag
    steps:
      - run:
          shell: true
          command: git init -q && git secrets --add topsecret-[0-9]+
      - assert:
          exit_code: 0
      - fixture:
          file: src/nested/leaky.txt
          content: |
            token = topsecret-1
      - run:
          command: git secrets --scan src
      - assert:
          # Worth knowing before trusting a scan: a directory without -r is not
          # descended into and not complained about either. The scan of a tree
          # full of secrets comes back clean and silent, at exit 0.
          exit_code: 0
          stdout:
            empty: true
          stderr:
            empty: true
      - run:
          command: git secrets --scan -r src
      - assert:
          exit_code: 1
          stderr:
            contains: "src/nested/leaky.txt:1:token = topsecret-1"

  - name: a file that is not there is exit 2, not a clean scan
    steps:
      - run:
          shell: true
          command: git init -q && git secrets --add topsecret-[0-9]+
      - assert:
          exit_code: 0
      - run:
          command: git secrets --scan missing.txt
      - assert:
          # Distinct from both 0 and 1, so a scan of a path that moved cannot be
          # mistaken for a scan that found nothing. The wording comes straight
          # from grep underneath.
          exit_code: 2
          stdout:
            empty: true
          stderr:
            equals: |
              grep: missing.txt: No such file or directory

  - name: a command line git rejects is 129 with the usage
    steps:
      - run:
          shell: true
          command: git init -q
      - assert:
          exit_code: 0
      - run:
          command: git secrets --bogus
      - assert:
          # 129 is git's own code for a usage error: git-secrets is a git
          # subcommand, and it answers like one.
          exit_code: 129
          stdout:
            empty: true
          stderr:
            contains:
              - "error: unknown option `bogus'"
              - "usage: git secrets --scan [-r|--recursive] [--cached] [--no-index] [--untracked] [<files>...]"

  - name: registering the AWS rules adds the provider and its patterns
    steps:
      - run:
          shell: true
          command: git init -q
      - assert:
          exit_code: 0
      - run:
          command: git secrets --register-aws
      - assert:
          exit_code: 0
          stdout:
            equals: |
              OK
          changes:
            created: []
            modified: [.git/config]
            deleted: []
      - run:
          command: git secrets --list
      - assert:
          # The provider is a command that prints more patterns at scan time —
          # the extension point — and the registered patterns are the shapes AWS
          # credentials take, not credentials themselves.
          exit_code: 0
          stdout:
            contains:
              - "secrets.providers git secrets --aws-provider"
              - "[A-Z0-9]{16}"
