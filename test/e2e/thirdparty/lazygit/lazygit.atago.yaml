version: "1"

suite:
  name: lazygit (third-party git TUI)

# lazygit is a real-world Git TUI: it stages, commits, discards, creates
# branches, and manipulates stashes through a terminal UI while mutating an
# actual repository. These scenarios therefore assert both the rendered UI
# checkpoints and the repository side effects under the scenario workdir.
# Install: see .github/workflows/thirdparty.yml for the pinned CI version.
scenarios:
  - name: version prints the pinned release
    only:
      command: lazygit --version
    steps:
      - run:
          command: lazygit --version
      - assert:
          exit_code: 0
          stdout:
            contains: version=0.63.1

  - name: opening a dirty repository shows unstaged changes and quits cleanly
    only:
      command: lazygit --version
    skip:
      os: windows
    steps:
      - fixture: {file: repo/a.txt, content: "hello\n"}
      - run: {command: git init -q repo}
      - run: {command: git -C repo add a.txt}
      - run: {command: git -C repo -c user.name=atago -c user.email=atago@example.com commit -q -m initial}
      - run:
          shell: true
          command: printf 'more\n' >> repo/a.txt
      - fixture:
          file: cfg/config.yml
          content: |
            gui:
              nerdFontsVersion: "3"
              showFileTree: false
              showBottomLine: false
              showCommandLog: false
              showRandomTip: false
              showFileIcons: false
              showListFooter: false
            disableStartupPopups: true
            promptToReturnFromSubprocess: false
      - pty:
          command: lazygit -ucd ${workdir}/cfg -p ${workdir}/repo
          rows: 30
          cols: 120
          timeout: 20s
          clear_env: true
          pass_env: [PATH]
          session:
            - expect: "Unstaged changes"
            - send: "q"
      - assert:
          exit_code: 0

  - name: space stages the selected unstaged file
    only:
      command: lazygit --version
    skip:
      os: windows
    steps:
      - fixture: {file: repo/a.txt, content: "hello\n"}
      - fixture: {file: repo/b.txt, content: "new\n"}
      - run: {command: git init -q repo}
      - run: {command: git -C repo add a.txt}
      - run: {command: git -C repo -c user.name=atago -c user.email=atago@example.com commit -q -m initial}
      - run:
          shell: true
          command: printf 'more\n' >> repo/a.txt
      - fixture:
          file: cfg/config.yml
          content: |
            gui:
              nerdFontsVersion: "3"
              showFileTree: false
              showBottomLine: false
              showCommandLog: false
              showRandomTip: false
              showFileIcons: false
              showListFooter: false
            disableStartupPopups: true
            promptToReturnFromSubprocess: false
      - pty:
          command: lazygit -ucd ${workdir}/cfg -p ${workdir}/repo
          rows: 30
          cols: 120
          timeout: 20s
          clear_env: true
          pass_env: [PATH]
          session:
            - expect: "Unstaged changes"
            - send: " "
            - expect: "Staged changes"
            - send: "q"
      - run:
          command: git -C repo status --porcelain
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "M  a.txt"
              - "?? b.txt"

  - name: space toggles a staged file back to unstaged
    only:
      command: lazygit --version
    skip:
      os: windows
    steps:
      - fixture: {file: repo/a.txt, content: "hello\n"}
      - run: {command: git init -q repo}
      - run: {command: git -C repo add a.txt}
      - run: {command: git -C repo -c user.name=atago -c user.email=atago@example.com commit -q -m initial}
      - run:
          shell: true
          command: printf 'more\n' >> repo/a.txt && git -C repo add a.txt
      - fixture:
          file: cfg/config.yml
          content: |
            gui:
              nerdFontsVersion: "3"
              showFileTree: false
              showBottomLine: false
              showCommandLog: false
              showRandomTip: false
              showFileIcons: false
              showListFooter: false
            disableStartupPopups: true
            promptToReturnFromSubprocess: false
      - pty:
          command: lazygit -ucd ${workdir}/cfg -p ${workdir}/repo
          rows: 30
          cols: 120
          timeout: 20s
          clear_env: true
          pass_env: [PATH]
          session:
            - expect: "Staged changes"
            - send: " "
            - expect: "Unstaged changes"
            - send: "q"
      - run:
          command: git -C repo status --porcelain
      - assert:
          exit_code: 0
          stdout:
            equals: " M a.txt"

  - name: capital C commits staged changes through git's editor
    only:
      command: lazygit --version
    skip:
      os: windows
    steps:
      - fixture: {file: repo/a.txt, content: "hello\n"}
      - run: {command: git init -q repo}
      - run: {command: git -C repo add a.txt}
      - run: {command: git -C repo -c user.name=atago -c user.email=atago@example.com commit -q -m initial}
      - run: {command: git -C repo config user.name atago}
      - run: {command: git -C repo config user.email atago@example.com}
      - run:
          shell: true
          command: printf 'more\n' >> repo/a.txt
      - fixture:
          file: editor.sh
          content: |
            #!/bin/sh
            printf 'editor commit\n' > "$1"
      - run:
          shell: true
          command: chmod +x editor.sh
      - run:
          command: git -C repo config core.editor ${workdir}/editor.sh
      - fixture:
          file: cfg/config.yml
          content: |
            gui:
              nerdFontsVersion: "3"
              showFileTree: false
              showBottomLine: false
              showCommandLog: false
              showRandomTip: false
              showFileIcons: false
              showListFooter: false
            disableStartupPopups: true
            promptToReturnFromSubprocess: false
      - pty:
          command: lazygit -ucd ${workdir}/cfg -p ${workdir}/repo
          rows: 30
          cols: 120
          timeout: 20s
          clear_env: true
          pass_env: [PATH]
          session:
            - expect: "Unstaged changes"
            - send: " "
            - expect: "Staged changes"
            - send: "C"
      - run:
          command: git -C repo log --oneline -1
      - assert:
          exit_code: 0
          stdout:
            contains: editor commit

  - name: escape cancels the discard dialog and preserves the diff
    only:
      command: lazygit --version
    skip:
      os: windows
    steps:
      - fixture: {file: repo/a.txt, content: "hello\n"}
      - run: {command: git init -q repo}
      - run: {command: git -C repo add a.txt}
      - run: {command: git -C repo -c user.name=atago -c user.email=atago@example.com commit -q -m initial}
      - run:
          shell: true
          command: printf 'more\n' >> repo/a.txt
      - fixture:
          file: cfg/config.yml
          content: |
            gui:
              nerdFontsVersion: "3"
              showFileTree: false
              showBottomLine: false
              showCommandLog: false
              showRandomTip: false
              showFileIcons: false
              showListFooter: false
            disableStartupPopups: true
            promptToReturnFromSubprocess: false
      - pty:
          command: lazygit -ucd ${workdir}/cfg -p ${workdir}/repo
          rows: 30
          cols: 120
          timeout: 20s
          clear_env: true
          pass_env: [PATH]
          session:
            - expect: "Unstaged changes"
            - send: "d"
            - expect: "Discard changes"
            - send: {key: esc}
            - send: "q"
      - run:
          command: git -C repo diff -- a.txt
      - assert:
          exit_code: 0
          stdout:
            contains: "+more"

  - name: enter accepts the discard dialog and reverts the diff
    only:
      command: lazygit --version
    skip:
      os: windows
    steps:
      - fixture: {file: repo/a.txt, content: "hello\n"}
      - run: {command: git init -q repo}
      - run: {command: git -C repo add a.txt}
      - run: {command: git -C repo -c user.name=atago -c user.email=atago@example.com commit -q -m initial}
      - run:
          shell: true
          command: printf 'more\n' >> repo/a.txt
      - fixture:
          file: cfg/config.yml
          content: |
            gui:
              nerdFontsVersion: "3"
              showFileTree: false
              showBottomLine: false
              showCommandLog: false
              showRandomTip: false
              showFileIcons: false
              showListFooter: false
            disableStartupPopups: true
            promptToReturnFromSubprocess: false
      - pty:
          command: lazygit -ucd ${workdir}/cfg -p ${workdir}/repo
          rows: 30
          cols: 120
          timeout: 20s
          clear_env: true
          pass_env: [PATH]
          session:
            - expect: "Unstaged changes"
            - send: "d"
            - expect: "Discard changes"
            - send: {key: enter}
      - run:
          command: git -C repo diff -- a.txt
      - assert:
          exit_code: 0
          stdout:
            empty: true

  - name: n creates a new branch from the branch panel
    only:
      command: lazygit --version
    skip:
      os: windows
    steps:
      - fixture: {file: repo/a.txt, content: "hello\n"}
      - run: {command: git init -q repo}
      - run: {command: git -C repo add a.txt}
      - run: {command: git -C repo -c user.name=atago -c user.email=atago@example.com commit -q -m initial}
      - fixture:
          file: cfg/config.yml
          content: |
            gui:
              nerdFontsVersion: "3"
              showFileTree: false
              showBottomLine: false
              showCommandLog: false
              showRandomTip: false
              showFileIcons: false
              showListFooter: false
            disableStartupPopups: true
            promptToReturnFromSubprocess: false
      - pty:
          command: lazygit -ucd ${workdir}/cfg -p ${workdir}/repo branch
          rows: 30
          cols: 120
          timeout: 20s
          clear_env: true
          pass_env: [PATH]
          session:
            - expect: "Local branches"
            - send: "n"
            - expect: "New branch name"
            - send: "feature-one"
            - send: {key: enter}
      - run:
          command: git -C repo branch --show-current
      - assert:
          exit_code: 0
          stdout:
            equals: feature-one

  - name: space checks out the selected branch
    only:
      command: lazygit --version
    skip:
      os: windows
    steps:
      - fixture: {file: repo/a.txt, content: "hello\n"}
      - run: {command: git init -q repo}
      - run: {command: git -C repo add a.txt}
      - run: {command: git -C repo -c user.name=atago -c user.email=atago@example.com commit -q -m initial}
      - run: {command: git -C repo branch feature-one}
      - fixture:
          file: cfg/config.yml
          content: |
            gui:
              nerdFontsVersion: "3"
              showFileTree: false
              showBottomLine: false
              showCommandLog: false
              showRandomTip: false
              showFileIcons: false
              showListFooter: false
            disableStartupPopups: true
            promptToReturnFromSubprocess: false
      - pty:
          command: lazygit -ucd ${workdir}/cfg -p ${workdir}/repo branch
          rows: 30
          cols: 120
          timeout: 20s
          clear_env: true
          pass_env: [PATH]
          session:
            - expect: "master"
            - send: {key: down}
            - expect: "feature-one"
            - send: " "
      - run:
          command: git -C repo branch --show-current
      - assert:
          exit_code: 0
          stdout:
            equals: feature-one

  - name: s opens the stash prompt and records a named stash entry
    only:
      command: lazygit --version
    skip:
      os: windows
    steps:
      - fixture: {file: repo/a.txt, content: "hello\n"}
      - run: {command: git init -q repo}
      - run: {command: git -C repo add a.txt}
      - run: {command: git -C repo -c user.name=atago -c user.email=atago@example.com commit -q -m initial}
      - run:
          shell: true
          command: printf 'more\n' >> repo/a.txt
      - fixture:
          file: cfg/config.yml
          content: |
            gui:
              nerdFontsVersion: "3"
              showFileTree: false
              showBottomLine: false
              showCommandLog: false
              showRandomTip: false
              showFileIcons: false
              showListFooter: false
            disableStartupPopups: true
            promptToReturnFromSubprocess: false
      - pty:
          command: lazygit -ucd ${workdir}/cfg -p ${workdir}/repo
          rows: 30
          cols: 120
          timeout: 20s
          clear_env: true
          pass_env: [PATH]
          session:
            - expect: "Unstaged changes"
            - send: "s"
            - expect: "Stash changes"
            - send: "probe stash"
            - send: {key: enter}
      - run:
          command: git -C repo stash list
      - assert:
          exit_code: 0
          stdout:
            contains:
              - stash@{0}
              - probe stash
      - run:
          command: git -C repo diff -- a.txt
      - assert:
          exit_code: 0
          stdout:
            empty: true

  - name: g then enter pops the selected stash entry back into the worktree
    only:
      command: lazygit --version
    skip:
      os: windows
    steps:
      - fixture: {file: repo/a.txt, content: "hello\n"}
      - run: {command: git init -q repo}
      - run: {command: git -C repo add a.txt}
      - run: {command: git -C repo -c user.name=atago -c user.email=atago@example.com commit -q -m initial}
      - run:
          shell: true
          command: printf 'more\n' >> repo/a.txt
      - run:
          command: git -C repo stash push -m probe
      - fixture:
          file: cfg/config.yml
          content: |
            gui:
              nerdFontsVersion: "3"
              showFileTree: false
              showBottomLine: false
              showCommandLog: false
              showRandomTip: false
              showFileIcons: false
              showListFooter: false
            disableStartupPopups: true
            promptToReturnFromSubprocess: false
      - pty:
          command: lazygit -ucd ${workdir}/cfg -p ${workdir}/repo stash
          rows: 30
          cols: 120
          timeout: 20s
          clear_env: true
          pass_env: [PATH]
          session:
            - expect: "stash@{0}"
            - send: "g"
            - expect: "Stash pop"
            - send: {key: enter}
      - run:
          command: git -C repo stash list
      - assert:
          exit_code: 0
          stdout:
            empty: true
      - run:
          command: git -C repo diff -- a.txt
      - assert:
          exit_code: 0
          stdout:
            contains: "+more"
