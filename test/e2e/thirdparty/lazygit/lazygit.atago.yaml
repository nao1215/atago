          timeout: 20s
          clear_env: true
          pass_env: [PATH]
          session:
            - expect: "Unstaged changes"
            - send: "d"
            - expect: "Discard changes"
            - send: {key: enter}
            # Quit so the step ends on its assertions: lazygit outlives the session
            # otherwise, and the pty step fails on its timeout instead.
            - send: "q"
      - run:
          command: git -C repo diff -- a.txt
      - assert:
          exit_code: 0
          stdout:
            empty: true

  - name: down then discard reverts only the second modified file
    only:
      command: lazygit --version
    skip:
      os: windows
    steps:
      - fixture: {file: repo/a.txt, content: "hello\n"}
      - fixture: {file: repo/b.txt, content: "world\n"}
      - run: {command: git init -q repo}
      - run: {command: git -C repo add a.txt b.txt}
      - run: {command: git -C repo -c user.name=atago -c user.email=atago@example.com commit -q -m initial}
      - run:
          shell: true
          command: printf 'more-a\n' >> repo/a.txt && printf 'more-b\n' >> repo/b.txt
      - fixture:
          file: cfg/config.yml
          content: |
            gui:
              nerdFontsVersion: "3"
              showFileTree: false
              showBottomLine: false
              showCommandLog: false
              showRandomTip: false
              showFileIcons: false
              showListFooter: false
            disableStartupPopups: true
            promptToReturnFromSubprocess: false
      - pty:
          command: lazygit -ucd ${workdir}/cfg -p ${workdir}/repo
          rows: 30
          cols: 120
          timeout: 20s
          clear_env: true
          pass_env: [PATH]
          session:
            - expect: "Unstaged changes"
            - send: {key: down}
            - send: "d"
            - expect: "Discard changes"
            - send: {key: enter}
            # Quit so the step ends on its assertions: lazygit outlives the session
            # otherwise, and the pty step fails on its timeout instead.
            - send: "q"
      - run:
          command: git -C repo diff -- a.txt
      - assert:
          exit_code: 0
          stdout:
            contains: "+more-a"
      - run:
          command: git -C repo diff -- b.txt
      - assert:
          exit_code: 0
          stdout:
            empty: true

  - name: n creates a new branch from the branch panel
    only:
      command: lazygit --version
    skip:
      os: windows
    steps:
      - fixture: {file: repo/a.txt, content: "hello\n"}
      - run: {command: git init -q repo}
      - run: {command: git -C repo add a.txt}
      - run: {command: git -C repo -c user.name=atago -c user.email=atago@example.com commit -q -m initial}
      - fixture:
          file: cfg/config.yml
          content: |
            gui:
              nerdFontsVersion: "3"
              showFileTree: false
              showBottomLine: false
              showCommandLog: false
              showRandomTip: false
              showFileIcons: false
              showListFooter: false
            disableStartupPopups: true
            promptToReturnFromSubprocess: false
      - pty:
          command: lazygit -ucd ${workdir}/cfg -p ${workdir}/repo branch
          rows: 30
          cols: 120
          timeout: 20s
          clear_env: true
          pass_env: [PATH]
          session:
            - expect: "Local branches"
            - send: "n"
            - expect: "New branch name"
            - send: "feature-one"
            - send: {key: enter}
            # Quit so the step ends on its assertions: lazygit outlives the session
            # otherwise, and the pty step fails on its timeout instead.
            - send: "q"
      - run:
          command: git -C repo branch --show-current
      - assert:
          exit_code: 0
          stdout:
            equals: feature-one

  - name: n creates a slash branch name from the branch panel
    only:
      command: lazygit --version
    skip:
      os: windows
    steps:
      - fixture: {file: repo/a.txt, content: "hello\n"}
      - run: {command: git init -q repo}
      - run: {command: git -C repo add a.txt}
      - run: {command: git -C repo -c user.name=atago -c user.email=atago@example.com commit -q -m initial}
      - fixture:
          file: cfg/config.yml
