version: "1"

suite:
  name: lazygit (third-party git TUI)
  description: |
    [lazygit](https://github.com/jesseduffield/lazygit) is a terminal interface
    in front of a real repository: keystrokes stage files, write commits,
    discard changes, create branches, and push and pop stashes.

    Both sides of that are asserted. The rendered screen must show the user what
    they expect at each checkpoint — otherwise the tool is unusable even when it
    works — and the repository underneath must have actually changed, checked by
    reading git state afterwards. A TUI test that only looked at the screen
    would pass on a version that draws a commit it never made.

# Install: see .github/workflows/thirdparty.yml for the pinned CI version.
# Session timeout: 20s. Raising it to 45s was tried and reverted: the lazygit leg
# went from 4 failed scenarios to 13 and from about a minute to six, because the
# failures land on the plain `git` step that FOLLOWS the pty step. Waiting longer
# only holds onto whatever the previous scenario left running, so the number is
# staying where it was until that is understood.
scenarios:
  - name: version prints the pinned release
    only:
      command: lazygit --version
    steps:
      - run:
          command: lazygit --version
      - assert:
          exit_code: 0
          stdout:
            contains: version=0.63.1

  - name: opening a dirty repository shows unstaged changes and quits cleanly
    only:
      command: lazygit --version
    skip:
      os: windows
    steps:
      - fixture: {file: repo/a.txt, content: "hello\n"}
      - run: {command: git init -q repo}
      - run: {command: git -C repo add a.txt}
      - run: {command: git -C repo -c user.name=atago -c user.email=atago@example.com commit -q -m initial}
      - run:
          shell: true
          command: printf 'more\n' >> repo/a.txt
      - fixture:
          file: cfg/config.yml
          content: |
            gui:
              nerdFontsVersion: "3"
              showFileTree: false
              showBottomLine: false
              showCommandLog: false
              showRandomTip: false
              showFileIcons: false
              showListFooter: false
            disableStartupPopups: true
            promptToReturnFromSubprocess: false
      - pty:
          command: lazygit -ucd ${workdir}/cfg -p ${workdir}/repo
          rows: 30
          cols: 120
          timeout: 20s
          clear_env: true
          pass_env: [PATH]
          session:
            - expect: "Unstaged changes"
            - send: "q"
      - assert:
          exit_code: 0

  - name: opening from a nested repository path rejects the subdirectory as invalid
    only:
      command: lazygit --version
    skip:
      os: windows
    steps:
      - fixture: {file: repo/sub/note.txt, content: "hello\n"}
      - run: {command: git init -q repo}
      - run: {command: git -C repo add sub/note.txt}
      - run: {command: git -C repo -c user.name=atago -c user.email=atago@example.com commit -q -m initial}
      - run:
          shell: true
          command: printf 'nested\n' >> repo/sub/note.txt
      - fixture:
          file: cfg/config.yml
          content: |
            gui:
              nerdFontsVersion: "3"
              showFileTree: false
              showBottomLine: false
              showCommandLog: false
              showRandomTip: false
              showFileIcons: false
              showListFooter: false
            disableStartupPopups: true
            promptToReturnFromSubprocess: false
      - pty:
          command: lazygit -ucd ${workdir}/cfg -p ${workdir}/repo/sub
          rows: 30
          cols: 120
          timeout: 20s
          clear_env: true
          pass_env: [PATH]
          session:
            - expect: "not a valid git repository"
            # Quit so the step ends on its assertions: lazygit outlives the session
            # otherwise, and the pty step fails on its timeout instead.
            - send: "q"
      - run:
          command: git -C repo status --porcelain
      - assert:
          exit_code: 0
          stdout:
            equals: " M sub/note.txt"

  - name: space stages the selected unstaged file
    only:
      command: lazygit --version
    skip:
      os: windows
    steps:
      - fixture: {file: repo/a.txt, content: "hello\n"}
      - fixture: {file: repo/b.txt, content: "new\n"}
      - run: {command: git init -q repo}
      - run: {command: git -C repo add a.txt}
      - run: {command: git -C repo -c user.name=atago -c user.email=atago@example.com commit -q -m initial}
      - run:
          shell: true
          command: printf 'more\n' >> repo/a.txt
      - fixture:
          file: cfg/config.yml
          content: |
            gui:
              nerdFontsVersion: "3"
              showFileTree: false
              showBottomLine: false
              showCommandLog: false
              showRandomTip: false
              showFileIcons: false
              showListFooter: false
            disableStartupPopups: true
            promptToReturnFromSubprocess: false
      - pty:
          command: lazygit -ucd ${workdir}/cfg -p ${workdir}/repo
          rows: 30
          cols: 120
          timeout: 20s
          clear_env: true
          pass_env: [PATH]
          session:
            - expect: "Unstaged changes"
            - send: " "
            - expect: "Staged changes"
            - send: "q"
      - run:
          command: git -C repo status --porcelain
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "M  a.txt"
              - "?? b.txt"

  - name: space stages an untracked file into the index
    only:
      command: lazygit --version
    skip:
      os: windows
    steps:
      - fixture: {file: repo/a.txt, content: "hello\n"}
      - fixture: {file: repo/b.txt, content: "new\n"}
      - run: {command: git init -q repo}
      - run: {command: git -C repo add a.txt}
      - run: {command: git -C repo -c user.name=atago -c user.email=atago@example.com commit -q -m initial}
      - fixture:
          file: cfg/config.yml
          content: |
            gui:
              nerdFontsVersion: "3"
              showFileTree: false
              showBottomLine: false
              showCommandLog: false
              showRandomTip: false
              showFileIcons: false
              showListFooter: false
            disableStartupPopups: true
            promptToReturnFromSubprocess: false
      - pty:
          command: lazygit -ucd ${workdir}/cfg -p ${workdir}/repo
          rows: 30
          cols: 120
          timeout: 20s
          clear_env: true
          pass_env: [PATH]
          session:
            - expect: "Unstaged changes"
            - send: " "
            - expect: "Staged changes"
            - send: "q"
      - run:
          command: git -C repo status --porcelain
      - assert:
          exit_code: 0
          stdout:
            equals: "A  b.txt"

  - name: down then space stages only the second modified file
    only:
      command: lazygit --version
    skip:
      os: windows
    steps:
      - fixture: {file: repo/a.txt, content: "hello\n"}
      - fixture: {file: repo/b.txt, content: "world\n"}
      - run: {command: git init -q repo}
      - run: {command: git -C repo add a.txt b.txt}
      - run: {command: git -C repo -c user.name=atago -c user.email=atago@example.com commit -q -m initial}
      - run:
          shell: true
          command: printf 'more-a\n' >> repo/a.txt && printf 'more-b\n' >> repo/b.txt
      - fixture:
          file: cfg/config.yml
          content: |
            gui:
              nerdFontsVersion: "3"
              showFileTree: false
              showBottomLine: false
              showCommandLog: false
              showRandomTip: false
              showFileIcons: false
              showListFooter: false
            disableStartupPopups: true
            promptToReturnFromSubprocess: false
      - pty:
          command: lazygit -ucd ${workdir}/cfg -p ${workdir}/repo
          rows: 30
          cols: 120
          timeout: 20s
          clear_env: true
          pass_env: [PATH]
          session:
            - expect: "Unstaged changes"
            - send: {key: down}
            - send: " "
            - expect: "Staged changes"
            - send: "q"
      - run:
          command: git -C repo status --porcelain
      - assert:
          exit_code: 0
          stdout:
            contains:
              - " M a.txt"
              - "M  b.txt"

  - name: space toggles a staged file back to unstaged
    only:
      command: lazygit --version
    skip:
      os: windows
    steps:
      - fixture: {file: repo/a.txt, content: "hello\n"}
      - run: {command: git init -q repo}
      - run: {command: git -C repo add a.txt}
      - run: {command: git -C repo -c user.name=atago -c user.email=atago@example.com commit -q -m initial}
      - run:
          shell: true
          command: printf 'more\n' >> repo/a.txt && git -C repo add a.txt
      - fixture:
          file: cfg/config.yml
          content: |
            gui:
              nerdFontsVersion: "3"
              showFileTree: false
              showBottomLine: false
              showCommandLog: false
              showRandomTip: false
              showFileIcons: false
              showListFooter: false
            disableStartupPopups: true
            promptToReturnFromSubprocess: false
      - pty:
          command: lazygit -ucd ${workdir}/cfg -p ${workdir}/repo
          rows: 30
          cols: 120
          timeout: 20s
          clear_env: true
          pass_env: [PATH]
          session:
            - expect: "Staged changes"
            - send: " "
            - expect: "Unstaged changes"
            - send: "q"
      - run:
          command: git -C repo status --porcelain
      - assert:
          exit_code: 0
          stdout:
            equals: " M a.txt"

  - name: space toggles an added file back to untracked
    only:
      command: lazygit --version
    skip:
      os: windows
    steps:
      - fixture: {file: repo/a.txt, content: "hello\n"}
      - fixture: {file: repo/b.txt, content: "new\n"}
      - run: {command: git init -q repo}
      - run: {command: git -C repo add a.txt}
      - run: {command: git -C repo -c user.name=atago -c user.email=atago@example.com commit -q -m initial}
      - run: {command: git -C repo add b.txt}
      - fixture:
          file: cfg/config.yml
          content: |
            gui:
              nerdFontsVersion: "3"
              showFileTree: false
              showBottomLine: false
              showCommandLog: false
              showRandomTip: false
              showFileIcons: false
              showListFooter: false
            disableStartupPopups: true
            promptToReturnFromSubprocess: false
      - pty:
          command: lazygit -ucd ${workdir}/cfg -p ${workdir}/repo
          rows: 30
          cols: 120
          timeout: 20s
          clear_env: true
          pass_env: [PATH]
          session:
            - expect: "Staged changes"
            - send: " "
            - expect: "Unstaged changes"
            - send: "q"
      - run:
          command: git -C repo status --porcelain
      - assert:
          exit_code: 0
          stdout:
            equals: "?? b.txt"

  - name: capital C commits staged changes through git's editor
    only:
      command: lazygit --version
    skip:
      os: windows
    steps:
      - fixture: {file: repo/a.txt, content: "hello\n"}
      - run: {command: git init -q repo}
      - run: {command: git -C repo add a.txt}
      - run: {command: git -C repo -c user.name=atago -c user.email=atago@example.com commit -q -m initial}
      - run: {command: git -C repo config user.name atago}
      - run: {command: git -C repo config user.email atago@example.com}
      - run:
          shell: true
          command: printf 'more\n' >> repo/a.txt
      - fixture:
          file: editor.sh
          content: |
            #!/bin/sh
            printf 'editor commit\n' > "$1"
      - run:
          shell: true
          command: chmod +x editor.sh
      - run:
          command: git -C repo config core.editor ${workdir}/editor.sh
      - fixture:
          file: cfg/config.yml
          content: |
            gui:
              nerdFontsVersion: "3"
              showFileTree: false
              showBottomLine: false
              showCommandLog: false
              showRandomTip: false
              showFileIcons: false
              showListFooter: false
            disableStartupPopups: true
            promptToReturnFromSubprocess: false
      - pty:
          command: lazygit -ucd ${workdir}/cfg -p ${workdir}/repo
          rows: 30
          cols: 120
          timeout: 20s
          clear_env: true
          pass_env: [PATH]
          session:
            - expect: "Unstaged changes"
            - send: " "
            - expect: "Staged changes"
            - send: "C"
            # Quit so the step ends on its assertions: lazygit outlives the session
            # otherwise, and the pty step fails on its timeout instead.
            - send: "q"
      - run:
          command: git -C repo log --oneline -1
      - assert:
          exit_code: 0
          stdout:
            contains: editor commit

  - name: capital C commits pre-staged changes and leaves a clean worktree
    only:
      command: lazygit --version
    skip:
      os: windows
    steps:
      - fixture: {file: repo/a.txt, content: "hello\n"}
      - run: {command: git init -q repo}
      - run: {command: git -C repo add a.txt}
      - run: {command: git -C repo -c user.name=atago -c user.email=atago@example.com commit -q -m initial}
      - run: {command: git -C repo config user.name atago}
      - run: {command: git -C repo config user.email atago@example.com}
      - run:
          shell: true
          command: printf 'more\n' >> repo/a.txt && git -C repo add a.txt
      - fixture:
          file: editor.sh
          content: |
            #!/bin/sh
            printf 'pre-staged commit\n' > "$1"
      - run:
          shell: true
          command: chmod +x editor.sh
      - run:
          command: git -C repo config core.editor ${workdir}/editor.sh
      - fixture:
          file: cfg/config.yml
          content: |
            gui:
              nerdFontsVersion: "3"
              showFileTree: false
              showBottomLine: false
              showCommandLog: false
              showRandomTip: false
              showFileIcons: false
              showListFooter: false
            disableStartupPopups: true
            promptToReturnFromSubprocess: false
      - pty:
          command: lazygit -ucd ${workdir}/cfg -p ${workdir}/repo
          rows: 30
          cols: 120
          timeout: 20s
          clear_env: true
          pass_env: [PATH]
          session:
            - expect: "Staged changes"
            - send: "C"
            # Quit so the step ends on its assertions: lazygit outlives the session
            # otherwise, and the pty step fails on its timeout instead.
            - send: "q"
      - run:
          command: git -C repo status --porcelain
      - assert:
          exit_code: 0
          stdout:
            empty: true
      - run:
          command: git -C repo log --oneline -1
      - assert:
          exit_code: 0
          stdout:
            contains: pre-staged commit

  - name: escape cancels the discard dialog and preserves the diff
    only:
      command: lazygit --version
    skip:
      os: windows
    steps:
      - fixture: {file: repo/a.txt, content: "hello\n"}
      - run: {command: git init -q repo}
      - run: {command: git -C repo add a.txt}
      - run: {command: git -C repo -c user.name=atago -c user.email=atago@example.com commit -q -m initial}
      - run:
          shell: true
          command: printf 'more\n' >> repo/a.txt
      - fixture:
          file: cfg/config.yml
          content: |
            gui:
              nerdFontsVersion: "3"
              showFileTree: false
              showBottomLine: false
              showCommandLog: false
              showRandomTip: false
              showFileIcons: false
              showListFooter: false
            disableStartupPopups: true
            promptToReturnFromSubprocess: false
      - pty:
          command: lazygit -ucd ${workdir}/cfg -p ${workdir}/repo
          rows: 30
          cols: 120
          timeout: 20s
          clear_env: true
          pass_env: [PATH]
          session:
            - expect: "Unstaged changes"
            - send: "d"
            - expect: "Discard changes"
            - send: {key: esc}
            # The dialog owns the keyboard until it is gone: a `q` sent right after
            # esc dismisses the dialog instead of quitting, and lazygit outlives the
            # session. Wait for the screen to prove the dialog closed.
            - expect_screen:
                not_contains: ["Discard changes"]
                stable_for: 100ms
            - send: "q"
      - run:
          command: git -C repo diff -- a.txt
      - assert:
          exit_code: 0
          stdout:
            contains: "+more"

  - name: enter accepts the discard dialog and reverts the diff
    only:
      command: lazygit --version
    skip:
      os: windows
    steps:
      - fixture: {file: repo/a.txt, content: "hello\n"}
      - run: {command: git init -q repo}
      - run: {command: git -C repo add a.txt}
      - run: {command: git -C repo -c user.name=atago -c user.email=atago@example.com commit -q -m initial}
      - run:
