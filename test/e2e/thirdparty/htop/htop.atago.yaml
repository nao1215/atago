version: "1"

suite:
  name: htop (third-party CLI, full-screen TUI testbed)
  description: |
    [htop](https://htop.dev/) is a full-screen program in the strict sense: it
    switches the terminal to the alternate screen buffer, paints meters and a
    process table with cursor movement and color, and restores what was there
    before when it quits.

    That is a harder thing to assert than scrolling output, and it is what this
    suite pins. The rendered frame is reconstructed the way a terminal would
    reconstruct it — following the alternate-screen switch and the cursor
    movements — so the assertion is about what a user sees on screen, not about
    the raw escape sequences that produced it. Quitting cleanly, and leaving the
    terminal in a usable state, is part of the contract too.

# Every scenario probes for htop first so the suite skips cleanly where it is
# absent; the interactive scenarios are POSIX-only.
scenarios:
  - name: version prints a semantic version
    only:
      command: htop --version
    steps:
      - run:
          command: htop --version
      - assert:
          exit_code: 0
          stdout:
            matches: "^htop [0-9]+\\.[0-9]+"

  - name: an unrecognized option is rejected without opening the TUI
    only:
      command: htop --version
    steps:
      # The failure branch the TUI scenarios cannot reach: an unknown flag makes
      # htop exit non-zero with a usage error on stderr, before it ever switches
      # to the alternate screen — no pty needed.
      - run:
          command: htop --nonexistent-flag
      - assert:
          exit_code:
            not: 0
          stderr:
            contains: "unrecognized option"

  - name: the finder loads its function-key bar and quits on q
    only:
      command: htop --version
    skip:
      os: windows
    steps:
      # htop paints on the alternate screen; the transcript still carries the
      # rendered text, so `expect` waits for the F10 quit label to prove the UI
      # loaded. `q` quits, htop restores the primary screen, and the process
      # exits 0 — the full clean lifecycle of an alt-screen TUI under the pty
      # runner.
      - pty:
          command: htop
          cols: 100
          rows: 30
          timeout: 20s
          session:
            - expect: "F10"
            - send: "q"
      - assert:
          exit_code: 0

  - name: the rendered screen shows the live meters and column header
    only:
      command: htop --version
    skip:
      os: windows
    steps:
      # `expect_screen:` replays the transcript through the vt100 emulator and
      # pins what the user actually SEES. It checks the frame while htop is
      # still on its alternate screen, because quitting restores the (empty)
      # primary one; then q ends the session instead of the step timeout.
      - pty:
          command: htop
          cols: 100
          rows: 30
          timeout: 20s
          session:
            - expect: "F10"
            - expect_screen:
                contains: "CPU%"
            - expect_screen:
                contains: "Command"
            - expect_screen:
                contains: "F10"
            - send: "q"
      - assert:
          exit_code: 0
