version: "1"

suite:
  name: getoptions (generating an option parser)
  description: |
    [getoptions](https://github.com/ko1nksm/getoptions) turns a short definition
    into a POSIX-shell option parser. Its own test suite is written in ShellSpec;
    what those tests check is pinned here from outside, by generating parsers and
    then running them.

    A generator is only as good as what it emits, so nothing here stops at "a
    file was written": every generated artifact is executed, and the assertions
    are about what the generated program does. The embed workflow gets the round
    trip it deserves — a script with the parser embedded runs with getoptions
    nowhere on PATH, and erasing the embedded block gives back the original file
    byte for byte.

defaults:
  scenario:
    only:
      command: command -v gengetoptions
    skip:
      os: windows
  run:
    sandbox_home: true
    env:
      LC_ALL: C

scenarios:
  - name: the version, the help, and a command that does not exist
    steps:
      - run:
          command: gengetoptions --version
      - assert:
          exit_code: 0
          stdout:
            matches: "^v[0-9]+\\.[0-9]+\\.[0-9]+\\n$"
      - run:
          command: gengetoptions --help
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "Usage: gengetoptions [options]... <command> [arguments]..."
              - "  library                Generate custom library"
              - "  parser                 Generate option parser"
              - "  embed                  Embed the generated library or parser"
      - run:
          command: gengetoptions --nope
      - assert:
          # The tool parses its own command line with the parser it generates,
          # so its errors are the errors it teaches: a plain sentence, on stderr,
          # at exit 1.
          exit_code: 1
          stdout:
            empty: true
          stderr:
            equals: |
              Unrecognized option: --nope

  - name: the printed example is a definition the generator accepts
    steps:
      - run:
          command: gengetoptions example
          stdout_to: definition.sh
      - assert:
          exit_code: 0
          changes:
            created: [definition.sh]
            modified: []
            deleted: []
      - assert:
          file:
            path: definition.sh
            contains:
              - "parser_definition() {"
              - "flag    FLAG    -f +f --{no-}flag"
      - run:
          # The example's usage line reads ${2##*/}, so the definition takes the
          # program name as an argument at generation time.
          command: gengetoptions parser -f definition.sh parser_definition parse prog
          stdout_to: parser.sh
      - assert:
          # The example is not decoration: it goes straight back in as input, and
          # the parser comes out.
          exit_code: 0
      - assert:
          file:
            path: parser.sh
            contains:
              - "# Generated by getoptions (BEGIN)"
              - "parse() {"
              - "# Generated by getoptions (END)"
      - run:
          command: gengetoptions parser -f definition.sh parser_definition parse
          stdout_to: underspecified.sh
      - assert:
          # And the trap on the other side of that: leave the argument out and
          # the shell's own complaint goes to stderr while the exit code stays 0.
          # What is written is a banner with no parser in it, so a build step
          # that checks only the status ships a program that parses nothing.
          exit_code: 0
          stderr:
            contains: "parameter not set"
      - assert:
          file:
            path: underspecified.sh
            not_contains: "parse() {"

  - name: the generated parser is a shell function that parses what the definition declared
    steps:
      - fixture:
          file: definition.sh
          content: |
            parser_definition() {
              setup   REST help:usage -- "Usage: tool [options]... [args]..." ''
              msg -- 'Options:'
              flag    VERBOSE -v --verbose -- "be noisy"
              param   NAME    -n --name    -- "who to greet"
              disp    :usage  -h --help
            }
      - run:
          command: gengetoptions parser -f definition.sh parser_definition parse
          stdout_to: parser.sh
      - assert:
          exit_code: 0
      - fixture:
          file: tool.sh
          mode: "0755"
          content: |
            #!/bin/sh
            set -eu
            . ./parser.sh
            parse "$@"
            eval "set -- $REST"
            echo "VERBOSE=[$VERBOSE] NAME=[$NAME] rest=[$*]"
      - run:
          command: ./tool.sh -v --name world alpha beta
      - assert:
          # The variables are named by the definition, the rest arguments survive
          # in order, and nothing else had to be written by hand.
          exit_code: 0
          stdout:
            equals: |
              VERBOSE=[1] NAME=[world] rest=[alpha beta]

  - name: the help text is generated from the same definition
    steps:
      - fixture:
          file: definition.sh
          content: |
            parser_definition() {
              setup   REST help:usage -- "Usage: tool [options]... [args]..." ''
              msg -- 'Options:'
              flag    VERBOSE -v --verbose -- "be noisy"
              param   NAME    -n --name    -- "who to greet"
              disp    :usage  -h --help
            }
      - run:
          shell: true
          command: gengetoptions parser -f definition.sh parser_definition parse > parser.sh
      - assert:
          exit_code: 0
      - fixture:
          file: tool.sh
          mode: "0755"
          content: |
            #!/bin/sh
            set -eu
            . ./parser.sh
            parse "$@"
      - run:
          command: ./tool.sh --help
      - assert:
          # One definition, two artifacts: the parser and the usage text a user
          # reads. They cannot drift apart, because there is nothing to keep in
          # sync — the descriptions after `--` are the help.
          exit_code: 0
          stdout:
            equals: |
              Usage: tool [options]... [args]...

              Options:
                -v, --verbose               be noisy
                -n, --name NAME             who to greet
                -h, --help                  

  - name: generation options change the artifact, not the behavior
    steps:
      - fixture:
          file: definition.sh
          content: |
            parser_definition() {
              setup   REST help:usage -- "Usage: tool [options]" ''
              flag    VERBOSE -v --verbose
            }
      - run:
          shell: true
          command: gengetoptions parser -f definition.sh parser_definition parse > tabs.sh
      - assert:
          exit_code: 0
      - run:
          shell: true
          command: gengetoptions parser -i2 -f definition.sh parser_definition parse > spaces.sh
      - assert:
          exit_code: 0
      - assert:
          file:
            path: tabs.sh
            contains: "\tcase $1 in"
      - assert:
          file:
            path: spaces.sh
            not_contains: "\tcase $1 in"
      - run:
          shell: true
          command: gengetoptions parser --no-comments -f definition.sh parser_definition parse > bare.sh
      - assert:
          # --no-comments strips the banner and the notes; what remains still has
          # to be the same parser, which is why both are sourced and run below.
          exit_code: 0
      - assert:
          file:
            path: bare.sh
            not_contains: "# Generated by getoptions (BEGIN)"
      - fixture:
          file: run.sh
          mode: "0755"
          content: |
            #!/bin/sh
            set -eu
            . "./$1"
            parse -v
            echo "VERBOSE=[$VERBOSE]"
      - run:
          command: ./run.sh spaces.sh
      - assert:
          exit_code: 0
          stdout:
            equals: |
              VERBOSE=[1]
      - run:
          command: ./run.sh bare.sh
      - assert:
          exit_code: 0
          stdout:
            equals: |
              VERBOSE=[1]

  - name: the library is generated on its own, with shellcheck directives on request
    steps:
      - run:
          shell: true
          command: gengetoptions library > library.sh
      - assert:
          exit_code: 0
      - assert:
          file:
            path: library.sh
            contains:
              - "getoptions() {"
              - "getoptions_help() {"
      - assert:
          file:
            path: library.sh
            not_contains: "# shellcheck disable=SC2016,SC2317"
      - run:
          shell: true
          command: gengetoptions library --shellcheck > checked.sh
      - assert:
          # The directives exist so the generated code passes a linter the author
          # of the script did not write and cannot annotate.
          exit_code: 0
      - assert:
          file:
            path: checked.sh
            contains: "# shellcheck disable=SC2016,SC2317"
            count: 3

  - name: embedding makes the script self-contained, and erasing gives the file back
    steps:
      - fixture:
          file: tool.sh
          mode: "0755"
          content: |
            #!/bin/sh
            set -eu

            # @getoptions
            parser_definition() {
              setup   REST help:usage -- "Usage: tool.sh [options]... [args]..." ''
              msg -- 'Options:'
              flag    VERBOSE -v --verbose -- "be noisy"
              param   NAME    -n --name    -- "who to greet"
              disp    :usage  -h --help
            }
            # @end

            # @gengetoptions parser -i parser_definition parse
            # @end

            parse "$@"
            eval "set -- $REST"
            echo "VERBOSE=[$VERBOSE] NAME=[$NAME] rest=[$*]"
      - fixture:
          file: tool.orig
          content: |
            #!/bin/sh
            set -eu

            # @getoptions
            parser_definition() {
              setup   REST help:usage -- "Usage: tool.sh [options]... [args]..." ''
              msg -- 'Options:'
              flag    VERBOSE -v --verbose -- "be noisy"
              param   NAME    -n --name    -- "who to greet"
              disp    :usage  -h --help
            }
            # @end

            # @gengetoptions parser -i parser_definition parse
            # @end

            parse "$@"
            eval "set -- $REST"
            echo "VERBOSE=[$VERBOSE] NAME=[$NAME] rest=[$*]"
      - run:
          command: gengetoptions embed --overwrite tool.sh
      - assert:
          # The script is rewritten in place, and it is the only file touched:
          # the definition inside it is the input, so there is nothing else to
          # keep beside it.
          exit_code: 0
          changes:
            created: []
            modified: [tool.sh]
            deleted: []
      - assert:
          file:
            path: tool.sh
            contains:
              - "# @gengetoptions parser -i parser_definition parse"
              - "# Generated by getoptions (BEGIN)"
              - "# Generated by getoptions (END)"
      - run:
          # The point of embedding: PATH holds neither gengetoptions nor the
          # getoptions library, and the script still parses its own options.
          shell: true
          command: PATH=/usr/bin:/bin ./tool.sh -v --name world alpha
      - assert:
          exit_code: 0
          stdout:
            equals: |
              VERBOSE=[1] NAME=[world] rest=[alpha]
      - run:
          command: gengetoptions embed --erase --overwrite tool.sh
      - assert:
          exit_code: 0
      - assert:
          # The round trip closes: what erasing leaves is the file as it was
          # written, byte for byte, so the generated block is never something a
          # reviewer has to read twice.
          file:
            path: tool.sh
            equals_file: tool.orig

  - name: an embed block that is never closed is refused
    steps:
      - fixture:
          file: broken.sh
          content: |
            #!/bin/sh
            # @gengetoptions parser -i parser_definition parse
            echo "no end directive here"
      - run:
          command: gengetoptions embed broken.sh
      - assert:
          # The generator will not guess where the block stops, and says which
          # directive is missing.
          exit_code: 1
          stderr:
            contains: "Missing @end directive"
          changes:
            created: []
            modified: []
            deleted: []
