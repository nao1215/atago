version: "1"

suite:
  name: jq (uncovered contracts — unicode passthrough + empty validation)
  description: |
    Two guarantees the main jq suite leaves untested.

    First, that jq is safe for text that is not ASCII: multibyte characters must
    survive a round trip byte for byte, with no re-encoding and no escaping
    applied on the way through.

    Second, that `jq empty` works as the validator everyone uses it as. It
    consumes the document, prints nothing at all, and exits 0 — but exits 5 on
    malformed input. That combination (silent on success, non-zero on garbage)
    is what makes it usable as a JSON check in a script, and both halves are
    pinned here.
defaults:
  scenario:
    # Every scenario here drives jq. Without the program there is nothing to
    # test, so the suite skips rather than erroring: a missing tool is not a
    # result. The gate is declared once so no scenario can be left out of it.
    only:
      command: jq --version

scenarios:
  - name: multibyte unicode passes through unchanged
    steps:
      - run:
          command: jq -c .
          stdin: '{"s":"café 😀 日本語"}'
      - assert:
          exit_code: 0
          stdout:
            equals: '{"s":"café 😀 日本語"}'

  - name: jq empty validates JSON — silent success, loud failure
    steps:
      - run:
          command: jq empty
          stdin: '{"a":1,"b":[2,3]}'
      - assert:
          exit_code: 0
          stdout:
            empty: true
          stderr:
            empty: true
      - run:
          command: jq empty
          stdin: "not json"
      # The parse-failure exit code changed across jq releases (1.6 exits 4,
      # 1.7 exits 5), so pin the documented set rather than one version.
      - assert:
          exit_code:
            in: [4, 5]
          stdout:
            empty: true
          stderr:
            contains: "parse error"
