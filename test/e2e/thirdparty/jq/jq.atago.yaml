version: "1"

suite:
  name: jq (third-party CLI, no build required)
  description: |
    [jq](https://jqlang.github.io/jq/) is a filter: JSON in on stdin, JSON out
    on stdout, and an exit code that tells the calling script what happened.

    That exit-code contract is unusually rich, and it is what this suite pins,
    because a shell pipeline depends on it: 0 when the filter ran, 1 when `-e`
    saw a false or null result, 2 for a usage or system error, 3 for a program
    that does not compile, and 5 when the input was not valid JSON at all. Four
    different kinds of "it didn't work", each of which a script may need to
    handle differently — and each of which must not be confused for the others.

# The unicode and `jq empty` contracts live in extra.atago.yaml.
defaults:
  scenario:
    # Every scenario here drives jq. Without the program there is nothing to
    # test, so the suite skips rather than erroring: a missing tool is not a
    # result. The gate is declared once so no scenario can be left out of it.
    only:
      command: jq --version

scenarios:
  - name: identity filter echoes the document from stdin
    steps:
      - run:
          command: jq -c .
          stdin: '{"b":2,"a":1}'
      - assert:
          exit_code: 0
          stdout:
            json:
              path: "$.a"
              equals: 1
          stderr:
            empty: true

  - name: sort-keys output is deterministic and exact
    steps:
      # stdin can come from a workdir file (#18) instead of an inline string —
      # the natural shape for large documents produced by fixtures or earlier
      # steps.
      - fixture:
          file: input.json
          content: '{"b":2,"a":1}'
      - run:
          command: jq -c --sort-keys .
          stdin:
            file: input.json
      - assert:
          exit_code: 0
          stdout:
            equals: '{"a":1,"b":2}'

  - name: raw output strips JSON quoting
    steps:
      - fixture:
          file: user.json
          content: |
            {"name":"alice","admin":true}
      - run:
          shell: true
          command: jq -r .name user.json
      - assert:
          exit_code: 0
          stdout:
            equals: alice

  - name: arguments flow in with --arg
    steps:
      - run:
          command: >-
            jq -c --arg who atago '{greeting: ("hello " + $who)}'
          stdin: "null"
      - assert:
          exit_code: 0
          stdout:
            json:
              path: "$.greeting"
              equals: hello atago

  - name: reduce aggregates an array
    steps:
      - fixture:
          file: nums.json
          content: "[1,2,3,4,5]"
      - run:
          shell: true
          command: "jq 'reduce .[] as $n (0; . + $n)' nums.json"
      - assert:
          exit_code: 0
          stdout:
            equals: "15"

  - name: -e exits 1 when the result is false
    steps:
      - run:
          command: jq -e '.missing'
          stdin: '{"present":1}'
      - assert:
          exit_code: 1

  - name: a program that does not compile exits 3 with a diagnostic on stderr
    steps:
      - run:
          command: jq '.foo['
          stdin: "{}"
      - assert:
          exit_code: 3
          stdout:
            empty: true
          stderr:
            contains: error

  - name: invalid JSON input fails loudly and keeps stdout clean
    steps:
      - run:
          command: jq .
          stdin: "not json at all"
      - assert:
          exit_code:
            not: 0
          stderr:
            contains: "parse error"

  - name: streaming several documents produces one result per document
    steps:
      - run:
          command: jq -c '.n * 2'
          stdin: |
            {"n":1}
            {"n":2}
      - assert:
          exit_code: 0
          stdout:
            line: 1
            equals: "2"
      - assert:
          stdout:
            line: 2
            equals: "4"
