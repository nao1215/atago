version: "1"

suite:
  name: hugo server (suite-wide service + http peer)
  description: |
    `hugo server` is the half of Hugo a developer actually looks at: the site,
    served over HTTP, rendered. This suite scaffolds a site, starts the real
    development server against it, and then asks for pages the way a browser
    would — so what is asserted is the HTML that reached the client.

    The ordering is the interesting constraint. A site must exist before a
    server can serve it, so the scaffold runs first and the server starts at
    exactly that point in the sequence, once, for the whole suite — the
    build-then-serve bootstrap every "run my app and test it" setup needs.

  # Like the caddy suite, this file assumes hugo is on PATH (make thirdparty
  # documents the toolset; CI installs it).
  setup:
    - run:
        command: hugo new site mysite --quiet
    - fixture:
        file: mysite/layouts/home.html
        content: '<!DOCTYPE html><html><body><h1>HOME</h1>{{ range site.RegularPages }}<a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ end }}</body></html>'
    - fixture:
        file: mysite/layouts/single.html
        content: '<!DOCTYPE html><html><body><article><h1>{{ .Title }}</h1>{{ .Content }}</article></body></html>'
    - fixture:
        file: mysite/layouts/list.html
        content: '<html><body>{{ range .Pages }}{{ .Title }}{{ end }}</body></html>'
    - run:
        command: hugo new content posts/hello.md
        cwd: mysite
    - service:
        name: hugo
        command: hugo server --source ${suitedir}/mysite --port 14140 --bind 127.0.0.1 --buildDrafts
        ready:
          log: "Web Server is available"
          timeout: 30s

permissions:
  network:
    allow: [127.0.0.1]

runners:
  site:
    type: http
    base_url: http://127.0.0.1:14140
    timeout: 10s

defaults:
  scenario:
    # Every scenario here drives hugo. Without the program there is nothing to
    # test, so the suite skips rather than erroring: a missing tool is not a
    # result. The gate is declared once so no scenario can be left out of it.
    only:
      command: hugo version

scenarios:
  - name: the home page lists the post
    steps:
      - http:
          runner: site
          method: GET
          path: /
      - assert:
          status: 200
          body:
            contains: HOME
      - assert:
          body:
            contains: /posts/hello/

  - name: the post page renders its title
    steps:
      - http:
          runner: site
          method: GET
          path: /posts/hello/
      - assert:
          status: 200
          body:
            contains: "<h1>Hello</h1>"

  - name: an unknown path is a 404
    steps:
      - http:
          runner: site
          method: GET
          path: /no/such/page/
      - assert:
          status: 404
