version: "1"

suite:
  name: hugo (scaffold + build CLI, tree-snapshot testbed)

# hugo is scaffolding + build + serve in one binary (#22). `hugo new site`
# generates a directory tree — the exact workload that motivates recursive
# dir assertions and directory-tree snapshots (#25) — and `hugo --minify`
# builds files worth asserting on. The server half lives in
# hugo_server.atago.yaml. Every scenario probes for hugo first so the suite
# skips cleanly where it is absent.
# Install: see .github/workflows/thirdparty.yml for the pinned CI version.
scenarios:
  - name: new site scaffolds the documented directory tree
    only:
      command: hugo version
    steps:
      - run:
          command: hugo new site mysite
      - assert:
          exit_code: 0
          stdout:
            contains: Congratulations
      # Recursive mode pins the whole scaffold in one block, including the
      # nested archetype, and rejects UNEXPECTED entries via the file count —
      # `contains` alone would pass on a scaffold that grew extra files.
      - assert:
          dir:
            path: mysite
            recursive: true
            contains:
              - archetypes
              - archetypes/default.md
              - assets
              - content
              - data
              - hugo.toml
              - i18n
              - layouts
              - static
              - themes
            count: 2
      - assert:
          file:
            path: mysite/hugo.toml
            contains: baseURL

  - name: new content plus a minimal layout builds the public tree
    only:
      command: hugo version
    steps:
      - run:
          command: hugo new site mysite --quiet
      # A theme-less site needs only these root templates (hugo >= 0.146
      # template system): home for /, single for leaf pages, list for
      # sections/taxonomies.
      - fixture:
          file: mysite/layouts/home.html
          content: '<!DOCTYPE html><html><body><h1>HOME</h1>{{ range site.RegularPages }}<a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ end }}</body></html>'
      - fixture:
          file: mysite/layouts/single.html
          content: '<!DOCTYPE html><html><body><article><h1>{{ .Title }}</h1>{{ .Content }}</article></body></html>'
      - fixture:
          file: mysite/layouts/list.html
          content: '<html><body>{{ range .Pages }}{{ .Title }}{{ end }}</body></html>'
      - run:
          command: hugo new content posts/hello.md
          cwd: mysite
      - assert:
          exit_code: 0
          file:
            path: mysite/content/posts/hello.md
            contains: draft
      - run:
          command: hugo --minify --buildDrafts
          cwd: mysite
      - assert:
          exit_code: 0
          file:
            path: mysite/public/index.html
            contains: HOME
      - assert:
          file:
            path: mysite/public/index.html
            contains: /posts/hello/
      - assert:
          file:
            path: mysite/public/posts/hello/index.html
            contains: "<h1>Hello</h1>"
      - assert:
          dir:
            path: mysite/public
            recursive: true
            contains:
              - index.html
              - sitemap.xml
              - posts/hello/index.html
            glob: "*.xml"

  - name: building outside a site directory fails with a config hint
    only:
      command: hugo version
    steps:
      # The scenario workdir is empty: no hugo.toml anywhere above it.
      - run:
          command: hugo
      - assert:
          exit_code: { not: 0 }
      - assert:
          stderr:
            matches: "(?i)config"

  - name: scaffolding into a non-empty directory is refused until --force
    only:
      command: hugo version
    steps:
      - fixture:
          file: occupied/keep.txt
          content: |
            not written by hugo
      - run:
          command: hugo new site occupied
      # hugo names the conflict and the flag that overrides it, rather than
      # failing bare. The pre-existing file must survive the refusal.
      - assert:
          exit_code: 1
          stderr:
            contains:
              - "already exists and is not empty"
              - "--force"
      - assert:
          file:
            path: occupied/keep.txt
            contains: not written by hugo
      - assert:
          dir:
            path: occupied
            not_contains: [hugo.toml]
      - run:
          command: hugo new site occupied --force
      - assert:
          exit_code: 0
          stdout:
            contains: Congratulations
      # --force scaffolds alongside the existing file instead of wiping it.
      - assert:
          dir:
            path: occupied
            contains: [hugo.toml, keep.txt]

  - name: creating content that already exists is refused
    only:
      command: hugo version
    steps:
      - run:
          command: hugo new site mysite --quiet
      - run:
          command: hugo new content posts/dup.md
          cwd: mysite
      - assert:
          exit_code: 0
      - run:
          command: hugo new content posts/dup.md
          cwd: mysite
      - assert:
          exit_code: 1
          stderr:
            contains: conflicts with existing content

  - name: drafts stay out of the build until --buildDrafts asks for them
    only:
      command: hugo version
    steps:
      - run:
          command: hugo new site mysite --quiet
      - fixture:
          file: mysite/layouts/home.html
          content: '<!DOCTYPE html><html><body><h1>HOME</h1></body></html>'
      - fixture:
          file: mysite/layouts/single.html
          content: '<html><body><h1>{{ .Title }}</h1></body></html>'
      - fixture:
          file: mysite/layouts/list.html
          content: '<html><body>list</body></html>'
      - run:
          command: hugo new content posts/draft-post.md
          cwd: mysite
      - assert:
          exit_code: 0
          file:
            path: mysite/content/posts/draft-post.md
            contains: "draft = true"
      - run:
          command: hugo --quiet
          cwd: mysite
      # Negative space: the draft must NOT be published by a default build.
      - assert:
          exit_code: 0
      - assert:
          dir:
            path: mysite/public/posts
            not_contains: [draft-post]
      - run:
          command: hugo --quiet --buildDrafts
          cwd: mysite
      # Same input, one flag flipped: now the page exists and renders.
      - assert:
          exit_code: 0
      - assert:
          dir:
            path: mysite/public/posts
            contains: [draft-post]
      - assert:
          file:
            path: mysite/public/posts/draft-post/index.html
            contains: "Draft Post"

  - name: rebuilding an unchanged site is byte-for-byte idempotent
    only:
      command: hugo version
    steps:
      - run:
          command: hugo new site mysite --quiet
      - fixture:
          file: mysite/layouts/home.html
          content: '<!DOCTYPE html><html><body><h1>HOME</h1></body></html>'
      - run:
          command: hugo --quiet
          cwd: mysite
      - assert:
          exit_code: 0
      # Building again over an already-built site changes nothing at all:
      # not the sources, and not even the rendered output, which pins the
      # generator as deterministic rather than merely non-destructive.
      # changes is content-based and exhaustive in both directions, so any
      # embedded timestamp or reordered map would show up here.
      - run:
          shell: true
          command: cd mysite && hugo --quiet
      - assert:
          exit_code: 0
          changes:
            created: []
            modified: []
            deleted: []
