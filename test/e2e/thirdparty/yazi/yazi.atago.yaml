          pass_env: [PATH]
          sandbox_home: true
          session:
            - expect: "keep.txt"
            - send: "a"
            - expect: "Create:"
            - send: "nested/"
            - send: {key: enter}
            - expect: "nested"
            - send: "q"
      - assert:
          exit_code: 0
      - assert:
          dir:
            path: nested
            exists: true

  - name: rename changes the hovered file name and nothing else
    only:
      command: yazi --version
    skip:
      os: windows
    steps:
      - fixture:
          file: old.txt
          content: old
      - pty:
          command: yazi .
          rows: 24
          cols: 100
          timeout: 45s
          clear_env: true
          pass_env: [PATH]
          sandbox_home: true
          session:
            - expect: "old.txt"
            - send: "r"
            - expect: "Rename:"
            - send: ".bak"
            - send: {key: enter}
      - assert:
          changes:
            ignore: [".atago-home/**"] # yazi writes its state dir on some runs only
            created:
              - old.bak.txt
            modified: []
            deleted:
              - old.txt
      - assert:
          file:
            path: old.txt
            exists: false
      - assert:
          file:
            path: old.bak.txt
            contains: old

  - name: yank then paste copies a file into a sibling directory
    only:
      command: yazi --version
    skip:
      os: windows
    steps:
      - fixture:
          file: src/alpha.txt
          content: alpha
      - fixture:
          file: dst/.keep
          content: ""
      - pty:
          command: yazi src
          rows: 24
          cols: 100
          timeout: 45s
          clear_env: true
          pass_env: [PATH]
          sandbox_home: true
          session:
            - expect: "alpha.txt"
            - send: "y"
            - send: "h"
            - expect: "src"
            - send: "k"
            - expect: "dst"
            - send: "l"
            - expect: "No items"
            - send: "p"
            - expect: "alpha.txt"
            - send: "Q"
      - assert:
          exit_code: 0
          changes:
            ignore: [".atago-home/**"] # yazi writes its state dir on some runs only
            created:
              - dst/alpha.txt
            modified: []
            deleted: []
      - assert:
          file:
            path: src/alpha.txt
            contains: alpha
      - assert:
          file:
            path: dst/alpha.txt
            contains: alpha

  - name: select-all then yank copies multiple files into a sibling directory
    only:
      command: yazi --version
    skip:
      os: windows
    steps:
      - fixture:
          file: src/a.txt
          content: a
      - fixture:
          file: src/b.txt
          content: b
      - fixture:
          file: dst/.keep
          content: ""
      - pty:
          command: yazi src
          rows: 24
          cols: 100
          timeout: 45s
          clear_env: true
          pass_env: [PATH]
          sandbox_home: true
          session:
            - expect: "a.txt"
            - send: {key: ctrl-a}
            - send: "y"
            - send: "h"
            - expect: "src"
            - send: "k"
            - expect: "dst"
            - send: "l"
            - expect: "No items"
            - send: "p"
            - send: "Q"
      - assert:
          exit_code: 0
          changes:
            ignore: [".atago-home/**"] # yazi writes its state dir on some runs only
            created:
              - dst/a.txt
              - dst/b.txt
            modified: []
            deleted: []
      - assert:
          file:
            path: dst/a.txt
            contains: a
      - assert:
          file:
            path: dst/b.txt
            contains: b

  - name: cut then paste moves a file into a sibling directory
    only:
      command: yazi --version
    skip:
