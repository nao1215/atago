            - expect: "alpha.txt"
            - send: "y"
            - send: "h"
            - expect: "src"
            - send: "k"
            - expect: "dst"
            - send: "l"
            - expect: "No items"
            - send: "p"
            - expect: "alpha.txt"
            - send: "Q"
      - assert:
          exit_code: 0
          changes:
