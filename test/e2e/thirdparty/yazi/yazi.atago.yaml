version: "1"

suite:
  name: yazi (third-party terminal file manager)
  description: |
    [yazi](https://yazi-rs.github.io/) is a file manager, so every keystroke is
    a potential file operation. A test that only checked the screen would pass
    on a version that draws a successful copy it never performed — and on a file
    manager, that class of bug destroys data.

    So both are asserted throughout: what the terminal displays, and what
    actually happened on disk afterwards.

    This suite covers the core interactions — hidden files staying hidden until
    toggled, live filtering narrowing the list, creating files and directories,
    renaming exactly one entry and nothing else, yank/paste and cut/paste
    between directories, and permanent deletion including the case where the
    confirmation is declined and the file must survive.

    The remaining yazi suites break out selection semantics, entry arguments,
    navigation and tabs, search, and hardlinks and overwrites.

# Install: see .github/workflows/thirdparty.yml for the pinned CI version.
# Session timeout: 45s. It bounds how long a session waits for a screen, and
# nothing else — every expect and every assertion is unchanged. 20s was enough on
# a quiet machine but not on a loaded CI runner, where the same specs and the same
# pinned binary alternated red and green from one scheduled run to the next.
scenarios:
  - name: version prints a semantic version banner
    only:
      command: yazi --version
    steps:
      - run:
          command: yazi --version
      - assert:
          exit_code: 0
          stdout:
            matches: "^Yazi [0-9]+\\.[0-9]+\\.[0-9]+"

  - name: hidden files stay hidden by default
    only:
      command: yazi --version
    skip:
      os: windows
    steps:
      - fixture:
          file: alpha.txt
          content: ""
      - fixture:
          file: .secret
          content: ""
      - pty:
          command: yazi .
          rows: 24
          cols: 100
          timeout: 5s
          clear_env: true
          pass_env: [PATH]
          sandbox_home: true
          session:
            - expect: "alpha.txt"
      - assert:
          screen:
            contains: alpha.txt
      - assert:
          screen:
            not_contains: .secret

  - name: dot toggles hidden files into view
    only:
      command: yazi --version
    skip:
      os: windows
    steps:
      - fixture:
          file: alpha.txt
          content: ""
      - fixture:
          file: .secret
          content: ""
      - pty:
          command: yazi .
          rows: 24
          cols: 100
          timeout: 5s
          clear_env: true
          pass_env: [PATH]
          sandbox_home: true
          session:
            - expect: "alpha.txt"
            - send: "."
            - expect: "\\.secret"
      - assert:
          screen:
            contains: alpha.txt
      - assert:
          screen:
            contains: .secret

  - name: filter narrows the visible file list
    only:
      command: yazi --version
    skip:
      os: windows
    steps:
      - fixture:
          file: alpha.txt
          content: ""
      - fixture:
          file: beta.txt
          content: ""
      - fixture:
          file: gamma.log
          content: ""
      - pty:
          command: yazi .
          rows: 24
          cols: 100
          timeout: 5s
          clear_env: true
          pass_env: [PATH]
          sandbox_home: true
          session:
            - expect: "alpha.txt"
            - send: "f"
            - expect: "Filter:"
            - send: "beta"
            - expect: "filter: beta"
      - assert:
          screen:
            contains: beta.txt
      - assert:
          screen:
            not_contains: alpha.txt
      - assert:
          screen:
            not_contains: gamma.log

  - name: create makes a new file
    only:
      command: yazi --version
    skip:
      os: windows
    steps:
      - fixture:
          file: keep.txt
          content: keep
      - pty:
          command: yazi ${workdir}
          rows: 24
          cols: 100
          timeout: 45s
          clear_env: true
          pass_env: [PATH]
          sandbox_home: true
          session:
            - expect: "keep.txt"
            - send: "a"
            - expect: "Create:"
            - send: "notes.txt"
            - send: {key: enter}
            - expect: "notes.txt"
            - send: "q"
      - assert:
          exit_code: 0
          changes:
            ignore: [".atago-home/**"] # yazi writes its state dir on some runs only
            created:
              - notes.txt
            modified: []
            deleted: []
      - assert:
          file:
            path: notes.txt
            exists: true

  - name: create with a trailing slash makes a directory
    only:
      command: yazi --version
    skip:
      os: windows
    steps:
      - fixture:
          file: keep.txt
          content: ""
      - pty:
