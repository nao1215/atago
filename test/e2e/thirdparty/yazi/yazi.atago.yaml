version: "1"

suite:
  name: yazi (third-party terminal file manager)

# yazi is not just "a screen that appears": its core contract is that real file
# operations are driven from a TUI with typed inputs, modal keybindings, live
# filtering, and shell-wrapper cwd handoff. These scenarios therefore pin both
# the rendered terminal UI and the actual filesystem effects under the scenario
# workdir. Install: see .github/workflows/thirdparty.yml for the pinned CI
# version.
scenarios:
  - name: version prints a semantic version banner
    only:
      command: yazi --version
    steps:
      - run:
          command: yazi --version
      - assert:
          exit_code: 0
          stdout:
            matches: "^Yazi [0-9]+\\.[0-9]+\\.[0-9]+"

  - name: hidden files stay hidden by default
    only:
      command: yazi --version
    skip:
      os: windows
    steps:
      - fixture:
          file: alpha.txt
          content: ""
      - fixture:
          file: .secret
          content: ""
      - pty:
          command: yazi .
          rows: 24
          cols: 100
          timeout: 5s
          clear_env: true
          pass_env: [PATH]
          sandbox_home: true
          session:
            - expect: "alpha.txt"
      - assert:
          screen:
            contains: alpha.txt
      - assert:
          screen:
            not_contains: .secret

  - name: dot toggles hidden files into view
    only:
      command: yazi --version
    skip:
      os: windows
    steps:
      - fixture:
          file: alpha.txt
          content: ""
      - fixture:
          file: .secret
          content: ""
      - pty:
          command: yazi .
          rows: 24
          cols: 100
          timeout: 5s
          clear_env: true
          pass_env: [PATH]
          sandbox_home: true
          session:
            - expect: "alpha.txt"
            - send: "."
            - expect: "\\.secret"
      - assert:
          screen:
            contains: alpha.txt
      - assert:
          screen:
            contains: .secret

  - name: filter narrows the visible file list
    only:
      command: yazi --version
    skip:
      os: windows
    steps:
      - fixture:
          file: alpha.txt
          content: ""
      - fixture:
          file: beta.txt
          content: ""
      - fixture:
          file: gamma.log
          content: ""
      - pty:
          command: yazi .
          rows: 24
          cols: 100
          timeout: 5s
          clear_env: true
          pass_env: [PATH]
          sandbox_home: true
          session:
            - expect: "alpha.txt"
            - send: "f"
            - expect: "Filter:"
            - send: "beta"
            - expect: "filter: beta"
      - assert:
          screen:
            contains: beta.txt
      - assert:
          screen:
            not_contains: alpha.txt
      - assert:
          screen:
            not_contains: gamma.log

  - name: create makes a new file
    only:
      command: yazi --version
    skip:
      os: windows
    steps:
      - fixture:
          file: keep.txt
          content: keep
      - pty:
          command: yazi .
          rows: 24
          cols: 100
          timeout: 20s
          clear_env: true
          pass_env: [PATH]
          sandbox_home: true
          session:
            - expect: "keep.txt"
            - send: "a"
            - expect: "Create:"
            - send: "notes.txt"
            - send: {key: enter}
            - expect: "notes.txt"
            - send: "q"
      - assert:
          exit_code: 0
          changes:
            created:
              - notes.txt
            modified: []
            deleted: []
      - assert:
          file:
            path: notes.txt
            exists: true

  - name: create with a trailing slash makes a directory
    only:
