            - send: "x"
            - send: "X"
            - send: "h"
            - expect: "src"
            - send: "k"
            - expect: "dst"
            - send: "l"
            - expect: "No items"
            - send: "p"
            - send: "Q"
      - assert:
          exit_code: 0
          changes:
            ignore: [".atago-home/**"] # yazi writes its state dir on some runs only
