          clear_env: true
          pass_env: [PATH]
          sandbox_home: true
          session:
            - expect: "a one"
            - send: {key: ctrl-a}
            - send: {key: esc}
            - send: "j"
            - expect: "b two"
            - send: {key: enter}
      - assert: {file: {path: chosen.txt, contains: "/b two"}}
