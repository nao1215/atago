version: "1"

suite:
  name: transfer.sh (self-hosted file sharing)
  description: |
    [transfer.sh](https://github.com/dutchcoders/transfer.sh) takes a file and
    gives you a URL to fetch it back from. The only guarantee that matters is
    that what comes back is what went in.

    So this suite tests it with binary data rather than text. A PNG is uploaded
    as a raw request body, the share URL is captured from the response, the file
    is downloaded back to disk, and the bytes are compared to the original —
    both as a valid image and byte for byte. Text survives a lot of accidental
    mangling that binary does not.

    The browser-style multipart upload path is exercised as well, since that is
    how a file arrives from a web form rather than from `curl`.

# Each server scenario binds its own port so the suite runs under the default
# scenario concurrency. Install: see .github/workflows/thirdparty.yml for the
# pinned CI version.

permissions:
  network:
    allow: [127.0.0.1]

runners:
  share:
    type: http
    base_url: http://127.0.0.1:18210
    timeout: 15s
  share2:
    type: http
    base_url: http://127.0.0.1:18211
    timeout: 15s

defaults:
  scenario:
    # Every scenario here drives transfer.sh. Without the program there is nothing to
    # test, so the suite skips rather than erroring: a missing tool is not a
    # result. The gate is declared once so no scenario can be left out of it.
    only:
      command: transfer.sh --help

scenarios:
  - name: the binary reports its version
    steps:
      - run:
          command: transfer.sh version
      - assert:
          exit_code: 0
          stdout:
            contains: transfer.sh

  - name: a binary upload round-trips byte-for-byte
    services:
      - name: transfersh
        command: transfer.sh --provider local --basedir storage --temp-path tmp --listener 127.0.0.1:18210
        ready:
          port: 127.0.0.1:18210
          timeout: 15s
    steps:
      # The service reads these directories at startup; leading fixtures are
      # applied before it boots.
      - fixture:
          file: storage/.keep
          content: ""
      - fixture:
          file: tmp/.keep
          content: ""
      # A real 1x1 PNG — binary content that would not survive a string body.
      - fixture:
          file: pixel.png
          base64: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGNocFBoAAADhQFhC+q+qAAAAABJRU5ErkJggg==
      # Upload: the file's raw bytes are the request body (curl --upload-file).
      - http:
          runner: share
          method: PUT
          path: /pixel.png
          body_file: pixel.png
      - assert:
          status: 200
          body:
            contains: http://127.0.0.1:18210/
      # The response body is the share URL; capture it and download it back.
      - store:
          name: share_url
          from:
            body:
              matches: "http://[^\\s]+"
      - http:
          runner: share
          method: GET
          path: ${share_url}
          body_to: downloaded.png
      - assert:
          status: 200
          image:
            path: downloaded.png
            format: png
            width: 1
            height: 1
      # Byte-for-byte: what came back is exactly what went up.
      - run:
          command: cmp pixel.png downloaded.png
      - assert:
          exit_code: 0

  - name: a browser-style multipart upload is accepted too
    services:
      - name: transfersh
        command: transfer.sh --provider local --basedir storage --temp-path tmp --listener 127.0.0.1:18211
        ready:
          port: 127.0.0.1:18211
          timeout: 15s
    steps:
      - fixture:
          file: storage/.keep
          content: ""
      - fixture:
          file: tmp/.keep
          content: ""
      - fixture:
          file: notes.txt
          content: "shared through a multipart form"
      - http:
          runner: share2
          method: POST
          path: /
          files:
            - field: file
              path: notes.txt
      - assert:
          status: 200
          body:
            contains: http://127.0.0.1:18211/
      - store:
          name: share_url
          from:
            body:
              matches: "http://[^\\s]+"
      - http:
          runner: share2
          method: GET
          path: ${share_url}
      - assert:
          status: 200
          body:
            contains: shared through a multipart form
      # An unknown token serves nothing.
      - http:
          runner: share2
          method: GET
          path: /no-such-token/notes.txt
      - assert:
          status: 404
