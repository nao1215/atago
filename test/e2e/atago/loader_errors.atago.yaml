version: "1"

suite:
  name: atago self-hosting / loader rejects malformed specs

# A spec author's first feedback loop is the loader: a malformed spec must fail
# fast, before anything runs, with a positioned message that names the offending
# field — not a stack trace or a mid-run surprise. Each scenario feeds atago a
# deliberately broken inner spec and asserts the exit code is 2 (a load error)
# and the message identifies the problem. The inner specs never execute a step,
# so these are OS-independent and run in the Windows portable subset.
scenarios:
  - name: an empty scenario list is rejected
    steps:
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite: {name: x}
            scenarios: []
      - run: {command: "${atago} run bad.atago.yaml"}
      - assert:
          exit_code: 2
          stderr: {contains: "must contain at least one scenario"}

  - name: a wrong version string is rejected
    steps:
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "9"
            suite: {name: x}
            scenarios: [{name: a, steps: [{run: {command: echo}}]}]
      - run: {command: "${atago} run bad.atago.yaml"}
      - assert:
          exit_code: 2
          stderr: {contains: 'version must be "1"'}

  - name: an unknown top-level field is rejected with its position
    steps:
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite: {name: x}
            scenariosss: []
      - run: {command: "${atago} run bad.atago.yaml"}
      - assert:
          exit_code: 2
          stderr: {contains: 'unknown field "scenariosss"'}

  - name: a step that sets two actions is rejected
    steps:
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite: {name: x}
            scenarios:
              - name: a
                steps:
                  - run: {command: echo}
                    fixture: {file: f, content: c}
      - run: {command: "${atago} run bad.atago.yaml"}
      - assert:
          exit_code: 2
          stderr: {contains: "must set exactly one action"}

  - name: a stream assertion with no matcher is rejected
    steps:
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite: {name: x}
            scenarios:
              - name: a
                steps:
                  - run: {command: echo}
                  - assert: {stdout: {}}
      - run: {command: "${atago} run bad.atago.yaml"}
      - assert:
          exit_code: 2
          stderr: {contains: "must set at least one matcher"}

  - name: combining equals with another matcher is rejected
    steps:
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite: {name: x}
            scenarios:
              - name: a
                steps:
                  - run: {command: echo}
                  - assert: {stdout: {equals: hi, contains: h}}
      - run: {command: "${atago} run bad.atago.yaml"}
      - assert:
          exit_code: 2
          stderr: {contains: "cannot be combined with another matcher"}

  - name: a line index below one is rejected
    steps:
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite: {name: x}
            scenarios:
              - name: a
                steps:
                  - run: {command: echo}
                  - assert: {stdout: {line: 0, equals: x}}
      - run: {command: "${atago} run bad.atago.yaml"}
      - assert:
          exit_code: 2
          stderr: {contains: "line must be >= 1"}

  - name: combining a line selector with json is rejected
    steps:
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite: {name: x}
            scenarios:
              - name: a
                steps:
                  - run: {command: echo}
                  - assert: {stdout: {line: 1, json: [{path: "$.k", equals: 1}]}}
      - run: {command: "${atago} run bad.atago.yaml"}
      - assert:
          exit_code: 2
          stderr: {contains: "cannot be combined with json/yaml/snapshot"}

  - name: a duplicate scenario name is rejected
    steps:
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite: {name: x}
            scenarios:
              - {name: dup, steps: [{run: {command: echo}}]}
              - {name: dup, steps: [{run: {command: echo}}]}
      - run: {command: "${atago} run bad.atago.yaml"}
      - assert:
          exit_code: 2
          stderr: {contains: 'duplicate scenario name "dup"'}

  - name: an empty run command is rejected
    steps:
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite: {name: x}
            scenarios: [{name: a, steps: [{run: {command: ""}}]}]
      - run: {command: "${atago} run bad.atago.yaml"}
      - assert:
          exit_code: 2
          stderr: {contains: "run.command is required"}

  - name: an unparseable timeout is rejected with an example
    steps:
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite: {name: x}
            scenarios: [{name: a, steps: [{run: {command: echo, timeout: "soon"}}]}]
      - run: {command: "${atago} run bad.atago.yaml"}
      - assert:
          exit_code: 2
          stderr: {contains: "is not a valid duration"}

  - name: a fixture with two content sources is rejected
    steps:
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite: {name: x}
            scenarios: [{name: a, steps: [{fixture: {file: f, content: c, base64: "QQ=="}}]}]
      - run: {command: "${atago} run bad.atago.yaml"}
      - assert:
          exit_code: 2
          stderr: {contains: "set only one of content, base64, from, or symlink"}

  - name: an absolute changes glob is rejected as not workdir-relative
    steps:
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite: {name: x}
            scenarios:
              - name: a
                steps:
                  - run: {command: echo}
                  - assert: {changes: {created: ["/etc/passwd"]}}
      - run: {command: "${atago} run bad.atago.yaml"}
      - assert:
          exit_code: 2
          stderr: {contains: "must be workdir-relative, not absolute"}

  - name: the inline stdin form is a scalar, not a mapping key
    steps:
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite: {name: x}
            scenarios: [{name: a, steps: [{run: {command: cat, stdin: {inline: hi}}}]}]
      - run: {command: "${atago} run bad.atago.yaml"}
      - assert:
          exit_code: 2
          stderr: {contains: 'unknown key "inline"'}

  - name: a wrong-typed exit_code is rejected with its position and excerpt
    steps:
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite: {name: x}
            scenarios:
              - name: a
                steps:
                  - run: {command: echo}
                  - assert:
                      exit_code: zero
      - run: {command: "${atago} run bad.atago.yaml"}
      - assert:
          exit_code: 2
          # The union-shape error is positioned like a typo'd key: [line:col]
          # pointing at the offending value, plus the source excerpt — not a
          # bare message the author must hunt for across the spec.
          stderr:
            contains:
              - "[8:22]"
              - "exit_code must be an integer"
              - "exit_code: zero"

  # Pointing atago at the wrong place should say what atago was doing there.
  - name: a missing target names the reason without syscall noise
    steps:
      - run:
          command: ${atago} run no-such-spec.atago.yaml
      - assert:
          exit_code: 3
          # The reason is the OS's own wording, so only the shape atago controls
          # is pinned: the quoted path, once, with no syscall wrapper repeating it.
          stderr:
            contains: 'cannot access "no-such-spec.atago.yaml": '
      - assert:
          stderr:
            not_contains: "stat no-such-spec"

  - name: an empty directory says how to create a first spec
    steps:
      - run:
          shell: true
          command: mkdir specs
      - run:
          command: ${atago} run specs
      - assert:
          exit_code: 3
          stderr:
            contains:
              - "no *.atago.yaml"
              - "specs"
              - "atago init"

  # A cwd is documented as workdir-relative, and a `../` one used to run the
  # command wherever it landed — at the filesystem root for enough of them —
  # while every assertion still looked at the untouched sandbox. It is refused
  # before the command runs, like every other workdir-relative path.
  - name: a cwd that traverses out of the workdir is refused before running
    steps:
      - fixture:
          file: escape.atago.yaml
          content: |
            version: "1"
            suite:
              name: inner
            scenarios:
              - name: runs somewhere else
                steps:
                  - run:
                      shell: true
                      command: pwd
                      cwd: "../../../.."
      - run:
          command: ${atago} run escape.atago.yaml
      - assert:
          exit_code: 2
          stderr:
            contains:
              - "run.cwd"
              - "escapes the scenario workdir"
      # A sub-directory of the workdir is what cwd is for, and still loads.
      - fixture:
          file: ok.atago.yaml
          content: |
            version: "1"
            suite:
              name: inner
            scenarios:
              - name: runs in a sub-directory
                steps:
                  - run: {shell: true, command: "mkdir -p sub"}
                  - run: {shell: true, command: "pwd", cwd: sub}
                  - assert:
                      exit_code: 0
                      stdout:
                        contains: sub
      - run:
          command: ${atago} run ok.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains: "1 passed"

  - name: a gate with no condition is rejected
    steps:
      # `only: {}` reads as "this scenario is restricted" and restricts nothing.
      # It is the shape left behind on the way to a gate that was never
      # finished, or after the condition was deleted.
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite: {name: x}
            scenarios:
              - name: a
                only: {}
                steps: [{run: {command: echo}}]
      - run: {command: "${atago} run bad.atago.yaml"}
      - assert:
          exit_code: 2
          stderr: {contains: "only must name a condition (os, env, or command)"}

  - name: skip and only naming the same condition are rejected
    steps:
      # Gated both ways by one condition, the scenario is skipped whether the
      # condition holds or not: it can never run on any machine, and reports as
      # an ordinary skip with exit 0 forever.
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite: {name: x}
            scenarios:
              - name: a
                skip: {os: linux}
                only: {os: linux}
                steps: [{run: {command: echo}}]
      - run: {command: "${atago} run bad.atago.yaml"}
      - assert:
          exit_code: 2
          stderr:
            contains:
              - "skip.os and only.os both name"
              - "can never run anywhere"

  - name: gates naming different fields still load
    steps:
      # The refusal is per field and literal: a POSIX-only scenario that also
      # needs a tool installed is an ordinary spec.
      - fixture:
          file: ok.atago.yaml
          content: |
            version: "1"
            suite: {name: x}
            scenarios:
              - name: a
                skip: {os: windows}
                only: {command: "no-such-tool-zzz"}
                steps: [{run: {command: echo}}]
      - run: {command: "${atago} run ok.atago.yaml"}
      - assert:
          exit_code: 0
          stdout: {contains: "1 skipped"}

  - name: an empty deterministic compare list is rejected
    steps:
      # An empty list is not "compare nothing": the default (stdout, exit_code)
      # applied, so the run compared observables the author had just asked it
      # not to.
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite: {name: x}
            scenarios:
              - name: a
                steps: [{run: {command: echo, deterministic: {compare: []}}}]
      - run: {command: "${atago} run bad.atago.yaml"}
      - assert:
          exit_code: 2
          stderr: {contains: "deterministic.compare must not be empty"}

  - name: an empty-matching pattern under a count bound is rejected
    steps:
      # Zero-width matches are counted, so "q*" reports one match per position:
      # max_count: 0 — the documented way to say "never" — could never pass, and
      # the count reported the length of the stream rather than the pattern.
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite: {name: x}
            scenarios:
              - name: a
                steps:
                  - run: {command: echo}
                  - assert: {stdout: {matches: "q*", max_count: 0}}
      - run: {command: "${atago} run bad.atago.yaml"}
      - assert:
          exit_code: 2
          stderr: {contains: "matches the empty string"}

  - name: an empty-matching store capture is rejected
    steps:
      # The capture takes the first match, which is the empty string at position
      # 0, so the store held "" for output that plainly carried the value — a
      # wrong value flowing into later steps with no diagnostic at all.
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite: {name: x}
            scenarios:
              - name: a
                steps:
                  - run: {command: echo}
                  - store: {name: v, from: {stdout: {matches: "[0-9]*"}}}
      - run: {command: "${atago} run bad.atago.yaml"}
      - assert:
          exit_code: 2
          stderr: {contains: "captures \"\" from any output"}

  - name: an empty-matching scrub rule is rejected
    steps:
      # Such a rule matches between every byte, so it replaced the whole
      # snapshot with placeholders — green, committed, and unreadable.
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite: {name: x}
            scrub:
              - {pattern: "[0-9]*", placeholder: "<ID>"}
            scenarios:
              - name: a
                steps: [{run: {command: echo}}]
      - run: {command: "${atago} run bad.atago.yaml"}
      - assert:
          exit_code: 2
          stderr: {contains: "matches between every byte"}

  - name: matchers of one assert that contradict each other are rejected
    steps:
      # Such an assert used to run and then blame the program under test: "the
      # substring was unexpectedly present" is a statement about the CLI, for an
      # assertion no output could have satisfied.
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite: {name: x}
            scenarios:
              - name: a
                steps:
                  - run: {command: echo}
                  - assert: {stdout: {contains: [abc], not_contains: [abc]}}
              - name: b
                steps:
                  - assert: {dir: {path: d, contains: [x], count: 0}}
      - run: {command: "${atago} run bad.atago.yaml"}
      - assert:
          exit_code: 2
          stderr:
            contains:
              - 'contains and not_contains both list "abc"'
              - "count: 0 cannot hold together with contains"

  - name: a file assertion with no matcher names the size bounds too
    steps:
      # The message used to list the content matchers only, while a size bound
      # alone is a complete file assertion, so the author was sent looking for a
      # matcher they may not have needed.
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite: {name: x}
            scenarios:
              - name: a
                steps:
                  - run: {command: echo}
                  - assert: {file: {path: out.txt}}
      - run: {command: "${atago} run bad.atago.yaml"}
      - assert:
          exit_code: 2
          stderr:
            contains:
              - "must set one of exists/contains/not_contains/executable/equals/equals_file/json/snapshot/size/min_size/max_size"

  - name: a file assertion with two content matchers still names only those
    steps:
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite: {name: x}
            scenarios:
              - name: a
                steps:
                  - run: {command: echo}
                  - assert: {file: {path: out.txt, exists: true, snapshot: s.txt}}
      - run: {command: "${atago} run bad.atago.yaml"}
      - assert:
          exit_code: 2
          stderr:
            contains:
              - "must set exactly one of exists/contains/not_contains/executable/equals/equals_file/json/snapshot"
