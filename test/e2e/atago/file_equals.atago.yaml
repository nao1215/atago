version: "1"

suite:
  name: atago self-hosting / file equals and equals_file byte-equality (#155)

# Byte-exact file content matchers for round-trip and idempotence tests:
# `equals` compares a file's bytes to an inline literal, and `equals_file`
# compares two runtime-produced files to each other. Neither normalizes CRLF or
# a trailing newline — the point is to prove two files are byte-identical, which
# a POSIX `cmp` step cannot express portably (it breaks on Windows cmd).
scenarios:
  - name: equals_file passes for two byte-identical files
    steps:
      - fixture:
          file: in.hex
          content: "DEADBEEF"
      # A no-shell round-trip: atago writes the same bytes to out.hex via a
      # stdout redirect, then equals_file proves the two files match.
      - fixture:
          file: out.hex
          content: "DEADBEEF"
      - assert:
          file:
            path: out.hex
            equals_file: in.hex

  - name: equals matches an inline literal byte-for-byte
    steps:
      - fixture:
          file: token.txt
          content: "opaque-value-42"
      - assert:
          file:
            path: token.txt
            equals: "opaque-value-42"

  - name: equals_file fails the inner spec when the two files differ by one byte
    steps:
      - fixture:
          file: neq.atago.yaml
          content: |
            version: "1"
            suite:
              name: inner
            scenarios:
              - name: two files differ by one byte
                steps:
                  - fixture:
                      file: a.hex
                      content: "DEADBEEF"
                  - fixture:
                      file: b.hex
                      content: "DEADBEEE"
                  - assert:
                      file:
                        path: a.hex
                        equals_file: b.hex
      - run:
          command: ${atago} run neq.atago.yaml
      - assert:
          exit_code: 1
          stdout:
            contains: "not byte-identical"

  - name: equals_file is byte-exact — a CRLF vs LF difference fails
    steps:
      - fixture:
          file: crlf.atago.yaml
          content: |
            version: "1"
            suite:
              name: inner
            scenarios:
              - name: LF and CRLF files are not byte-identical
                steps:
                  - fixture:
                      file: lf.txt
                      base64: "bGluZQo="
                  - fixture:
                      file: crlf.txt
                      base64: "bGluZQ0K"
                  - assert:
                      file:
                        path: lf.txt
                        equals_file: crlf.txt
      - run:
          command: ${atago} run crlf.atago.yaml
      - assert:
          exit_code: 1
          stdout:
            contains: "not byte-identical"

  # A directory is not a file. Both of these used to pass: `exists: true`
  # because stat succeeds on a directory, and `executable: true` because every
  # directory carries the execute bit — so a tool that produced a directory
  # where a file was expected satisfied the assertion meant to catch that.
  - name: a file assertion is not satisfied by a directory
    steps:
      - fixture:
          file: mistaken.atago.yaml
          content: |
            version: "1"
            suite: {name: mistaken}
            scenarios:
              - name: out is a directory, not the expected file
                steps:
                  - run: {shell: true, command: "mkdir out"}
                  - assert:
                      file:
                        path: out
                        exists: true
      - run:
          command: ${atago} run mistaken.atago.yaml
      - assert:
          exit_code: 1
          stdout:
            contains:
              - "exists but is a directory"
              - "use a dir: assertion"

  - name: an executable assertion is not satisfied by a directory
    skip:
      os: windows
    steps:
      - fixture:
          file: execdir.atago.yaml
          content: |
            version: "1"
            suite: {name: execdir}
            scenarios:
              - name: a directory is not an executable
                steps:
                  - run: {shell: true, command: "mkdir bin"}
                  - assert:
                      file:
                        path: bin
                        executable: true
      - run:
          command: ${atago} run execdir.atago.yaml
      - assert:
          exit_code: 1
          stdout:
            contains: "is a directory, not an executable file"

  - name: a real file still satisfies both matchers
    skip:
      os: windows
    steps:
      - fixture:
          file: ok.atago.yaml
          content: |
            version: "1"
            suite: {name: ok}
            scenarios:
              - name: a real executable file
                steps:
                  - fixture:
                      file: tool.sh
                      content: "#!/bin/sh\n"
                      mode: "0755"
                  - run: {command: echo hi}
                  - assert:
                      file: {path: tool.sh, exists: true}
                  - assert:
                      file: {path: tool.sh, executable: true}
      - run:
          command: ${atago} run ok.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains: PASSED

  # A byte-exact comparison that fails on a carriage return printed the same two
  # words twice: the reader could see there was a difference but not what it
  # was. When the two sides differ only in characters a terminal does not show,
  # both are quoted.
  - name: an invisible difference is quoted in the failure output
    steps:
      - fixture:
          file: crlf.atago.yaml
          content: |
            version: "1"
            suite: {name: crlf}
            scenarios:
              - name: the file ends with CRLF, the expectation with LF
                steps:
                  - fixture:
                      file: a.txt
                      base64: c2hhcmVkDQo=
                  - run: {command: echo hi}
                  - assert:
                      file:
                        path: a.txt
                        equals: "shared\n"
      - run:
          command: ${atago} run crlf.atago.yaml
      - assert:
          exit_code: 1
          stdout:
            contains:
              - '"shared\n"'
              - '"shared\r\n"'

  - name: a trailing space difference is quoted too
    steps:
      - fixture:
          file: spaces.atago.yaml
          content: |
            version: "1"
            suite: {name: spaces}
            scenarios:
              - name: the output carries trailing spaces
                steps:
                  - run:
                      shell: true
                      command: "printf 'value  '"
                  - assert:
                      stdout:
                        equals: "value"
      - run:
          command: ${atago} run spaces.atago.yaml
      - assert:
          exit_code: 1
          stdout:
            contains: '"value  "'

  - name: an ordinary difference keeps its plain form
    steps:
      - fixture:
          file: plain.atago.yaml
          content: |
            version: "1"
            suite: {name: plain}
            scenarios:
              - name: the texts really are different
                steps:
                  - run:
                      shell: true
                      command: "printf 'actual text'"
                  - assert:
                      stdout:
                        equals: "expected text"
      - run:
          command: ${atago} run plain.atago.yaml
      - assert:
          exit_code: 1
          stdout:
            contains:
              - "expected text"
              - "actual text"
      - assert:
          stdout:
            not_contains: '"actual text"'
