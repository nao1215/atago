version: "1"

suite:
  name: atago self-hosting / json matcher boundary values

# Boundary coverage for the json/yaml path matcher: array indexing, a top-level
# array length, the numeric comparators, each scalar type (bool, float, a string
# carrying a quote), a deeply nested path, and the clean failure when a path
# selects nothing. printf emits the exact document so these are deterministic;
# the matcher is OS-independent, so the suite runs on make e2e.
scenarios:
  - name: an array element is addressable by index
    steps:
      - run: {shell: true, command: 'printf ''{"items":[10,20,30]}'''}
      - assert:
          stdout:
            json:
              - path: "$.items[0]"
                equals: 10
              - path: "$.items[2]"
                equals: 30

  - name: a top-level array reports its length
    steps:
      - run: {shell: true, command: 'printf ''[1,2,3,4,5]'''}
      - assert:
          stdout:
            json:
              - path: "$"
                length: 5

  - name: an empty array has length zero
    steps:
      - run: {shell: true, command: 'printf ''{"rows":[]}'''}
      - assert:
          stdout:
            json:
              - path: "$.rows"
                length: 0

  - name: the numeric comparators bound a value
    steps:
      - run: {shell: true, command: 'printf ''{"n":50}'''}
      - assert:
          stdout:
            json:
              - path: "$.n"
                gt: 49
              - path: "$.n"
                gte: 50
              - path: "$.n"
                lte: 50
              - path: "$.n"
                lt: 51

  - name: a boolean value compares equal
    steps:
      - run: {shell: true, command: 'printf ''{"ok":true,"off":false}'''}
      - assert:
          stdout:
            json:
              - path: "$.ok"
                equals: true
              - path: "$.off"
                equals: false

  - name: a floating-point value compares equal
    steps:
      - run: {shell: true, command: 'printf ''{"pi":3.14}'''}
      - assert:
          stdout:
            json:
              - path: "$.pi"
                equals: 3.14

  - name: a string carrying a quote compares equal
    steps:
      # The document is written by a fixture (byte-exact) and echoed with cat, so
      # the embedded \" does not depend on a printf implementation's handling of
      # an unrecognized escape, which varies across shells.
      - fixture:
          file: quoted.json
          content: '{"s":"a\"b"}'
      - run: {shell: true, command: "cat quoted.json"}
      - assert:
          stdout:
            json:
              - path: "$.s"
                equals: 'a"b'

  - name: a deeply nested path resolves
    steps:
      - run: {shell: true, command: 'printf ''{"x":{"y":{"z":{"w":42}}}}'''}
      - assert:
          stdout:
            json:
              - path: "$.x.y.z.w"
                equals: 42

  - name: a path that selects nothing fails with a clear message
    steps:
      - fixture:
          file: nopath.atago.yaml
          content: |
            version: "1"
            suite: {name: nopath}
            scenarios:
              - name: an absent key is a clean failure
                steps:
                  - run: {shell: true, command: 'printf ''{"a":1}'''}
                  - assert: {stdout: {json: [{path: "$.missing", equals: 1}]}}
      - run: {command: "${atago} run nopath.atago.yaml"}
      - assert:
          exit_code: 1
          stdout:
            contains: "selected no value"

  # A failing equals has to say which value it saw. Rendering both sides bare
  # printed the same text twice for a type mismatch — "expected true, got true"
  # for a boolean against the string "true" — which tells the author nothing.
  - name: a type mismatch failure distinguishes a string from a boolean
    steps:
      - fixture:
          file: typed.atago.yaml
          content: |
            version: "1"
            suite: {name: typed}
            scenarios:
              - name: string spelling of a boolean
                steps:
                  - run: {shell: true, command: 'printf ''{"b":true}'''}
                  - assert: {stdout: {json: [{path: "$.b", equals: "true"}]}}
      - run: {command: "${atago} run typed.atago.yaml"}
      - assert:
          exit_code: 1
          stdout:
            contains:
              - '$.b == "true"'
              - "$.b = true"

  # Whitespace differences are invisible unless the value is quoted.
  - name: a whitespace-only mismatch shows the surrounding spaces
    steps:
      - fixture:
          file: spaced.atago.yaml
          content: |
            version: "1"
            suite: {name: spaced}
            scenarios:
              - name: padded value
                steps:
                  - run: {shell: true, command: 'printf ''{"v":" x "}'''}
                  - assert: {stdout: {json: [{path: "$.v", equals: "x"}]}}
      - run: {command: "${atago} run spaced.atago.yaml"}
      - assert:
          exit_code: 1
          stdout:
            contains: '$.v = " x "'

  - name: a numeric mismatch stays unquoted
    steps:
      - fixture:
          file: nums.atago.yaml
          content: |
            version: "1"
            suite: {name: nums}
            scenarios:
              - name: off by one
                steps:
                  - run: {shell: true, command: 'printf ''{"n":2}'''}
                  - assert: {stdout: {json: [{path: "$.n", equals: 1}]}}
      - run: {command: "${atago} run nums.atago.yaml"}
      - assert:
          exit_code: 1
          stdout:
            contains:
              - "$.n == 1"
              - "$.n = 2"
      - assert:
          stdout:
            not_contains: '"2"'

  # A JSON null is nil in Go, and Go prints that as "<nil>". Leaking that made
  # the message about Go rather than about the document under test, and left the
  # matches matcher with nothing writable to match against.
  - name: a null value is spelled null, not the Go zero value
    steps:
      - run:
          shell: true
          command: "printf '{\"v\": null}'"
      - assert:
          stdout:
            json:
              - path: "$.v"
                matches: "^null$"

  - name: a failure against a null value names it as null
    steps:
      - fixture:
          file: nulled.atago.yaml
          content: |
            version: "1"
            suite: {name: nulled}
            scenarios:
              - name: the field is null, the expectation is a string
                steps:
                  - run: {shell: true, command: 'printf ''{"v": null}'''}
                  - assert: {stdout: {json: [{path: "$.v", equals: "something"}]}}
      - run: {command: "${atago} run nulled.atago.yaml"}
      - assert:
          exit_code: 1
          stdout:
            contains: "$.v = null"
      - assert:
          stdout:
            not_contains: "<nil>"

  # `equals: null` asserts the value IS null. Both a written null and an omitted
  # key decode to the same Go nil, so the loader records which was authored;
  # without that, this assertion was rejected as if no matcher were set.
  - name: equals null asserts the field is null
    steps:
      - run:
          shell: true
          command: "printf '{\"done\": null, \"count\": 0}'"
      - assert:
          stdout:
            json:
              - path: "$.done"
                equals: null
              - path: "$.count"
                equals: 0

  - name: equals null rejects every value that is not null
    steps:
      # One spec per value keeps the failure attributable: the string "null", a
      # zero, a false, and an empty string are the values most likely to be
      # confused with a null.
      - fixture:
          file: notnull.atago.yaml
          content: |
            version: "1"
            suite: {name: notnull}
            scenarios:
              - name: the string spelling of null
                steps:
                  - run: {shell: true, command: 'printf ''{"v": "null"}'''}
                  - assert: {stdout: {json: {path: "$.v", equals: null}}}
              - name: zero is not null
                steps:
                  - run: {shell: true, command: 'printf ''{"v": 0}'''}
                  - assert: {stdout: {json: {path: "$.v", equals: null}}}
              - name: false is not null
                steps:
                  - run: {shell: true, command: 'printf ''{"v": false}'''}
                  - assert: {stdout: {json: {path: "$.v", equals: null}}}
              - name: the empty string is not null
                steps:
                  - run: {shell: true, command: 'printf ''{"v": ""}'''}
                  - assert: {stdout: {json: {path: "$.v", equals: null}}}
      - run: {command: "${atago} run notnull.atago.yaml"}
      - assert:
          exit_code: 1
          stdout:
            contains:
              - "0 passed, 4 failed"
              - "$.v == null"
              - '$.v = "null"'
              - "$.v = 0"
              - "$.v = false"
              - '$.v = ""'

  - name: an absent path is not null either
    steps:
      # A missing field and a null field are different contracts: the missing one
      # reports that the path selected nothing rather than passing as null.
      - fixture:
          file: absent.atago.yaml
          content: |
            version: "1"
            suite: {name: absent}
            scenarios:
              - name: the field is not in the document
                steps:
                  - run: {shell: true, command: 'printf ''{"other": 1}'''}
                  - assert: {stdout: {json: {path: "$.v", equals: null}}}
      - run: {command: "${atago} run absent.atago.yaml"}
      - assert:
          exit_code: 1
          stdout:
            contains: "selected no value"

  - name: a json check with no matcher at all is still rejected
    steps:
      # The other half of the contract: recording the null must not turn a
      # matcher-less check into an accidental null assertion.
      - fixture:
          file: bare.atago.yaml
          content: |
            version: "1"
            suite: {name: bare}
            scenarios:
              - name: a path with nothing to assert
                steps:
                  - run: {shell: true, command: 'printf ''{"v": null}'''}
                  - assert: {stdout: {json: {path: "$.v"}}}
      - run: {command: "${atago} run bare.atago.yaml"}
      - assert:
          exit_code: 2
          stderr:
            contains: "must set one of equals/matches/length/gt/gte/lt/lte"

  - name: explain and doc describe a null assertion as one
    steps:
      - fixture:
          file: nullspec.atago.yaml
          content: |
            version: "1"
            suite: {name: nullspec}
            scenarios:
              - name: a cleared field
                steps:
                  - run: {shell: true, command: 'printf ''{"v": null}'''}
                  - assert: {stdout: {json: {path: "$.v", equals: null}}}
      - run: {command: "${atago} explain nullspec.atago.yaml"}
      - assert:
          exit_code: 0
          stdout:
            contains: "stdout JSON $.v == null"
      - assert:
          stdout:
            not_contains: "<nil>"
      - run: {command: "${atago} doc nullspec.atago.yaml"}
      - assert:
          exit_code: 0
          stdout:
            contains: "equals `null`"
