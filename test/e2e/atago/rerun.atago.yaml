version: "1"

suite:
  name: atago self-hosting / rerun-failed

scenarios:
  - name: a failing run is recorded and rerun-failed selects only it
    steps:
      - fixture:
          file: inner.atago.yaml
          content: |
            version: "1"
            suite:
              name: inner
            scenarios:
              - name: always-green
                steps:
                  - run: {shell: true, command: "exit 0"}
                  - assert: {exit_code: 0}
              - name: always-red
                steps:
                  - run: {shell: true, command: "exit 1"}
                  - assert: {exit_code: 0}
      # First run: one scenario fails, so the run exits 1 and records the failure.
      - run:
          command: ${atago} run inner.atago.yaml
      - assert:
          exit_code: 1
      # The state file is an explicit, documented JSON contract.
      - assert:
          file:
            path: .atago/last-failed.json
            exists: true
      - assert:
          file:
            path: .atago/last-failed.json
            json:
              path: $.failed[0].scenario
              equals: always-red
      # Rerun only the previously-failed scenario. It still fails, and the report
      # must mention it.
      - run:
          command: ${atago} run --rerun-failed inner.atago.yaml
      - assert:
          exit_code: 1
          stdout:
            contains: always-red

  - name: rerun-failed with nothing recorded is a no-op success
    steps:
      - fixture:
          file: green.atago.yaml
          content: |
            version: "1"
            suite:
              name: green
            scenarios:
              - name: passes
                steps:
                  - run: {shell: true, command: "exit 0"}
                  - assert: {exit_code: 0}
      # A clean workdir has no recorded failures, so --rerun-failed exits 0 and
      # reports that there is nothing to rerun.
      - run:
          command: ${atago} run --rerun-failed green.atago.yaml
      - assert:
          exit_code: 0
          stderr:
            contains: nothing to rerun

  - name: rerun-failed with a filter preserves the still-failing scenarios it did not run
    steps:
      - fixture:
          file: two.atago.yaml
          content: |
            version: "1"
            suite:
              name: two
            scenarios:
              - name: red-a
                steps:
                  - run: {shell: true, command: "exit 1"}
                  - assert: {exit_code: 0}
              - name: red-b
                steps:
                  - run: {shell: true, command: "exit 1"}
                  - assert: {exit_code: 0}
      # Both scenarios fail, so the ledger records both.
      - run:
          command: ${atago} run two.atago.yaml
      - assert:
          exit_code: 1
      # Rerun only red-a via --filter. red-b is excluded from this run but is still
      # broken, so it must stay in the ledger rather than being silently dropped
      # (which would greenlight a later plain --rerun-failed).
      - run:
          command: ${atago} run --rerun-failed --filter red-a two.atago.yaml
      - assert:
          exit_code: 1
      - assert:
          file:
            path: .atago/last-failed.json
            contains: [red-a, red-b]

  # --fail-fast stops scheduling, so the scenarios after the first red one are
  # skipped without a verdict. Their recorded failures have to survive, or
  # fixing the first one turns the next --rerun-failed green with the rest
  # still broken.
  - name: a fail-fast run keeps the recorded failures it never got to
    steps:
      - fixture:
          file: two.atago.yaml
          content: |
            version: "1"
            suite:
              name: two
            scenarios:
              - name: red-a
                steps:
                  - run: {shell: true, command: "exit 1"}
                  - assert: {exit_code: 0}
              - name: red-b
                steps:
                  - run: {shell: true, command: "exit 1"}
                  - assert: {exit_code: 0}
      - run:
          command: ${atago} run two.atago.yaml
      - assert:
          exit_code: 1
      # --parallel 1 makes fail-fast deterministic: red-a turns the run red
      # before red-b is ever scheduled.
      - run:
          command: ${atago} run --fail-fast --parallel 1 two.atago.yaml
      - assert:
          exit_code: 1
          stdout:
            contains: "1 skipped"
      - assert:
          file:
            path: .atago/last-failed.json
            contains: [red-a, red-b]
      # Fix only the scenario fail-fast did run. red-b was never re-verified, so
      # the red-green loop must still be red.
      - fixture:
          file: two.atago.yaml
          content: |
            version: "1"
            suite:
              name: two
            scenarios:
              - name: red-a
                steps:
                  - run: {shell: true, command: "exit 0"}
                  - assert: {exit_code: 0}
              - name: red-b
                steps:
                  - run: {shell: true, command: "exit 1"}
                  - assert: {exit_code: 0}
      - run:
          command: ${atago} run --rerun-failed two.atago.yaml
      - assert:
          exit_code: 1
          stdout:
            contains: red-b

  # --fail-fast stops scheduling whole spec files too, and a spec that was never
  # loaded contributes no scenarios at all. Its recorded failures are kept, and
  # calling them renamed or removed would send the reader after a spec change
  # that never happened.
  - name: a fail-fast run does not blame a rename for the spec it never loaded
    steps:
      - fixture:
          file: a.atago.yaml
          content: |
            version: "1"
            suite:
              name: a
            scenarios:
              - name: red-a
                steps:
                  - run: {shell: true, command: "exit 1"}
                  - assert: {exit_code: 0}
      - fixture:
          file: b.atago.yaml
          content: |
            version: "1"
            suite:
              name: b
            scenarios:
              - name: red-b
                steps:
                  - run: {shell: true, command: "exit 1"}
                  - assert: {exit_code: 0}
      - run:
          command: ${atago} run a.atago.yaml b.atago.yaml
      - assert:
          exit_code: 1
      - run:
          command: ${atago} run --rerun-failed --fail-fast --parallel 1 a.atago.yaml b.atago.yaml
      - assert:
          exit_code: 1
          stderr:
            not_contains: "renamed or removed"
      - assert:
          file:
            path: .atago/last-failed.json
            contains: [red-a, red-b]

  # Renaming one broken scenario while fixing another leaves the rerun with
  # fewer scenarios than were recorded, which reads as "the rest are fixed".
  # The run has to say which recorded failure it did not verify.
  - name: rerun-failed names the recorded failures that no longer match
    steps:
      - fixture:
          file: two.atago.yaml
          content: |
            version: "1"
            suite:
              name: two
            scenarios:
              - name: red-a
                steps:
                  - run: {shell: true, command: "exit 1"}
                  - assert: {exit_code: 0}
              - name: red-b
                steps:
                  - run: {shell: true, command: "exit 1"}
                  - assert: {exit_code: 0}
      - run:
          command: ${atago} run two.atago.yaml
      - assert:
          exit_code: 1
      # red-a is renamed while still broken; red-b keeps its name.
      - fixture:
          file: two.atago.yaml
          content: |
            version: "1"
            suite:
              name: two
            scenarios:
              - name: red-a-renamed
                steps:
                  - run: {shell: true, command: "exit 1"}
                  - assert: {exit_code: 0}
              - name: red-b
                steps:
                  - run: {shell: true, command: "exit 1"}
                  - assert: {exit_code: 0}
      - run:
          command: ${atago} run --rerun-failed two.atago.yaml
      - assert:
          exit_code: 1
          stderr:
            contains:
              - "1 recorded failing scenario did not match"
              - "red-a"
      # The unmatched entry is kept, so the next rerun can still find it.
      - assert:
          file:
            path: .atago/last-failed.json
            contains: [red-a, red-b]

  - name: rerun-failed stays quiet when every recorded failure still exists
    steps:
      - fixture:
          file: two.atago.yaml
          content: |
            version: "1"
            suite:
              name: two
            scenarios:
              - name: red-a
                steps:
                  - run: {shell: true, command: "exit 1"}
                  - assert: {exit_code: 0}
              - name: red-b
                steps:
                  - run: {shell: true, command: "exit 1"}
                  - assert: {exit_code: 0}
      - run:
          command: ${atago} run two.atago.yaml
      - assert:
          exit_code: 1
      - run:
          command: ${atago} run --rerun-failed two.atago.yaml
      - assert:
          exit_code: 1
          stderr:
            not_contains: "did not match the current specs"
