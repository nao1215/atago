version: "1"

suite:
  name: atago self-hosting / reports

scenarios:
  - name: JUnit report is XML with a testsuite and testcase
    steps:
      - fixture:
          file: ok.atago.yaml
          content: |
            version: "1"
            suite:
              name: sample
            scenarios:
              - name: echo
                steps:
                  - run:
                      command: echo hi
                  - assert:
                      stdout:
                        contains: hi
      - run:
          command: ${atago} run --report junit ok.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "<testsuites"
              - "<testcase"

  - name: GitHub Actions annotations are emitted on failure
    steps:
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite:
              name: sample
            scenarios:
              - name: nope
                steps:
                  - run:
                      command: echo Bob
                  - assert:
                      stdout:
                        contains: Alice
      - run:
          command: ${atago} run --report gha bad.atago.yaml
      - assert:
          exit_code: 1
          stdout:
            contains: "::error"

  - name: TAP report is a numbered TAP 13 stream with ok / not ok points
    steps:
      - fixture:
          file: mixed.atago.yaml
          content: |
            version: "1"
            suite:
              name: sample
            scenarios:
              - name: good
                steps:
                  - run:
                      command: echo hi
                  - assert:
                      stdout:
                        contains: hi
              - name: bad
                steps:
                  - run:
                      command: echo Bob
                  - assert:
                      stdout:
                        contains: Alice
      - run:
          command: ${atago} run --report tap mixed.atago.yaml
      - assert:
          exit_code: 1
          stdout:
            line: 1
            equals: "TAP version 13"
      - assert:
          stdout:
            line: 2
            equals: "1..2"
      - assert:
          stdout:
            contains:
              - "ok 1 - sample / good"
              - "not ok 2 - sample / bad"

  - name: failure artifacts are written and referenced in the JSON report
    steps:
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite:
              name: sample
            scenarios:
              - name: nope
                steps:
                  - run:
                      command: echo Bob
                  - assert:
                      stdout:
                        contains: Alice
      - run:
          command: ${atago} run --report json --artifacts-dir arts bad.atago.yaml
      - assert:
          exit_code: 1
      # The JSON report references the durable sidecar under a stable field.
      - assert:
          stdout:
            contains:
              - "\"artifacts\""
              - ".actual.txt"
      # The referenced sidecar exists on disk and holds the full actual payload.
      - run:
          shell: true
          command: cat arts/*/*/step-*-stdout.actual.txt
      - assert:
          exit_code: 0
          stdout:
            contains: Bob

  - name: a multi-line snapshot failure renders a unified diff with hunks
    steps:
      # Record a golden, mutate the output, and fail against it: the FAILED
      # block shows -/+ hunk lines and the golden path (#28) instead of two
      # raw dumps, and --report json carries the same diff additively.
      - fixture:
          file: diffspec.atago.yaml
          content: |
            version: "1"
            suite:
              name: diffdemo
            scenarios:
              - name: multi-line output matches its golden
                steps:
                  - run:
                      shell: true
                      command: "printf 'alpha\\nbeta\\ngamma\\n'"
                  - assert:
                      stdout:
                        snapshot: snaps/out.txt
      - run:
          command: ${atago} run --update-snapshots diffspec.atago.yaml
      - assert:
          exit_code: 0
      - fixture:
          file: diffspec.atago.yaml
          content: |
            version: "1"
            suite:
              name: diffdemo
            scenarios:
              - name: multi-line output matches its golden
                steps:
                  - run:
                      shell: true
                      command: "printf 'alpha\\nBETA\\ngamma\\n'"
                  - assert:
                      stdout:
                        snapshot: snaps/out.txt
      - run:
          command: ${atago} run diffspec.atago.yaml
      - assert:
          exit_code: 1
          stdout:
            contains:
              - "Diff (-expected +actual):"
              - "--- snapshot (golden)"
              - "-beta"
              - "+BETA"
              - "snaps/out.txt"
      - run:
          shell: true
          command: ${atago} run --report json diffspec.atago.yaml; true
      - assert:
          stdout:
            contains: '"diff":'

  # A failure block names the command the failing check asserts on. Naming the
  # scenario's LAST command instead sent the reader to a step that had no problem:
  # an interactive step that times out is followed by a verification command that
  # runs fine, and the report blamed that one.
  - name: a failure names the command it was observed under
    steps:
      - fixture:
          file: attrib.atago.yaml
          content: |
            version: "1"
            suite: {name: attrib}
            scenarios:
              - name: the first command fails and a later one passes
                steps:
                  - run: {shell: true, command: "printf 'early\n'; exit 3"}
                  - assert: {exit_code: 0}
                  - run: {shell: true, command: "printf 'later-and-fine\n'"}
                  - assert: {exit_code: 0}
      - run: {command: "${atago} run attrib.atago.yaml"}
      - assert:
          exit_code: 1
          stdout:
            contains:
              - "printf 'early"
      - assert:
          # The later, passing command must not appear in the failure block at all.
          stdout:
            not_contains: "later-and-fine"
      - run: {command: "${atago} run --report json attrib.atago.yaml"}
      - assert:
          exit_code: 1
          stdout:
            json:
              - path: "$.suites[0].failures[0].command"
                matches: "early"

  # A check that observed nothing must say it observed nothing. The console block
  # prints an Actual: section only for a non-empty value, so an empty stream used
  # to render with the section missing altogether — the same shape as a report
  # that never recorded what it saw. Reading a CI failure then depended on
  # knowing that the omission itself meant "empty" (#339).
  - name: a failure against an empty stream reports the stream as empty
    steps:
      - fixture:
          file: silent.atago.yaml
          content: |
            version: "1"
            suite: {name: silent}
            scenarios:
              - name: a command that prints nothing is asserted to have printed
                steps:
                  - run: {shell: true, command: "exit 0"}
                  - assert: {stdout: {contains: "PASSED"}}
      - run: {command: "${atago} run silent.atago.yaml"}
      - assert:
          exit_code: 1
          stdout:
            matches: "Actual:\n  \\(empty\\)"

  - name: an exit_code failure states that the command printed nothing
    steps:
      - fixture:
          file: quiet.atago.yaml
          content: |
            version: "1"
            suite: {name: quiet}
            scenarios:
              - name: exit code failure with no output at all
                steps:
                  - run: {shell: true, command: "exit 7"}
                  - assert: {exit_code: 0}
      - run: {command: "${atago} run quiet.atago.yaml"}
      - assert:
          exit_code: 1
          stdout:
            matches: "Stdout/Stderr:\n  \\(empty\\)"
