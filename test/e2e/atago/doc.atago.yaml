version: "1"

suite:
  name: atago self-hosting / doc

scenarios:
  - name: doc generates Markdown to a file
    steps:
      - fixture:
          file: target.atago.yaml
          content: |
            version: "1"
            suite:
              name: sample
            scenarios:
              - name: greet
                steps:
                  - run:
                      command: echo hello
                  - assert:
                      stdout:
                        contains: hello
      - run:
          command: ${atago} doc --out specs.md target.atago.yaml
      - assert:
          exit_code: 0
          file:
            path: specs.md
            contains: "# atago Behavior Specs"
      - assert:
          file:
            path: specs.md
            contains: "### Scenario: greet"

  - name: doc writes Markdown to stdout without --out
    steps:
      - fixture:
          file: t2.atago.yaml
          content: |
            version: "1"
            suite:
              name: sample2
            scenarios:
              - name: g2
                steps:
                  - run:
                      command: echo hi
                  - assert:
                      exit_code: 0
      - run:
          command: ${atago} doc t2.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains: "## sample2"

  - name: doc emits a summary, table of contents, and input previews
    steps:
      - fixture:
          file: rich.atago.yaml
          content: |
            version: "1"
            suite:
              name: rich
            scenarios:
              - name: seeded query
                tags: [smoke]
                steps:
                  - fixture:
                      file: data.csv
                      content: "id,name\n1,ada\n"
                  - run:
                      command: cat data.csv
                  - assert:
                      exit_code: 0
      - run:
          command: ${atago} doc rich.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "## Summary"
              - "1 suite · 1 scenario"
              - "## Contents"
              - "(#scenario-seeded-query)"
              - "#### Inputs"
              - "id,name"

  - name: doc --split-by-spec writes one file per spec and an index
    steps:
      - fixture:
          file: one.atago.yaml
          content: |
            version: "1"
            suite:
              name: suite-one
            scenarios:
              - name: a
                steps:
                  - run: {command: "true"}
                  - assert: {exit_code: 0}
      - fixture:
          file: two.atago.yaml
          content: |
            version: "1"
            suite:
              name: suite-two
            scenarios:
              - name: b
                steps:
                  - run: {command: "true"}
                  - assert: {exit_code: 0}
      - run:
          command: ${atago} doc --split-by-spec --out-dir generated one.atago.yaml two.atago.yaml
      - assert:
          exit_code: 0
          file:
            path: generated/one.md
            exists: true
      - assert:
          file:
            path: generated/two.md
            exists: true
      - assert:
          file:
            path: generated/index.md
            contains: "atago Behavior Specs — Index"
      - assert:
          file:
            path: generated/index.md
            contains: "(one.md)"

  - name: doc --split-by-spec requires --out-dir
    steps:
      - fixture:
          file: solo.atago.yaml
          content: |
            version: "1"
            suite:
              name: solo
            scenarios:
              - name: only
                steps:
                  - run: {command: "true"}
                  - assert: {exit_code: 0}
      - run:
          command: ${atago} doc --split-by-spec solo.atago.yaml
      - assert:
          exit_code: 3
          stderr:
            contains: requires --out-dir

  # The suite/scenario `description:` is doc-only data: it must reach the
  # generated Markdown verbatim — including a ${...} reference, which is prose
  # here and not a variable — and must not change how the spec runs.
  - name: doc renders suite and scenario descriptions verbatim
    steps:
      - fixture:
          file: described.atago.yaml
          content: |
            version: "1"
            suite:
              name: described
              description: |
                What this suite guarantees for its users.

                Second paragraph, ${not_a_variable} included.
            scenarios:
              - name: greets
                description: "Guards the regression from #123."
                steps:
                  - run: {command: echo hi}
                  - assert: {exit_code: 0}
      - run:
          command: ${atago} doc described.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains: "What this suite guarantees for its users."
      - assert:
          stdout:
            contains: "Second paragraph, ${not_a_variable} included."
      - assert:
          stdout:
            contains: "Guards the regression from #123."
      # Documentation prose changes nothing about execution: the same spec still
      # runs and passes.
      - run:
          command: ${atago} run described.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains: "1 passed"

  # Generated docs are published as the contract a suite guarantees, so every
  # matcher an assertion sets has to appear. A composed stream assertion used to
  # render as its first matcher alone, and file not_contains/executable rendered
  # as a bare "is checked".
  - name: doc renders every matcher an assertion sets
    steps:
      - fixture:
          file: matchers.atago.yaml
          content: |
            version: "1"
            suite:
              name: matchers
            scenarios:
              - name: composed stream
                steps:
                  - run:
                      command: echo hello
                  - assert:
                      stdout:
                        contains: hello
                        not_contains: goodbye
              - name: line scoped
                steps:
                  - run:
                      shell: true
                      command: printf 'one\ntwo\n'
                  - assert:
                      stdout:
                        line: 2
                        equals: two
              - name: file matchers
                steps:
                  - fixture:
                      file: install.sh
                      content: "#!/bin/sh\n"
                      mode: "0755"
                  - run:
                      command: echo hi
                  - assert:
                      file:
                        path: install.sh
                        executable: true
                  - assert:
                      file:
                        path: install.sh
                        not_contains: "rm -rf /"
      - run:
          command: ${atago} doc matchers.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "stdout contains `hello`, does not contain `goodbye`"
              - "stdout line `2` equals an exact value"
              - "file `install.sh` is executable"
              - "file `install.sh` does not contain `rm -rf /`"
      - assert:
          stdout:
            not_contains: "`install.sh` is checked"

  # The documented spec is the one that runs: it still passes as written. The
  # executable matcher needs a POSIX exec bit, so this half is POSIX-only while
  # the rendering above stays portable.
  - name: a spec whose matchers doc renders still runs green
    skip:
      os: windows
    steps:
      - fixture:
          file: matchers.atago.yaml
          content: |
            version: "1"
            suite:
              name: matchers
            scenarios:
              - name: composed stream
                steps:
                  - run:
                      command: echo hello
                  - assert:
                      stdout:
                        contains: hello
                        not_contains: goodbye
              - name: line scoped
                steps:
                  - run:
                      shell: true
                      command: printf 'one\ntwo\n'
                  - assert:
                      stdout:
                        line: 2
                        equals: two
              - name: file matchers
                steps:
                  - fixture:
                      file: install.sh
                      content: "#!/bin/sh\n"
                      mode: "0755"
                  - run:
                      command: echo hi
                  - assert:
                      file:
                        path: install.sh
                        executable: true
                  - assert:
                      file:
                        path: install.sh
                        not_contains: "rm -rf /"
      - run:
          command: ${atago} run matchers.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains: "3 passed"
