version: "1"

suite:
  name: atago self-hosting / explain

scenarios:
  - name: explain summarizes a spec without running it
    steps:
      - fixture:
          file: target.atago.yaml
          content: |
            version: "1"
            suite:
              name: sample
            scenarios:
              - name: list as json
                steps:
                  - run:
                      command: echo "[]"
                  - assert:
                      exit_code: 0
                      stdout:
                        contains: "["
      - run:
          command: ${atago} explain target.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "Suite: sample"
              - "Scenario: list as json"
              - "Commands:"
              - "Network policy:"

  # explain must describe every matcher an assertion sets. The text matchers
  # compose at run time, so summarizing only the first one advertises a weaker
  # contract than the run enforces.
  - name: explain describes every matcher of a composed stream assertion
    steps:
      - fixture:
          file: composed.atago.yaml
          content: |
            version: "1"
            suite:
              name: composed
            scenarios:
              - name: guards both directions
                steps:
                  - run:
                      command: echo hello
                  - assert:
                      stdout:
                        contains: hello
                        not_contains: goodbye
                        matches: "^hel"
      - run:
          command: ${atago} explain composed.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains: 'stdout contains "hello", does not contain "goodbye", matches /^hel/'
      # The composed assertion really is enforced: dropping the forbidden text
      # into stdout fails the run.
      - fixture:
          file: broken.atago.yaml
          content: |
            version: "1"
            suite:
              name: composed
            scenarios:
              - name: guards both directions
                steps:
                  - run:
                      shell: true
                      command: printf 'hello goodbye\n'
                  - assert:
                      stdout:
                        contains: hello
                        not_contains: goodbye
      - run:
          command: ${atago} run broken.atago.yaml
      - assert:
          exit_code: 1
          stdout:
            contains: does not contain

  # A line: selector narrows what every matcher sees, so explain has to say
  # which line is under test instead of implying the whole stream.
  - name: explain names the line a line-scoped matcher inspects
    steps:
      - fixture:
          file: lined.atago.yaml
          content: |
            version: "1"
            suite:
              name: lined
            scenarios:
              - name: second line only
                steps:
                  - run:
                      shell: true
                      command: printf 'one\ntwo\n'
                  - assert:
                      stdout:
                        line: 2
                        equals: two
      - run:
          command: ${atago} explain lined.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains: "stdout line 2 equals exact text"

  # not_contains and executable are ordinary file matchers: explain used to
  # report the bare path, which reads as "the file is checked" and hides what
  # the scenario actually guarantees.
  - name: explain describes file not_contains and executable matchers
    steps:
      - fixture:
          file: filematch.atago.yaml
          content: |
            version: "1"
            suite:
              name: filematch
            scenarios:
              - name: no secret leaked
                steps:
                  - fixture:
                      file: out.txt
                      content: "public\n"
                  - run:
                      command: echo hi
                  - assert:
                      file:
                        path: out.txt
                        not_contains: "secret-token"
              - name: installer stays executable
                steps:
                  - fixture:
                      file: install.sh
                      content: "#!/bin/sh\n"
                      mode: "0755"
                  - run:
                      command: echo hi
                  - assert:
                      file:
                        path: install.sh
                        executable: true
      - run:
          command: ${atago} explain filematch.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains:
              - 'file "out.txt" does not contain "secret-token"'
              - 'file "install.sh" is executable'

  # explain's security notes named http, grpc, and a run whose command looks
  # networky, and said nothing about the two runners that reach a host by
  # construction: an ssh run appeared as a bare local command, and a query
  # against a remote database appeared as nothing at all. Both are egress
  # permissions.network governs, so the summary told a reviewer less than the
  # policy already knew.
  - name: explain names ssh and remote-database egress
    steps:
      - fixture:
          file: remote.atago.yaml
          content: |
            version: "1"
            suite:
              name: remote
            runners:
              # insecure_host_key is an explicit opt-out of a verification the
              # loader otherwise refuses to let a spec skip, so the summary has
              # to say which way the decision went.
              box: {type: ssh, host: shell.example, user: deploy, password: x, insecure_host_key: true}
              # Single-quoted: a double-quoted YAML scalar processes escapes, and
              # ${workdir} on Windows expands to a backslash path whose \A and \T
              # are not valid ones. explain never opens the database, so a plain
              # relative path says as much as an absolute one.
              pg: {type: db, dsn: 'postgres://u:p@db.example:5432/app'}
              local: {type: db, dsn: 'sqlite:a.db'}
            scenarios:
              - name: reaches two hosts and one file
                steps:
                  - run: {runner: box, command: uptime}
                  - query: {runner: pg, sql: "SELECT 1"}
                  - query: {runner: local, sql: "SELECT 2"}
      - run:
          command: ${atago} explain remote.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "network access (ssh box): uptime"
              - 'ssh host key verification disabled (runner "box")'
              - "network access: SQL query via pg"
              # Every other step kind names the runner that carried it; a bare
              # command line made an ssh run read as local.
              - "uptime  (ssh box)"
            # The local runner still appears under Commands — it is a step the
            # scenario runs — but never as egress: a file-backed database
            # reaches no host, and saying it does would train a reader to skip
            # the section.
            not_contains: "network access: SQL query via local"
      # The machine-readable summary is built from the same list, so it agrees.
      - run:
          command: ${atago} manifest remote.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            json:
              - path: "$.specs[0].scenarios[0].security[0]"
                equals: "network access (ssh box): uptime"
              - path: "$.specs[0].scenarios[0].steps[0].action"
                equals: "run via ssh box: uptime"
      - run:
          command: ${atago} doc remote.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains: "# ssh box: uptime"
