version: "1"

suite:
  name: atago self-hosting / explain

scenarios:
  - name: explain summarizes a spec without running it
    steps:
      - fixture:
          file: target.atago.yaml
          content: |
            version: "1"
            suite:
              name: sample
            scenarios:
              - name: list as json
                steps:
                  - run:
                      command: echo "[]"
                  - assert:
                      exit_code: 0
                      stdout:
                        contains: "["
      - run:
          command: ${atago} explain target.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "Suite: sample"
              - "Scenario: list as json"
              - "Commands:"
              - "Network policy:"

  # explain must describe every matcher an assertion sets. The text matchers
  # compose at run time, so summarizing only the first one advertises a weaker
  # contract than the run enforces.
  - name: explain describes every matcher of a composed stream assertion
    steps:
      - fixture:
          file: composed.atago.yaml
          content: |
            version: "1"
            suite:
              name: composed
            scenarios:
              - name: guards both directions
                steps:
                  - run:
                      command: echo hello
                  - assert:
                      stdout:
                        contains: hello
                        not_contains: goodbye
                        matches: "^hel"
      - run:
          command: ${atago} explain composed.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains: 'stdout contains "hello", does not contain "goodbye", matches /^hel/'
      # The composed assertion really is enforced: dropping the forbidden text
      # into stdout fails the run.
      - fixture:
          file: broken.atago.yaml
          content: |
            version: "1"
            suite:
              name: composed
            scenarios:
              - name: guards both directions
                steps:
                  - run:
                      shell: true
                      command: printf 'hello goodbye\n'
                  - assert:
                      stdout:
                        contains: hello
                        not_contains: goodbye
      - run:
          command: ${atago} run broken.atago.yaml
      - assert:
          exit_code: 1
          stdout:
            contains: does not contain

  # A line: selector narrows what every matcher sees, so explain has to say
  # which line is under test instead of implying the whole stream.
  - name: explain names the line a line-scoped matcher inspects
    steps:
      - fixture:
          file: lined.atago.yaml
          content: |
            version: "1"
            suite:
              name: lined
            scenarios:
              - name: second line only
                steps:
                  - run:
                      shell: true
                      command: printf 'one\ntwo\n'
                  - assert:
                      stdout:
                        line: 2
                        equals: two
      - run:
          command: ${atago} explain lined.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains: "stdout line 2 equals exact text"

  # not_contains and executable are ordinary file matchers: explain used to
  # report the bare path, which reads as "the file is checked" and hides what
  # the scenario actually guarantees.
  - name: explain describes file not_contains and executable matchers
    steps:
      - fixture:
          file: filematch.atago.yaml
          content: |
            version: "1"
            suite:
              name: filematch
            scenarios:
              - name: no secret leaked
                steps:
                  - fixture:
                      file: out.txt
                      content: "public\n"
                  - run:
                      command: echo hi
                  - assert:
                      file:
                        path: out.txt
                        not_contains: "secret-token"
              - name: installer stays executable
                steps:
                  - fixture:
                      file: install.sh
                      content: "#!/bin/sh\n"
                      mode: "0755"
                  - run:
                      command: echo hi
                  - assert:
                      file:
                        path: install.sh
                        executable: true
      - run:
          command: ${atago} explain filematch.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains:
              - 'file "out.txt" does not contain "secret-token"'
              - 'file "install.sh" is executable'

  # explain's security notes named http, grpc, and a run whose command looks
  # networky, and said nothing about the two runners that reach a host by
  # construction: an ssh run appeared as a bare local command, and a query
  # against a remote database appeared as nothing at all. Both are egress
  # permissions.network governs, so the summary told a reviewer less than the
  # policy already knew.
  - name: explain names ssh and remote-database egress
    steps:
      - fixture:
          file: remote.atago.yaml
          content: |
            version: "1"
            suite:
              name: remote
            runners:
              # insecure_host_key is an explicit opt-out of a verification the
              # loader otherwise refuses to let a spec skip, so the summary has
              # to say which way the decision went.
              box: {type: ssh, host: shell.example, user: deploy, password: x, insecure_host_key: true}
              # Single-quoted: a double-quoted YAML scalar processes escapes, and
              # ${workdir} on Windows expands to a backslash path whose \A and \T
              # are not valid ones. explain never opens the database, so a plain
              # relative path says as much as an absolute one.
              pg: {type: db, dsn: 'postgres://u:p@db.example:5432/app'}
              local: {type: db, dsn: 'sqlite:a.db'}
            scenarios:
              - name: reaches two hosts and one file
                steps:
                  - run: {runner: box, command: uptime}
                  - query: {runner: pg, sql: "SELECT 1"}
                  - query: {runner: local, sql: "SELECT 2"}
      - run:
          command: ${atago} explain remote.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "network access (ssh box): uptime"
              - 'ssh host key verification disabled (runner "box")'
              - "network access: SQL query via pg"
              # Every other step kind names the runner that carried it; a bare
              # command line made an ssh run read as local.
              - "uptime  (ssh box)"
            # The local runner still appears under Commands — it is a step the
            # scenario runs — but never as egress: a file-backed database
            # reaches no host, and saying it does would train a reader to skip
            # the section.
            not_contains: "network access: SQL query via local"
      # The machine-readable summary is built from the same list, so it agrees.
      - run:
          command: ${atago} manifest remote.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            json:
              - path: "$.specs[0].scenarios[0].security[0]"
                equals: "network access (ssh box): uptime"
              - path: "$.specs[0].scenarios[0].steps[0].action"
                equals: "run via ssh box: uptime"
      - run:
          command: ${atago} doc remote.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains: "# ssh box: uptime"

  # Regression: the security summary skipped pty steps entirely and never
  # walked teardown. An interactive step that dials out, types a host secret,
  # or runs host commands mid-session produced zero notes, and so did a
  # scenario whose only egress was a cleanup call — teardown always runs, so
  # an egress that only happens during cleanup is still egress.
  - name: explain names pty and teardown egress
    steps:
      - fixture:
          file: pty_teardown.atago.yaml
          # $${env:...} writes a literal ${env:...} into the fixture; a single
          # $ would be expanded while writing it.
          content: |
            version: "1"
            suite:
              name: pty-teardown
            scenarios:
              - name: interactive deploy with cleanup
                steps:
                  - pty:
                      command: ssh deploy@backend.example
                      session:
                        - expect: "password:"
                        - send: "$${env:DEPLOY_PASSWORD}\n"
                        - exec: {command: "curl https://hook.example/fire"}
                teardown:
                  - run:
                      command: curl https://api.example/cleanup
                      shell: true
      - run:
          command: ${atago} explain pty_teardown.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "network access: ssh deploy@backend.example"
              - "host environment read: $${env:DEPLOY_PASSWORD}"
              - "network access (pty exec): curl https://hook.example/fire"
              - "shell execution enabled: curl https://api.example/cleanup"
              - "network access: curl https://api.example/cleanup"
      # The machine-readable summary is built from the same list, so it agrees.
      - run:
          command: ${atago} manifest pty_teardown.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            json:
              - path: "$.specs[0].scenarios[0].security[0]"
                equals: "network access: ssh deploy@backend.example"

  # Regression: security notes existed only per scenario, so a suite whose
  # setup curls through the shell and starts an ssh-tunnel service — and whose
  # teardown curls a purge endpoint — showed the steps but flagged none of
  # them, while the identical steps inside a scenario are all called out.
  - name: explain names suite lifecycle egress
    steps:
      - fixture:
          file: suite_egress.atago.yaml
          content: |
            version: "1"
            suite:
              name: suite-egress
              setup:
                - run:
                    command: curl https://seed.example/data
                    shell: true
                - service:
                    name: relay
                    command: ssh -N -L 8080:internal.example:80 jump.example
              teardown:
                - run:
                    command: curl https://api.example/purge
                    shell: true
            scenarios:
              - name: quiet scenario
                steps:
                  - run:
                      command: echo hi
      - run:
          command: ${atago} explain suite_egress.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "Suite security notes:"
              - "shell execution enabled: curl https://seed.example/data"
              - "network access (service relay): ssh -N -L 8080:internal.example:80 jump.example"
              - "network access: curl https://api.example/purge"
      # The machine-readable summary is built from the same list, so it agrees.
      - run:
          command: ${atago} manifest suite_egress.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            json:
              - path: "$.specs[0].suite_security[0]"
                equals: "shell execution enabled: curl https://seed.example/data"

  # Regression: the Generates list counted image assertions as declared
  # outputs but not pdf assertions — the same "inspected output the tool
  # wrote" one target over — and never walked teardown, whose redirects land
  # in the workdir like any other step's.
  - name: explain lists pdf and teardown outputs under generates
    steps:
      - fixture:
          file: gen.atago.yaml
          content: |
            version: "1"
            suite:
              name: gen
            scenarios:
              - name: renders a report
                steps:
                  - run:
                      command: mytool render
                  - assert:
                      pdf:
                        path: report.pdf
                        min_pages: 1
                teardown:
                  - run:
                      command: mytool audit
                      stdout_to: logs/audit.log
      - run:
          command: ${atago} explain gen.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "Generates:"
              - "report.pdf"
              - "logs/audit.log"
      # The machine-readable summary is built from the same list, so it agrees.
      - run:
          command: ${atago} manifest gen.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            json:
              - path: "$.specs[0].scenarios[0].generates[0]"
                equals: "report.pdf"
              - path: "$.specs[0].scenarios[0].generates[1]"
                equals: "logs/audit.log"
