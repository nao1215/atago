version: "1"

suite:
  name: atago self-hosting / top-level defaults

# Exercises the top-level `defaults:` block: shared authoring sugar
# merged into the concrete scenario/step/service model at load time. These specs
# run the built ${atago} against inner specs and assert the merged behavior, so
# the feature is verified end-to-end (not just in loader unit tests). The scope
# is fixed at defaults.run / defaults.scenario.env / defaults.service — no
# macros, includes, or expression language.
scenarios:
  - name: defaults.run.shell applies to every run step without repeating it
    steps:
      - fixture:
          file: shell.atago.yaml
          content: |
            version: "1"
            suite:
              name: shelled
            defaults:
              run:
                shell: true
            scenarios:
              - name: uses a shell builtin and env expansion
                env:
                  WHO: world
                steps:
                  - run:
                      command: echo "hello $WHO"
                  - assert:
                      stdout:
                        contains: hello world
      - run:
          command: ${atago} run shell.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains: "1 passed"

  - name: defaults.scenario.env is merged and an explicit scenario env wins
    steps:
      - fixture:
          file: env.atago.yaml
          content: |
            version: "1"
            suite:
              name: enved
            defaults:
              run:
                shell: true
              scenario:
                env:
                  FROM_DEFAULT: base
                  SHARED: default
            scenarios:
              - name: sees the default and overrides one key
                env:
                  SHARED: own
                steps:
                  - run:
                      command: echo "$FROM_DEFAULT-$SHARED"
                  - assert:
                      stdout:
                        contains: base-own
      - run:
          command: ${atago} run env.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains: "1 passed"

  - name: defaults.run.sandbox_home governs a run step and a pty step alike (POSIX)
    skip:
      os: windows
    steps:
      # #77: the environment-shaping subset of defaults.run (here sandbox_home)
      # must layer onto pty steps too — they share a run step's environment
      # surface. A single defaults.run.sandbox_home: true isolates the home for
      # BOTH steps: the run step writes config under the sandboxed XDG home and
      # the pty step reads it back from the SAME .atago-home, proving the default
      # reached the interactive step instead of leaving it on the host home.
      - fixture:
          file: sandbox.atago.yaml
          content: |
            version: "1"
            suite:
              name: shared-sandbox
            defaults:
              run:
                shell: true
                sandbox_home: true
            scenarios:
              - name: a run step writes and a pty step reads under one sandbox home
                steps:
                  - run:
                      command: 'mkdir -p "$XDG_CONFIG_HOME/mytool" && printf editor=vim > "$XDG_CONFIG_HOME/mytool/config"'
                  - assert:
                      exit_code: 0
                  - pty:
                      shell: true
                      command: 'cat "$XDG_CONFIG_HOME/mytool/config"'
                      session:
                        - expect: 'editor=vim'
                  - assert:
                      exit_code: 0
                  # Both steps shared the one deterministic isolated home.
                  - assert:
                      file:
                        path: .atago-home/.config/mytool/config
                        contains: editor=vim
      - run:
          command: ${atago} run sandbox.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains: "1 passed"

  - name: an unsupported defaults field is a load-time error (exit 2)
    steps:
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite:
              name: bad
            defaults:
              run:
                command: echo nope
            scenarios:
              - name: never runs
                steps:
                  - run:
                      command: echo hi
      - run:
          command: ${atago} run bad.atago.yaml
      - assert:
          exit_code: 2
          stderr:
            contains: defaults.run.command is not supported

  - name: defaults.run.env merges per key and a step env wins the collisions
    steps:
      - fixture:
          file: env.atago.yaml
          content: |
            version: "1"
            suite:
              name: envmerge
            defaults:
              run:
                shell: true
                env: {BASE: from-default, SHARED: default-value}
            scenarios:
              - name: step env overrides one key and inherits the other
                steps:
                  - run:
                      command: "echo [$BASE][$SHARED]"
                      env: {SHARED: step-value}
                  - assert:
                      stdout:
                        contains: "[from-default][step-value]"
      - run:
          command: ${atago} run env.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains: PASSED

  - name: a step opts out of defaults.run.shell with an explicit shell false
    steps:
      - fixture:
          file: optout.atago.yaml
          content: |
            version: "1"
            suite:
              name: optout
            defaults:
              run:
                shell: true
            scenarios:
              - name: this step runs without a shell
                steps:
                  - run:
                      shell: false
                      command: "echo literal-$HOME"
                  - assert:
                      stdout:
                        contains: "literal-$HOME"
      - run:
          command: ${atago} run optout.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains: PASSED

  # A probe-first suite's gate belongs to the file, not to each scenario in it.
  # Repeating `only:` per scenario is how a suite ends up with some scenarios
  # gated and some not — and the ungated ones then error on a machine without
  # the tool instead of skipping, which is noise rather than a result.
  - name: defaults.scenario.only gates every scenario that states no gate
    steps:
      - fixture:
          file: gated.atago.yaml
          content: |
            version: "1"
            suite:
              name: gated
            defaults:
              scenario:
                only:
                  command: definitely-no-such-tool-xyz --version
            scenarios:
              - name: inherits the file gate
                steps:
                  - run: {command: "false"}
                  - assert: {exit_code: 0}
              - name: also inherits it
                steps:
                  - run: {command: "false"}
                  - assert: {exit_code: 0}
      - run: {command: "${atago} run gated.atago.yaml"}
      - assert:
          exit_code: 0
          stdout:
            contains: "2 skipped"

  # A scenario that states its own gate means that one. Silently ANDing the
  # file-level condition onto it would make the scenario's own line stop
  # describing when it runs.
  - name: a scenario's own gate replaces the default rather than combining
    steps:
      - fixture:
          file: own.atago.yaml
          content: |
            version: "1"
            suite:
              name: own
            defaults:
              scenario:
                only:
                  command: definitely-no-such-tool-xyz --version
            scenarios:
              - name: states its own gate and runs
                only:
                  command: "true"
                steps:
                  - run: {command: "true"}
                  - assert: {exit_code: 0}
              - name: takes the default and skips
                steps:
                  - run: {command: "false"}
                  - assert: {exit_code: 0}
      - run: {command: "${atago} run own.atago.yaml"}
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "1 passed"
              - "1 skipped"

  # The same for skip, so a file-wide platform exclusion is stated once.
  - name: defaults.scenario.skip excludes every scenario that states no skip
    steps:
      - fixture:
          file: skipped.atago.yaml
          content: |
            version: "1"
            suite:
              name: skipped
            defaults:
              scenario:
                skip:
                  command: "true"
            scenarios:
              - name: inherits the file exclusion
                steps:
                  - run: {command: "false"}
                  - assert: {exit_code: 0}
      - run: {command: "${atago} run skipped.atago.yaml"}
      - assert:
          exit_code: 0
          stdout:
            contains: "1 skipped"
