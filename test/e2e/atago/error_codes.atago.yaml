                  - pty: {command: cat, timeout: 20s, session: [{send: {mouse: {row: 1, col: 1}}}]}
      - run: {command: "${atago} run bad.atago.yaml"}
      - assert:
          exit_code: 4
          stdout: {contains: "ATG4406"}

  - name: ATG4501 is a store step with no result behind it
    steps:
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite: {name: x}

            scenarios:
              - name: a
