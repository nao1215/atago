          content: |
            version: "1"
            suite: {name: x}

            scenarios:
              - name: a
                steps:
                  - run: {command: "sleep 4 &", shell: true, timeout: 30s}
      - run: {command: "${atago} run bad.atago.yaml"}
      - assert:
          exit_code: 4
          stdout: {contains: "ATG4403"}

  - name: ATG4406 is input the program is not set up to receive
    skip:
      os: windows
