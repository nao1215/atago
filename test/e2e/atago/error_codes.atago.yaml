      - run: {command: "${atago} run bad.atago.yaml"}
      - assert:
          exit_code: 4
          stdout: {contains: "ATG4501"}

  - name: ATG4502 is a store selector that found nothing
    steps:
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite: {name: x}

            scenarios:
