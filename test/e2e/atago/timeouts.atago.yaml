version: "1"

suite:
  name: atago self-hosting / step timeouts (suite default + escape hatch)

# Exercises #17: suite.timeout bounds every step without a more specific
# timeout, the failure hint names the level that supplied the bound, and
# `timeout: "0"` opts a step back out. The probes use POSIX `sleep`, so these
# scenarios skip on Windows; the precedence chain itself is covered by unit
# tests on every OS.
scenarios:
  - name: suite.timeout kills a hanging step and the hint names it
    skip:
      os: windows
    steps:
      - fixture:
          file: hang.atago.yaml
          content: |
            version: "1"
            suite:
              name: hang
              timeout: 1s
            scenarios:
              - name: sleeps past the suite bound
                steps:
                  - run:
                      shell: true
                      command: sleep 300
                  - assert:
                      exit_code: 0
      - run:
          command: ${atago} run hang.atago.yaml
          timeout: 30s
      - assert:
          exit_code: 1
          stdout:
            contains:
              - "timed out"
              - "suite.timeout"

  - name: a step timeout beats the suite timeout and the hint says run.timeout
    skip:
      os: windows
    steps:
      - fixture:
          file: step_wins.atago.yaml
          content: |
            version: "1"
            suite:
              name: step-wins
              timeout: 30s
            scenarios:
              - name: the step's own 1s bound fires first
                steps:
                  - run:
                      shell: true
                      command: sleep 300
                      timeout: 1s
                  - assert:
                      exit_code: 0
      - run:
          command: ${atago} run step_wins.atago.yaml
          timeout: 30s
      - assert:
          exit_code: 1
          stdout:
            contains:
              - "timed out"
              - "run.timeout"

  - name: timeout zero disables a short suite bound
    skip:
      os: windows
    steps:
      - fixture:
          file: optout.atago.yaml
          content: |
            version: "1"
            suite:
              name: optout
              timeout: 1s
            scenarios:
              - name: the opted-out step outlives the suite bound
                steps:
                  - run:
                      shell: true
                      command: sleep 2
                      timeout: "0"
                  - assert:
                      exit_code: 0
      - run:
          command: ${atago} run optout.atago.yaml
          timeout: 30s
      - assert:
          exit_code: 0

  - name: a killed step fails even when nothing asserts on it
    skip:
      os: windows
    steps:
      - fixture:
          file: unobserved.atago.yaml
          content: |
            version: "1"
            suite:
              name: unobserved
              timeout: 1s
            scenarios:
              - name: nothing looks at the killed command
                steps:
                  - run:
                      shell: true
                      command: sleep 300
      - run:
          command: ${atago} run unobserved.atago.yaml
          timeout: 30s
      - assert:
          exit_code: 1
          stdout:
            contains:
              - "run completes before its timeout"
              - "was killed"
              - "suite.timeout"

  - name: an assert that ignores the result does not mask the kill
    skip:
      os: windows
    steps:
      - fixture:
          file: file_assert.atago.yaml
          content: |
            version: "1"
            suite:
              name: file-assert
            scenarios:
              - name: the assert reads a file the step did not produce
                steps:
                  - fixture:
                      file: made.txt
                      content: |
                        hi
                  - run:
                      shell: true
                      command: sleep 300
                      timeout: 500ms
                  - assert:
                      file:
                        path: made.txt
                        contains: hi
      - run:
          command: ${atago} run file_assert.atago.yaml
          timeout: 30s
      - assert:
          exit_code: 1
          stdout:
            contains:
              - "run completes before its timeout"
              - "run.timeout"

  - name: an assert on the killed result keeps the timeout observable
    skip:
      os: windows
    steps:
      - fixture:
          file: observed.atago.yaml
          content: |
            version: "1"
            suite:
              name: observed
            scenarios:
              - name: the assert inspects the timeout instead of ignoring it
                steps:
                  - run:
                      shell: true
                      command: sleep 300
                      timeout: 500ms
                  - assert:
                      exit_code:
                        not: 0
      - run:
          command: ${atago} run observed.atago.yaml
          timeout: 30s
      - assert:
          exit_code: 0

  - name: timeout zero keeps an unasserted step green
    skip:
      os: windows
    steps:
      - fixture:
          file: optout_bare.atago.yaml
          content: |
            version: "1"
            suite:
              name: optout-bare
              timeout: 500ms
            scenarios:
              - name: the opted-out step is never killed so nothing fails it
                steps:
                  - run:
                      shell: true
                      command: sleep 1
                      timeout: "0"
      - run:
          command: ${atago} run optout_bare.atago.yaml
          timeout: 30s
      - assert:
          exit_code: 0

  - name: an invalid suite.timeout is a load-time error
    steps:
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite:
              name: bad
              timeout: fast
            scenarios:
              - name: never runs
                steps:
                  - run:
                      command: echo hi
      - run:
          command: ${atago} run bad.atago.yaml
      # A spec-content (validation) error exits 2.
      - assert:
          exit_code: 2
          stderr:
            contains: "suite.timeout"

  # A pty session does not close the program. When the actions run out and the
  # program is still up, the step is killed — and telling the reader to raise the
  # timeout is advice that cannot work, because the session already ran to the end.
  # This is the shape that broke thirteen lazygit scenarios and three yazi ones.
  - name: a session outlived by its program says so instead of blaming the clock
    skip: {os: windows}
    steps:
      - fixture:
          file: outlived.atago.yaml
          content: |
            version: "1"
            suite: {name: outlived}
            scenarios:
              - name: the session ends with cat still reading
                steps:
                  - pty:
                      command: cat
                      timeout: 2s
                      session:
                        - send: "hello\n"
                        - expect: "hello"
      - run:
          command: ${atago} run outlived.atago.yaml
          timeout: 30s
      - assert:
          exit_code: 1
          stdout:
            contains:
              - "the program was still running"
              - "send its quit key as the last action"
      - assert:
          # The advice that cannot help is gone.
          stdout:
            not_contains: "raise the timeout if the command is merely slow"

  - name: an expect that never matches still reports the pattern, not the quit advice
    skip: {os: windows}
    steps:
      # The other half of the contract: a wait that never completed is a real
      # timeout, where a longer budget can be the answer, and it keeps its own
      # message naming the pattern.
      - fixture:
          file: nomatch.atago.yaml
          content: |
            version: "1"
            suite: {name: nomatch}
            scenarios:
              - name: the prompt never appears
                steps:
                  - pty:
                      command: cat
                      timeout: 2s
                      session:
                        - expect: "never-going-to-appear"
      - run:
          command: ${atago} run nomatch.atago.yaml
          timeout: 30s
      - assert:
          exit_code: 1
          stdout:
            contains:
              - "never-going-to-appear"
              - "never appeared in the terminal transcript"
      - assert:
          stdout:
            not_contains: "send its quit key"

  - name: a timeout that expires before the process starts is still a timeout
    steps:
      # exec.CommandContext checks the deadline inside Start, so a budget this
      # small is always already spent by the time the OS would create the
      # process. atago used to report that as "failed to execute" — the message
      # for a command that could not be started at all — telling the author their
      # command was unrunnable when it had merely run out of time. The outcome
      # must not depend on which side of process creation the deadline lands on,
      # which is exactly the race a loaded Windows runner loses with a 50ms
      # budget. No `sleep` here, so unlike its neighbours this runs on every OS.
      - fixture:
          file: prestart.atago.yaml
          content: |
            version: "1"
            suite:
              name: prestart
            scenarios:
              - name: the budget is spent before the process exists
                steps:
                  - run:
                      shell: true
                      command: echo hi
                      timeout: 1ns
                  - assert:
                      exit_code: 0
      - run:
          command: ${atago} run prestart.atago.yaml
          timeout: 30s
      - assert:
          exit_code: 1
          stdout:
            contains:
              - "timed out"
              - "run.timeout"
            not_contains: "failed to execute"
