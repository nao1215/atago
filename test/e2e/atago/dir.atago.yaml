version: "1"

suite:
  name: atago self-hosting / dir assertion

scenarios:
  - name: directory/tree assertions cover a multi-file generator
    skip: {os: windows}
    steps:
      # A tiny "generator": build a small static-site tree.
      - run:
          shell: true
          command: mkdir -p site/assets && printf '<html>' > site/index.html && printf '<html>' > site/about.html && printf 'body{}' > site/assets/app.css
      - assert:
          exit_code: 0
      # A dir assert is not a one-of matcher: every field it sets is an
      # independent constraint and all must hold, so one block covers existence,
      # expected/forbidden children (including a nested path), the direct-entry
      # count and its bounds, and glob coverage.
      - assert:
          dir:
            path: site
            exists: true
            contains: [index.html, about.html, assets/app.css]
            not_contains: [secret.txt]
            count: 3
            min_count: 1
            max_count: 10
            glob: "*.html"

  - name: a missing directory can be asserted absent
    steps:
      - assert:
          dir:
            path: never-created
            exists: false

  - name: a dangling symlink is a present directory entry (membership uses Lstat)
    skip: {os: windows}
    steps:
      # A broken symlink is still a directory entry the program left behind;
      # membership must see it via the entry, not by resolving the missing target.
      - run:
          shell: true
          command: mkdir -p linkdir && ln -s /nonexistent-target-xyz linkdir/planted
      - assert:
          exit_code: 0
      - assert:
          dir:
            path: linkdir
            contains: [planted]
            not_contains: [never-planted]

  - name: a symlinked directory reads the same in every dir mode
    skip: {os: windows}
    steps:
      # A program that publishes `latest -> releases/v2` is the ordinary case.
      # filepath.WalkDir lstats its root, so the recursive and snapshot modes
      # used to walk the link itself and see an EMPTY tree while the
      # non-recursive matchers read the real contents — one assertion giving two
      # answers, and a snapshot golden that stayed green whatever the directory
      # later held.
      - run:
          shell: true
          command: mkdir -p releases/v2/assets && echo bin > releases/v2/app.bin && echo css > releases/v2/assets/app.css && ln -s releases/v2 latest
      - assert:
          exit_code: 0
      - assert:
          dir:
            path: latest
            contains: [app.bin]
      - assert:
          dir:
            path: latest
            recursive: true
            contains: [assets/app.css]
      - assert:
          dir:
            path: latest
            recursive: true
            count: 2

  - name: a dir path that resolves out of the workdir is refused
    skip: {os: windows}
    steps:
      # The path check is lexical, so it cannot see through a link the program
      # under test planted: `path:` naming a link out of the workdir passed it,
      # and the directory outside was listed anyway. Resolving the root before
      # the containment test closes that.
      - run:
          shell: true
          command: ln -s /etc escape
      - assert:
          exit_code: 0
      - fixture:
          file: escaping.atago.yaml
          content: |
            version: "1"
            suite:
              name: escaping dir assert
            scenarios:
              - name: read outside the workdir through a link
                steps:
                  - run:
                      shell: true
                      command: ln -s /etc escape
                  - assert:
                      dir:
                        path: escape
                        contains: [hosts]
      - run:
          command: ${atago} run escaping.atago.yaml
      - assert:
          exit_code: 1
          stdout:
            contains: "escapes the scenario workdir"

  - name: a failed dir assert lists what the directory actually holds
    steps:
      - fixture:
          file: listing.atago.yaml
          content: |
            version: "1"
            suite:
              name: listing
            scenarios:
              - name: the generator produced the wrong tree
                steps:
                  - fixture: {file: out/index.html, content: "x"}
                  - fixture: {file: out/app.js, content: "x"}
                  - run: {command: echo built}
                  - assert:
                      dir:
                        path: out
                        contains: [style.css]
      - run:
          command: ${atago} run listing.atago.yaml
      # The failure must name the files that ARE there, so the reader does not
      # have to re-run the generator by hand to find out.
      - assert:
          exit_code: 1
          stdout:
            contains:
              - "app.js"
              - "index.html"

  - name: a failed count assert lists the entries it counted
    steps:
      - fixture:
          file: counted.atago.yaml
          content: |
            version: "1"
            suite:
              name: counted
            scenarios:
              - name: the count is off
                steps:
                  - fixture: {file: out/only.txt, content: "x"}
                  - run: {command: echo built}
                  - assert:
                      dir:
                        path: out
                        count: 4
      - run:
          command: ${atago} run counted.atago.yaml
      # Singular noun when exactly one entry was found, and the entry is named.
      - assert:
          exit_code: 1
          stdout:
            contains:
              - "only.txt"
              - "has 1 entry"

  - name: a failed recursive assert lists the walked tree
    steps:
      - fixture:
          file: walked.atago.yaml
          content: |
            version: "1"
            suite:
              name: walked
            scenarios:
              - name: the nested path is missing
                steps:
                  - fixture: {file: out/assets/app.css, content: "x"}
                  - fixture: {file: out/index.html, content: "x"}
                  - run: {command: echo built}
                  - assert:
                      dir:
                        path: out
                        recursive: true
                        contains: [assets/missing.css]
      - run:
          command: ${atago} run walked.atago.yaml
      - assert:
          exit_code: 1
          stdout:
            contains:
              - "assets/app.css"
              - "index.html"

  # Asserting a directory at a path that holds a file used to report a bare
  # "exists=false", which reads as "nothing is there" and hides the real
  # problem: the output is exactly where it was asked for, as a file.
  - name: a dir assertion on a file path says the path is a file
    steps:
      - fixture:
          file: mistaken.atago.yaml
          content: |
            version: "1"
            suite: {name: mistaken}
            scenarios:
              - name: out is a file, not a directory
                steps:
                  - fixture: {file: out, content: "report\n"}
                  - run: {command: echo built}
                  - assert:
                      dir:
                        path: out
                        exists: true
      - run:
          command: ${atago} run mistaken.atago.yaml
      - assert:
          exit_code: 1
          stdout:
            contains:
              - 'exists but is a regular file'
              - 'use a file: assertion'

  # A program under test can leave an entry that is not a regular file — a named
  # pipe from a `mkfifo`, a socket from a daemon. Hashing it meant opening it, and
  # opening a pipe for reading blocks until something writes to it, which no step
  # timeout covers: the run hung instead of finishing in milliseconds. The pipe is
  # a directory entry like any other; it is simply never opened.
  - name: a named pipe in the tree does not block the walk
    skip: {os: windows}
    steps:
      - run:
          shell: true
          command: "mkdir out && mkfifo out/pipe && printf 'x' > out/real.txt"
      - assert:
          dir:
            path: out
            recursive: true
            contains: [pipe, real.txt]
            # Counts are over regular files, so the pipe is not one of them.
            count: 1
      # The tree snapshot records what the entry is instead of a content hash.
      # A nested spec keeps the written golden inside the scenario workdir.
      - fixture:
          file: treespec.atago.yaml
          content: |
            version: "1"
            suite: {name: treesnap}
            scenarios:
              - name: snapshot a tree holding a pipe
                steps:
                  - run: {shell: true, command: "mkdir out && mkfifo out/pipe && printf 'x' > out/real.txt"}
                  - assert: {dir: {path: out, snapshot: pipe_tree}}
      - run:
          command: ${atago} run --update-snapshots treespec.atago.yaml
      - assert: {exit_code: 0}
      - run:
          shell: true
          command: "cat pipe_tree"
      - assert:
          stdout:
            contains:
              - "fifo pipe"
              - "file real.txt sha256:"
      # And the written golden verifies on a second run: update then check is
      # idempotent for a tree that holds an unopenable entry.
      - run:
          command: ${atago} run treespec.atago.yaml
      - assert: {exit_code: 0}

  - name: a file assertion on a named pipe fails instead of hanging
    skip: {os: windows}
    steps:
      - fixture:
          file: piped.atago.yaml
          content: |
            version: "1"
            suite: {name: piped}
            scenarios:
              - name: the tool left a pipe where a file was expected
                steps:
                  - run: {shell: true, command: "mkfifo out.txt"}
                  - assert: {file: {path: out.txt, equals: "data"}}
      - run:
          command: ${atago} run piped.atago.yaml
      - assert:
          exit_code: 1
          stdout:
            contains:
              - "is a named pipe, not a regular file"
