version: "1"

suite:
  name: atago self-hosting / db runner

# Exercises the DB runner end-to-end through the real atago binary,
# using an in-memory SQLite database (pure-Go modernc driver, no cgo, no external
# server). Live multi-driver behavior is covered by Go tests
# (internal/runner/db, internal/engine/db_test.go).
scenarios:
  - name: query workflow (create, insert, select, row assert, value binding) passes
    steps:
      - fixture:
          file: db.atago.yaml
          content: |
            version: "1"
            suite:
              name: inner-db
            runners:
              store:
                type: db
                dsn: "sqlite::memory:"
            scenarios:
              - name: seed then query with row assertions and binding
                steps:
                  - query:
                      runner: store
                      sql: "CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT, role TEXT)"
                  - query:
                      runner: store
                      sql: "INSERT INTO users (name, role) VALUES ('alice','admin'), ('bob','user')"
                  - query:
                      runner: store
                      sql: "SELECT id, name, role FROM users ORDER BY id"
                  - assert:
                      rows:
                        json:
                          path: "$"
                          length: 2
                  - assert:
                      rows:
                        json:
                          path: "$[0].name"
                          equals: alice
                  - store:
                      name: admin_id
                      from:
                        rows:
                          json:
                            path: "$[0].id"
                  - query:
                      runner: store
                      sql: "SELECT role FROM users WHERE id = ${admin_id}"
                  - assert:
                      rows:
                        json:
                          path: "$[0].role"
                          equals: admin
      - run:
          command: ${atago} run db.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains: passed

  - name: a query against an undeclared runner fails validation (exit 2)
    steps:
      - fixture:
          file: norunner.atago.yaml
          content: |
            version: "1"
            suite:
              name: inner-db
            scenarios:
              - name: references a db runner that is not declared
                steps:
                  - query:
                      runner: missing
                      sql: "SELECT 1"
      - run:
          command: ${atago} run norunner.atago.yaml
      - assert:
          exit_code: 2
          stderr:
            contains: is not declared

  # #497: a libpq keyword dsn can name its peer as `hostaddr` instead of
  # `host`. Reading only `host` left that address unchecked, so a spec could
  # reach a database the network policy was written to keep it away from —
  # the connection error proved the dial had already happened.
  - name: a hostaddr dsn is held to the network policy (exit 6)
    steps:
      - fixture:
          file: hostaddr.atago.yaml
          content: |
            version: "1"
            suite:
              name: inner-hostaddr
              timeout: 10s
            permissions:
              network:
                allow: ["db.allowed.example"]
            runners:
              store:
                type: db
                driver: postgres
                dsn: "hostaddr=127.0.0.1 port=1 user=u dbname=app sslmode=disable"
            scenarios:
              - name: reaches an address the policy never named
                steps:
                  - query:
                      runner: store
                      sql: "SELECT 1"
      - run:
          command: ${atago} run hostaddr.atago.yaml
      - assert:
          exit_code: 6
          stdout:
            contains: 'network policy denies host "127.0.0.1"'

  # #497: libpq lets a value be single-quoted, and the quotes belong to the dsn
  # syntax rather than to the host. Keeping them denied a host the policy names.
  - name: a quoted host is compared to the allowlist without its quotes
    steps:
      - fixture:
          file: quoted.atago.yaml
          content: |
            version: "1"
            suite:
              name: inner-quoted
              timeout: 10s
            permissions:
              network:
                allow: ["127.0.0.1"]
            runners:
              store:
                type: db
                driver: postgres
                dsn: "host='127.0.0.1' port=1 user=u dbname=app sslmode=disable"
            scenarios:
              - name: the allowlisted host connects (and fails as a connection)
                steps:
                  - query:
                      runner: store
                      sql: "SELECT 1"
      - run:
          command: ${atago} run quoted.atago.yaml
      - assert:
          # The connection is refused (nothing listens on port 1), which is a
          # runner error rather than a policy violation: exit 4, not exit 6.
          exit_code: 4
          stdout:
            not_contains: network policy denies
