# pty steps (#8): a real pseudo-terminal with a declarative expect/send
# session. POSIX-only; every scenario here skips on Windows.
version: "1"

suite:
  name: atago self-hosting / pty

scenarios:
  - name: a pty step sees a terminal where a run step sees a pipe
    skip:
      os: windows
    steps:
      - fixture:
          file: tty.atago.yaml
          content: |
            version: "1"
            suite:
              name: inner
            scenarios:
              - name: tty
                steps:
                  - pty:
                      shell: true
                      command: 'if [ -t 0 ]; then echo saw-a-tty; else echo saw-a-pipe; fi'
                  - assert:
                      exit_code: 0
                      stdout:
                        contains: saw-a-tty
      - run:
          command: ${atago} run tty.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains: "1 passed"

  - name: a never-matching expect fails with the pattern in the block
    skip:
      os: windows
    steps:
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite:
              name: inner
            scenarios:
              - name: waits forever
                steps:
                  - pty:
                      command: cat
                      timeout: 2s
                      session:
                        - expect: "prompt-that-never-comes"
      - run:
          command: ${atago} run bad.atago.yaml
      - assert:
          exit_code: 1
          stdout:
            contains:
              - "pty expect /prompt-that-never-comes/"
              - "never appeared in the terminal transcript"

  - name: named keys transmit their documented bytes and ctrl-c aborts
    skip:
      os: windows
    steps:
      # An arrow key received by `cat -v` renders as ^[[B — proof the named
      # key (#26) transmitted the real xterm sequence. ctrl-_ stays the raw
      # US control byte, while ctrl-hyphen emits the CSI-u modified-key event
      # modern TUIs use for the physical Ctrl+- key.
      - pty:
          command: cat -v
          timeout: 10s
          session:
            - send: { key: down }
            - send: { key: enter }
            - expect: '\^\[\[B'
            - send: { key: ctrl-_ }
            - send: { key: enter }
            - expect: '\^_'
            - send: { key: ctrl-hyphen }
            - send: { key: enter }
            - expect: '\^\[\[45;5u'
            - send: { key: ctrl-d }
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "^[[B"
              - "^_"
              - "^[[45;5u"

  # The families a real TUI binds (#376): reverse focus, Meta chords, and
  # word-wise cursor movement. Each is pinned at the byte level through
  # `cat -v`, because a key whose name is accepted but whose bytes are wrong
  # fails far away — inside the program under test, as a keystroke that did
  # nothing.
  - name: shift-tab, meta chords, and modified arrows transmit their xterm bytes
    skip:
      os: windows
    steps:
      - pty:
          command: cat -v
          timeout: 10s
          session:
            - send: { key: shift-tab } # CSI Z, the reverse-focus key
            - send: { key: enter }
            - expect: '\^\[\[Z'
            - send: { key: alt-b } # ESC-prefixed Meta chord
            - send: { key: enter }
            - expect: '\^\[b'
            - send: { key: ctrl-left } # xterm modified arrow (modifier 5 = ctrl)
            - send: { key: enter }
            - expect: '\^\[\[1;5D'
            - send: { key: shift-up } # modifier 2 = shift
            - send: { key: enter }
            - expect: '\^\[\[1;2A'
            - send: { key: insert }
            - send: { key: enter }
            - expect: '\^\[\[2~'
            - send: { key: ctrl-d }
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "^[[Z"
              - "^[b"
              - "^[[1;5D"
              - "^[[1;2A"
              - "^[[2~"
      # alt-backspace ends in DEL (0x7f), which the line discipline claims as
      # the ERASE character — in the cooked terminal above it rubs out the
      # preceding byte instead of reaching the program. A TUI reads its keys in
      # raw mode, which is where the chord is meant to arrive intact, so that is
      # where its bytes are pinned. `head -c 3` bounds the read to exactly the
      # ESC, the DEL, and the trailing X, so the program exits on its own.
      - pty:
          shell: true
          command: 'stty raw -echo; printf "READY\r\n"; head -c 3 | cat -v'
          timeout: 10s
          session:
            - expect: READY # raw mode is in effect only after stty returns
            - send: { key: alt-backspace }
            - send: "X"
      - assert:
          exit_code: 0
          stdout:
            contains: "^[^?X"
      # `times` repeats a key (#377). The bytes must be the sequence back to
      # back — one write, so the program reads the burst the way it reads a
      # held key — and nothing else.
      - pty:
          command: cat -v
          timeout: 10s
          session:
            - send: { key: down, times: 3 }
            - send: { key: enter }
            - expect: '\^\[\[B\^\[\[B\^\[\[B'
            - send: { key: ctrl-d }
      - assert:
          exit_code: 0
          stdout:
            contains: "^[[B^[[B^[[B"
      # backtab is an alias, not a second key: it must put the same bytes on
      # the wire as shift-tab.
      - pty:
          command: cat -v
          timeout: 10s
          session:
            - send: { key: backtab }
            - send: { key: enter }
            - expect: '\^\[\[Z'
            - send: { key: ctrl-d }
      - assert:
          exit_code: 0
          stdout:
            contains: "^[[Z"
      # ctrl-c delivers a real SIGINT to the foreground process group.
      - pty:
          shell: true
          command: "trap 'exit 130' INT; echo waiting; while true; do sleep 0.1; done"
          timeout: 10s
          session:
            - expect: waiting
            - send: { key: ctrl-c }
      - assert:
          exit_code: 130

  # A paste is a different input path from typing, and a program only receives
  # one after asking for the mode (#378). Both halves of that contract are
  # pinned: the bytes when the program asked, and the refusal when it did not.
  - name: a bracketed paste is delivered wrapped, and refused when unasked for
    skip:
      os: windows
    steps:
      # 14 bytes is exactly the paste: the two markers plus "ab". Bounding the
      # read that way lets the program exit on its own instead of on a timeout.
      - pty:
          shell: true
          command: 'stty raw -echo; printf "\033[?2004hREADY\r\n"; head -c 14 | cat -v'
          timeout: 10s
          session:
            - expect: READY # printed after the mode request, so the mode is on
            - send: { paste: "ab" }
      - assert:
          exit_code: 0
          stdout:
            contains: "^[[200~ab^[[201~"
      # cat never enables the mode, so the markers would arrive as ordinary
      # characters. atago refuses at the send rather than letting the mistake
      # surface as strange input inside the program.
      - fixture:
          file: unasked.atago.yaml
          content: |
            version: "1"
            suite:
              name: inner
            scenarios:
              - name: pastes at a program that never asked
                steps:
                  - pty:
                      command: cat
                      timeout: 5s
                      session:
                        - send: {paste: "ab"}
      - run:
          command: ${atago} run unasked.atago.yaml
      - assert:
          exit_code: 4 # an execution error, not an assertion failure
          stdout:
            contains:
              - "has not enabled bracketed paste"
              - "ESC [?2004h"

  # A mid-session resize (#379) has to do two separate things: deliver the size
  # change to the program the way a real terminal does, and make the rendered
  # screen follow. Both are pinned here.
  - name: a resize delivers the new size and the screen follows it
    skip:
      os: windows
    steps:
      # `stty size` reads the terminal's own idea of its size, so this reports
      # what the kernel recorded — and it only runs a second time because
      # SIGWINCH was actually delivered to the foreground process group.
      - pty:
          shell: true
          command: 'trap "stty size; exit 0" WINCH; stty size; while :; do sleep 0.05; done'
          rows: 24
          cols: 80
          timeout: 15s
          session:
            - expect: "24 80" # settle before resizing, so the boundary is clean
            - resize: { rows: 40, cols: 100 }
      - assert:
          exit_code: 0
          stdout:
            contains: "40 100"
      # The rendered screen is replayed at the sizes each part was produced
      # under. This line is 12 characters: at the starting 10 columns it wraps,
      # and the resize afterwards must NOT re-flow what was already drawn.
      - pty:
          shell: true
          command: "printf 'abcdefghijKL\r\n'; sleep 0.2"
          rows: 5
          cols: 10
          timeout: 15s
          session:
            - expect: "KL"
            - resize: { rows: 6, cols: 40 }
      - assert:
          screen:
            contains: "abcdefghij\nKL"

  # Everything else in a session is caused by a keystroke. `exec:` (#380) is the
  # one action that is not: it changes the world while the program runs, so a
  # session can test what the program does about it — the watcher path no
  # keystroke can reach.
  - name: a session can change the world and watch the program notice
    skip:
      os: windows
    steps:
      # The program is a file watcher, so nothing it prints can be caused by
      # typing. FOUND appears only because the exec below created the file while
      # the program was already running and looking for it.
      - pty:
          shell: true
          command: 'while :; do if [ -f marker.txt ]; then echo FOUND; break; fi; sleep 0.05; done'
          timeout: 20s
          session:
            - exec: "touch marker.txt"
            - expect: FOUND
      - assert:
          exit_code: 0
          stdout:
            contains: FOUND
      # The exec created it in the scenario workdir, not somewhere else.
      - assert:
          file:
            path: marker.txt
            exists: true
      # A broken helper stops the run at the mistake. Without that, the expect
      # after it would wait out the whole session budget for a change nobody
      # made, and blame the program under test for not reacting.
      - fixture:
          file: badexec.atago.yaml
          content: |
            version: "1"
            suite:
              name: inner
            scenarios:
              - name: the helper fails
                steps:
                  - pty:
                      shell: true
                      command: 'sleep 5'
                      timeout: 10s
                      session:
                        - exec: {command: "exit 7", shell: true}
                        - expect: never-comes
      - run:
          command: ${atago} run badexec.atago.yaml
      - assert:
          exit_code: 4 # an execution error, not an assertion failure
          stdout:
            contains:
              - "exited 7"
              - "the change the session waits for was not made"

  # A mouse event (#381) only means something to a program that asked to be
  # told about the mouse, in the encoding atago speaks. Both halves are pinned:
  # the exact report bytes when the program asked, and the refusal when it did
  # not.
  - name: a mouse click is delivered as an SGR report, and refused when unasked for
    skip:
      os: windows
    steps:
      # 20 bytes is exactly the click: the press and its release, ten bytes each.
      # Bounding the read that way lets the program exit on its own.
      - pty:
          shell: true
          command: 'stty raw -echo; printf "\033[?1002h\033[?1006hREADY\r\n"; head -c 20 | cat -v'
          timeout: 10s
          session:
            - expect: READY # printed after both mode requests, so both are on
            - send: { mouse: { row: 5, col: 12 } }
      - assert:
          exit_code: 0
          stdout:
            # SGR order is column then row, which is the transposition worth
            # catching here rather than inside a TUI.
            contains: "^[[<0;12;5M^[[<0;12;5m"
      # cat never enables tracking, so the report would be meaningless bytes.
      # atago refuses at the send rather than letting the mistake surface as a
      # TUI that mysteriously ignored a click.
      - fixture:
          file: unasked_mouse.atago.yaml
          content: |
            version: "1"
            suite:
              name: inner
            scenarios:
              - name: clicks at a program that never asked
                steps:
                  - pty:
                      command: cat
                      timeout: 5s
                      session:
                        - send: {mouse: {row: 1, col: 1}}
      - run:
          command: ${atago} run unasked_mouse.atago.yaml
      - assert:
          exit_code: 4 # an execution error, not an assertion failure
          stdout:
            contains:
              - "has not enabled mouse reporting"
              - "ESC [?1000h"

  - name: an unknown key name is a load-time error listing the vocabulary
    steps:
      - fixture:
          file: badkey.atago.yaml
          content: |
            version: "1"
            suite:
              name: inner
            scenarios:
              - name: typo'd key
                steps:
                  - pty:
                      command: cat
                      session:
                        - send: { key: entr }
      - run:
          command: ${atago} run badkey.atago.yaml
      - assert:
          exit_code: 2
          stderr:
            contains: 'not a supported key (supported: enter, tab'

  - name: screen asserts see the final frame where the transcript sees history
    skip:
      os: windows
    steps:
      # An overwritten progress line (#27): the rendered screen holds only
      # the final text; the raw transcript still carries both versions.
      - pty:
          shell: true
          command: "printf 'loading...\r'; printf 'done.      \r\n'"
          rows: 10
          cols: 40
      - assert:
          screen:
            line: 1
            equals: "done."
      - assert:
          screen:
            not_contains: loading
      - assert:
          stdout:
            contains: loading

  - name: a screen snapshot round-trips through update and compare
    skip:
      os: windows
    steps:
      - fixture:
          file: inner.atago.yaml
          content: |
            version: "1"
            suite:
              name: inner
            scenarios:
              - name: menu frame
                steps:
                  - pty:
                      shell: true
                      command: "printf '\\033[2J\\033[HMain Menu\\r\\n> Settings\\r\\n'"
                      rows: 10
                      cols: 40
                  - assert:
                      screen:
                        snapshot: snapshots/menu.txt
      - run:
          command: ${atago} run --update-snapshots inner.atago.yaml
      - assert:
          exit_code: 0
          file:
            path: snapshots/menu.txt
            contains: "> Settings"
      - run:
          command: ${atago} run inner.atago.yaml
      - assert:
          exit_code: 0

  - name: a screen assert without a pty step is a load-time error
    steps:
      - fixture:
          file: bad.atago.yaml
          content: |
            version: "1"
            suite:
              name: bad
            scenarios:
              - name: no pty
                steps:
                  - run: {command: echo hi}
                  - assert:
                      screen: {contains: hi}
      - run:
          command: ${atago} run bad.atago.yaml
      - assert:
          exit_code: 2
          stderr:
            contains: "requires a preceding pty step"

  - name: a send referencing an undefined variable is an execution error, not typed literally
    skip:
      os: windows
    steps:
      # #78: a pty session entry that references a ${name} nothing defines must
      # fail the run with the same fix-forward guard a no-shell run.command
      # produces — otherwise st.Expand leaves the reference verbatim and the
      # literal `${no_such_var}` is TYPED into the program, so a typo'd store
      # name feeds garbage instead of failing at the mistake. The run errors
      # (exit 4) and the message names the reference and the $${...} escape.
      - fixture:
          file: typo.atago.yaml
          content: |
            version: "1"
            suite:
              name: typo
            scenarios:
              - name: typo in a send variable
                steps:
                  - pty:
                      command: cat
                      timeout: 5s
                      session:
                        - send: "${no_such_var}\n"
      - run:
          command: ${atago} run typo.atago.yaml
      - assert:
          exit_code: 4
          stdout:
            contains:
              - "no variable with that name is defined"
              - "$${no_such_var}"
