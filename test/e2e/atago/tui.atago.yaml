version: "1"

# pty/TUI behavior against the real terminal (#8, #27): a pty step must export a
# usable TERM so full-screen programs draw, and each expect must consume its
# match so a recurring prompt is not matched from stale history. POSIX-only.

suite:
  name: atago self-hosting / tui

scenarios:
  # A pty child gets TERM=xterm-256color by default — without it, ncurses/termios
  # programs refuse full-screen mode ("terminal is not fully functional").
  - name: a pty step exports a usable TERM by default
    skip:
      os: windows
    steps:
      - pty:
          shell: true
          command: 'echo "TERM=[$TERM]"'
      - assert:
          exit_code: 0
          stdout:
            contains: "TERM=[xterm-256color]"

  # An author-set TERM wins over the default.
  - name: an explicit TERM overrides the default
    skip:
      os: windows
    steps:
      - pty:
          shell: true
          command: 'echo "TERM=[$TERM]"'
          env:
            TERM: vt100
      - assert:
          exit_code: 0
          stdout:
            contains: "TERM=[vt100]"

  # Each expect scans only the transcript after the previous match: "AAA" is
  # printed once, so a second expect for it must NOT match the stale one and the
  # session must time out (proving it cannot race ahead on a recurring prompt).
  - name: an expect does not re-match a consumed pattern
    skip:
      os: windows
    steps:
      - fixture:
          file: inner.atago.yaml
          content: |
            version: "1"
            suite:
              name: inner
            scenarios:
              - name: stale expect must not re-match
                steps:
                  - pty:
                      shell: true
                      command: 'printf "AAA\n"'
                      timeout: 1s
                      session:
                        - expect: "AAA"
                        - expect: "AAA"
      - run:
          command: ${atago} run inner.atago.yaml
      - assert:
          exit_code: 1
          stdout:
            contains: "1 failed"

  # A failing screen assert frames the screen so the reader can see where each
  # row ends. The frame is drawn in DISPLAY COLUMNS: the Japanese row below is
  # seven runes and fourteen columns, and measuring it in runes closed the box at
  # eight and left that row hanging outside it. Both rows must end at the same
  # "|", which is what the two literals here pin.
  - name: a failing screen assert frames a CJK screen squarely
    skip:
      os: windows
    steps:
      - fixture:
          file: inner.atago.yaml
          content: |
            version: "1"
            suite:
              name: inner
            scenarios:
              - name: screen assert that must fail
                steps:
                  - pty:
                      shell: true
                      command: 'printf "abcdefgh\r\n日本語メニュー\r\n"'
                      rows: 4
                      cols: 20
                  - assert:
                      screen:
                        contains: "NOT ON THIS SCREEN"
      - run:
          command: ${atago} run inner.atago.yaml
      - assert:
          exit_code: 1
          stdout:
            contains:
              - "| abcdefgh       |"
              - "| 日本語メニュー |"

  # A wide character occupies two terminal columns, so a label the program
  # positions with cursor addressing after a Japanese string sits flush against
  # it. "日本語" is three characters and six columns; the label is written at
  # column 7 (\x1b[1;7H) and must land immediately after, with no gap — the gap a
  # one-column-per-rune renderer would leave (#432).
  - name: a screen assert sees wide characters at their true width
    skip:
      os: windows
    steps:
      - pty:
          shell: true
          command: 'printf "\033[2J\033[1;1H日本語\033[1;7H[OK]"'
          rows: 3
          cols: 20
      - assert:
          screen:
            contains: "日本語[OK]"
            not_contains: "日本語 [OK]"

  # A REAL third-party TUI pager: less -X keeps its output on the primary screen,
  # so after quitting the rendered screen still shows the file. (less using the
  # alternate screen would restore a blank primary screen on exit — documented in
  # examples/pty.atago.yaml.) Gated on less being installed.
  - name: less -X renders a real pager onto the screen
    skip:
      os: windows
    only:
      command: command -v less
    steps:
      - fixture:
          file: page.txt
          content: "Alpha line\nBeta line\nGamma line\n"
      - pty:
          command: less -X page.txt
          rows: 10
          cols: 40
          session:
            - expect: "Alpha line"
            - send: "q"
      - assert:
          screen:
            contains: "Alpha line"
      - assert:
          screen:
            contains: "Gamma line"
