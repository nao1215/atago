version: "1"

suite:
  name: atago self-hosting / selection

scenarios:
  - name: --filter runs only matching scenarios
    steps:
      - fixture:
          file: many.atago.yaml
          content: |
            version: "1"
            suite:
              name: many
            scenarios:
              - name: keep this one
                steps: [{run: {shell: true, command: echo a}}, {assert: {exit_code: 0}}]
              - name: drop that one
                steps: [{run: {shell: true, command: echo b}}, {assert: {exit_code: 0}}]
      - run:
          command: ${atago} run --filter keep many.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains: "1 passed"

  - name: --filter selects multiple scenarios with OR (comma and repeated)
    steps:
      - fixture:
          file: three.atago.yaml
          content: |
            version: "1"
            suite:
              name: three
            scenarios:
              - name: alpha one
                steps: [{run: {shell: true, command: echo a}}, {assert: {exit_code: 0}}]
              - name: beta two
                steps: [{run: {shell: true, command: echo b}}, {assert: {exit_code: 0}}]
              - name: gamma three
                steps: [{run: {shell: true, command: echo c}}, {assert: {exit_code: 0}}]
      # Comma list ORs the substrings: alpha + beta run, gamma does not.
      - run:
          command: ${atago} run --filter alpha,beta three.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains: "2 passed"
      # Repeating the flag ORs too (the old behavior silently kept only the last).
      - run:
          command: ${atago} run --filter alpha --filter gamma three.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains: "2 passed"

  - name: --skip-tag drops tagged scenarios
    steps:
      - fixture:
          file: tagged.atago.yaml
          content: |
            version: "1"
            suite:
              name: tagged
            scenarios:
              - name: quick
                tags: [fast]
                steps: [{run: {shell: true, command: echo a}}, {assert: {exit_code: 0}}]
              - name: heavy
                tags: [slow]
                steps: [{run: {shell: true, command: echo b}}, {assert: {exit_code: 0}}]
      - run:
          command: ${atago} run --skip-tag slow tagged.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains: "1 passed"

  # A tag list is a set, so repeating an entry selects nothing extra — but the
  # generated docs count occurrences, so a scenario listing `smoke` twice made
  # the suite summary claim two scenarios carry it, and `atago list` printed
  # "smoke,smoke" beside the scenario.
  - name: a repeated tag on one scenario is a load-time error
    steps:
      - fixture:
          file: duptag.atago.yaml
          content: |
            version: "1"
            suite:
              name: inner
            scenarios:
              - name: tagged twice
                tags: [smoke, smoke]
                steps:
                  - run: {shell: true, command: "true"}
      - run:
          command: ${atago} run duptag.atago.yaml
      - assert:
          exit_code: 2
          stderr:
            contains: 'duplicate tag "smoke"'
      # The same tag on two different scenarios is the ordinary case: the docs
      # then say "smoke (2)" about two scenarios, which is true.
      - fixture:
          file: shared.atago.yaml
          content: |
            version: "1"
            suite:
              name: inner
            scenarios:
              - name: first
                tags: [smoke]
                steps:
                  - run: {shell: true, command: "true"}
              - name: second
                tags: [smoke]
                steps:
                  - run: {shell: true, command: "true"}
      - run:
          command: ${atago} doc shared.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains: "`smoke` (2)"

  # An empty tag selected nothing — no --tag invocation names it — while still
  # counting in every index: `atago list` rendered the column as ",smoke" and
  # the generated docs summarized "Tags: `` (1)".
  - name: an empty tag is a load-time error
    steps:
      - fixture:
          file: emptytag.atago.yaml
          content: |
            version: "1"
            suite:
              name: inner
            scenarios:
              - name: carries an empty tag
                tags: ["", smoke]
                steps:
                  - run: {shell: true, command: "true"}
      - run:
          command: ${atago} run emptytag.atago.yaml
      - assert:
          exit_code: 2
          stderr:
            contains: "tag must not be empty"

  # ready.store binds a variable like store: and matrix: do, and the guard that
  # refuses those from shadowing a built-in never learned this third site: a
  # `ready: {store: workdir}` silently redefined ${workdir} for the rest of the
  # scenario, so a later step read somewhere other than its own workdir.
  - name: a ready.store that shadows a built-in is a load-time error
    steps:
      - fixture:
          file: readyshadow.atago.yaml
          content: |
            version: "1"
            suite:
              name: inner
            scenarios:
              - name: shadows the workdir
                services:
                  - name: writer
                    command: ./writer
                    ready: {file: marker.txt, store: workdir}
                steps:
                  - run: {shell: true, command: "true"}
      - run:
          command: ${atago} run readyshadow.atago.yaml
      - assert:
          exit_code: 2
          stderr:
            contains: "shadows a built-in variable"

  # Duplicate names are refused within a scope, but a scenario service could
  # reuse a suite service's name, leaving a signal: step's target ambiguous
  # with nothing said about which process it reached.
  - name: a scenario service that shadows a suite service is a load-time error
    steps:
      - fixture:
          file: svcshadow.atago.yaml
          content: |
            version: "1"
            suite:
              name: inner
              setup:
                - service: {name: peer, command: ./peer}
            scenarios:
              - name: declares its own peer
                services:
                  - {name: peer, command: ./peer}
                steps:
                  - run: {shell: true, command: "true"}
      - run:
          command: ${atago} run svcshadow.atago.yaml
      - assert:
          exit_code: 2
          stderr:
            contains: 'duplicate service name "peer"'
