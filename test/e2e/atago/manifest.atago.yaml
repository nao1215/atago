version: "1"

suite:
  name: atago self-hosting / manifest

scenarios:
  - name: manifest emits a stable JSON summary without running the spec
    steps:
      - fixture:
          file: sample.atago.yaml
          content: |
            version: "1"
            suite:
              name: demo
            secrets:
              - TOKEN
            scenarios:
              - name: "greets ${who}"
                tags: [smoke]
                matrix:
                  - { who: Alice }
                  - { who: Bob }
                steps:
                  - run:
                      command: echo ${who}
                  - assert:
                      stdout:
                        contains: ${who}
                      file:
                        path: out.txt
                        exists: true
      - run:
          command: ${atago} manifest sample.atago.yaml
      - assert:
          exit_code: 0
      # Stable top-level fields.
      - assert:
          stdout:
            json:
              path: $.schema_version
              equals: "1"
      - assert:
          stdout:
            json:
              path: $.specs[0].suite
              equals: demo
      - assert:
          stdout:
            json:
              path: $.specs[0].secrets[0]
              equals: TOKEN
      # The matrix expands into two concrete scenarios, each with its bound row.
      - assert:
          stdout:
            json:
              path: $.specs[0].scenarios
              length: 2
      - assert:
          stdout:
            json:
              path: $.specs[0].scenarios[0].vars.who
              equals: Alice
      # Generated artifacts are surfaced from file exists=true assertions.
      - assert:
          stdout:
            json:
              path: $.specs[0].scenarios[0].generates[0]
              equals: out.txt
      # Source locations point tooling straight at the authored YAML (#80). The
      # suite name is on line 3 of the fixture content above.
      - assert:
          stdout:
            json:
              path: $.specs[0].source.line
              equals: 3
      # Both matrix instances trace back to the authored scenario on line 7.
      - assert:
          stdout:
            json:
              path: $.specs[0].scenarios[0].source.line
              equals: 7
      - assert:
          stdout:
            json:
              path: $.specs[0].scenarios[1].source.line
              equals: 7
      # The first step (run) is on line 13.
      - assert:
          stdout:
            json:
              path: $.specs[0].scenarios[0].steps[0].source.line
              equals: 13

  - name: manifest does not execute the spec's commands
    steps:
      - fixture:
          file: side_effect.atago.yaml
          content: |
            version: "1"
            suite:
              name: side
            scenarios:
              - name: would write a file
                steps:
                  - run:
                      shell: true
                      command: touch executed.marker
                  - assert:
                      exit_code: 0
      - run:
          command: ${atago} manifest side_effect.atago.yaml
      - assert:
          exit_code: 0
      # The command must not have run, so its side-effect file must not exist.
      - assert:
          file:
            path: executed.marker
            exists: false

  # Regression: the manifest describes what a spec declares without replaying
  # it, and the reductions dropped the step's own bounds (cwd, timeout) and
  # redirect targets, and the runner's cwd/timeout/user and — most of all —
  # insecure_host_key, whose security note fires only when a run step uses that
  # runner. Credential material stays out, as has_dsn already established.
  - name: manifest carries the declarative fields of steps and runners
    steps:
      - fixture:
          file: fields.atago.yaml
          content: |
            version: "1"
            suite:
              name: fields
            runners:
              slowbox: {type: cmd, cwd: ./sub, timeout: 45s}
              jump: {type: ssh, host: "shell.example:2222", user: deploy, password: hunter2, insecure_host_key: true}
            scenarios:
              - name: declarative knobs
                steps:
                  - run:
                      command: build-tool compile
                      cwd: sub/dir
                      timeout: 90s
                      stdout_to: logs/build.log
                      stderr_to: logs/build.err
      - run:
          command: ${atago} manifest fields.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            json:
              - path: "$.specs[0].scenarios[0].steps[0].cwd"
                equals: "sub/dir"
              - path: "$.specs[0].scenarios[0].steps[0].timeout"
                equals: "90s"
              - path: "$.specs[0].scenarios[0].steps[0].stdout_to"
                equals: "logs/build.log"
              - path: "$.specs[0].scenarios[0].steps[0].stderr_to"
                equals: "logs/build.err"
              - path: "$.specs[0].runners[0].insecure_host_key"
                equals: true
              - path: "$.specs[0].runners[0].user"
                equals: "deploy"
              - path: "$.specs[0].runners[1].cwd"
                equals: "./sub"
              - path: "$.specs[0].runners[1].timeout"
                equals: "45s"
      # An ssh password is credential material: it must never reach the document.
      - assert:
          stdout:
            not_contains: "hunter2"

  # Regression: a redirect in suite.setup or suite.teardown wrote a file that
  # appeared in no summary at all, and a directory manifest's subject build —
  # an arbitrary command, optionally through the shell, that runs on the host
  # before any scenario — was described by nothing. `atago manifest` also read
  # specs through a loader path that skipped manifest discovery entirely, so it
  # reported no project_path where explain reported one.
  - name: manifest describes the suite lifecycle outputs and the subject build
    steps:
      - fixture:
          file: atago.project.yaml
          content: |
            subject:
              name: mytool
              artifact: bin/mytool
              build:
                command: "curl -s https://build.example/prebuilt > $${artifact}"
                shell: true
      - fixture:
          file: suitegen.atago.yaml
          content: |
            version: "1"
            suite:
              name: suitegen
              setup:
                - run: {command: seed, stdout_to: build/seed.txt}
              teardown:
                - run: {command: audit, stdout_to: logs/suite-audit.log}
            scenarios:
              - name: quiet
                steps:
                  - run: {command: echo}
      - run:
          command: ${atago} manifest suitegen.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            json:
              - path: "$.specs[0].suite_generates[0]"
                equals: "build/seed.txt"
              - path: "$.specs[0].suite_generates[1]"
                equals: "logs/suite-audit.log"
              - path: "$.specs[0].subject.name"
                equals: "mytool"
              - path: "$.specs[0].subject.shell"
                equals: true
              - path: "$.specs[0].suite_security[0]"
                equals: "shell execution enabled (subject build mytool): curl -s https://build.example/prebuilt > $${artifact}"
      - assert:
          stdout:
            contains: '"project_path"'
      - run:
          command: ${atago} explain suitegen.atago.yaml
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "Subject under test: mytool (built by: curl -s https://build.example/prebuilt > $${artifact}, shell)"
              - "Suite generates:"
              - "build/seed.txt"
              - "network access (subject build mytool)"

  # A manifest that reduced every assert to its target name could not say what a
  # suite checks: two different assertions on one target were indistinguishable,
  # and so were a strong assertion and the weakened version of it — a gutted
  # suite produced a byte-identical manifest.
  - name: an assert step carries the assertion, not only its target
    steps:
      - fixture:
          file: strong.atago.yaml
          content: |
            version: "1"
            suite: {name: same}
            scenarios:
              - name: checks
                steps:
                  - run: {command: echo hi}
                  - assert:
                      exit_code: 0
                      stdout: {equals: "hi\n"}
      - fixture:
          file: weak.atago.yaml
          content: |
            version: "1"
            suite: {name: same}
            scenarios:
              - name: checks
                steps:
                  - run: {command: echo hi}
                  - assert:
                      exit_code: {in: [0, 1, 2]}
                      stdout: {not_contains: "zzz"}
      # stdout_to rather than a shell redirect, so the scenario runs in the
      # Windows portable subset too.
      - run:
          command: "${atago} manifest strong.atago.yaml"
          stdout_to: strong.json
      - assert:
          exit_code: 0
          file:
            path: strong.json
            contains:
              - "exit code is 0"
              - "stdout equals exact text"
      - run:
          command: "${atago} manifest weak.atago.yaml"
          stdout_to: weak.json
      - assert:
          exit_code: 0
          file:
            path: weak.json
            contains:
              - "exit code in [0, 1, 2]"
              - "stdout does not contain"
      # The two documents differ, which is the whole point: the weakened suite
      # can be told from the strong one by diffing them. The suite name and the
      # scenario name are identical in both, so before the assertion detail was
      # recorded these two files were byte-identical.
      - assert:
          file:
            path: weak.json
            not_contains:
              - "exit code is 0"
              - "stdout equals exact text"

  # explain and manifest render an expanded matrix row the way doc does. The row
  # is bound at load time, so leaving ${who} in the step text describes a command
  # nobody runs — and makes the two rows of one matrix read identically under two
  # different headings.
  - name: explain and manifest substitute a matrix row into the step text
    steps:
      - fixture:
          file: rows.atago.yaml
          content: |
            version: "1"
            suite: {name: rows}
            scenarios:
              - name: greets $${who}
                matrix:
                  - {who: alice}
                  - {who: bob}
                steps:
                  - run: {command: "echo $${who}"}
                  - assert: {exit_code: 0}
      - run: {command: "${atago} explain rows.atago.yaml"}
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "echo alice"
              - "echo bob"
            not_contains: "echo ${who}"
      - run: {command: "${atago} manifest rows.atago.yaml"}
      - assert:
          exit_code: 0
          stdout:
            contains:
              - '"command": "echo alice"'
              - '"command": "echo bob"'
            not_contains: '"command": "echo ${who}"'
      # The binding stays visible, so a consumer can still see which row a
      # scenario came from.
      - assert:
          stdout:
            json:
              - path: "$.specs[0].scenarios[0].vars.who"
                equals: "alice"
