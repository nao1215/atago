version: "1"

suite:
  name: atago self-hosting / variable resolution semantics

# atago interpolates ${...} before a command runs. This pins the resolution
# contract: builtins (${workdir}, ${atago}) and ${env:NAME} expand; a `$${...}`
# escape stays literal; an unresolved reference is a hard error (not a silent
# empty) when shell: false so a typo cannot pass unnoticed; and with shell: true
# an unknown ${...} is deferred to the shell instead. echo is a POSIX builtin, so
# this suite runs on make e2e; the resolver itself is OS-independent (unit tests
# in internal/store cover Windows).
scenarios:
  - name: a doubled dollar keeps the braces literal
    skip:
      # The MSYS runtime brace-expands an argument before the Git-for-Windows
      # `echo.exe` ever sees it, turning ${keep} into $keep. atago's own half —
      # collapsing $${...} to a literal ${...} before the command is built — is
      # platform-neutral and is pinned by the loader's unit tests; what this
      # scenario cannot do on Windows is observe the result through a stand-in
      # program that rewrites its own arguments.
      os: windows
    steps:
      - run: {command: "echo pre-$${keep}-post"}
      - assert:
          stdout:
            contains: "${keep}"

  - name: the workdir builtin expands to the scenario directory
    steps:
      - run: {command: "echo at=${workdir}"}
      - assert:
          stdout:
            # The assertion value is expanded too, so the escaped literal proves
            # the command output no longer contains an unexpanded ${workdir}.
            not_contains: "$${workdir}"

  - name: the atago builtin resolves to the binary under test
    steps:
      - run: {command: "${atago} --version"}
      - assert:
          exit_code: 0
          stdout:
            contains: "atago"

  - name: an env reference expands from the host environment
    steps:
      - run: {command: "echo path=${env:PATH}"}
      - assert:
          stdout:
            matches: "path=.+"

  - name: shell true defers an unknown reference to the shell
    steps:
      - run: {shell: true, command: "echo [${undefined_in_atago}]"}
      - assert:
          exit_code: 0
          stdout:
            equals: "[]"

  - name: an unresolved variable is a hard error, not a silent empty
    steps:
      - fixture:
          file: typo.atago.yaml
          content: |
            version: "1"
            suite: {name: typo}
            scenarios:
              - name: a misspelled variable stops the run
                steps:
                  - run: {command: "echo ${reuslt}"}
      - run: {command: "${atago} run typo.atago.yaml"}
      - assert:
          exit_code: 4
          stdout:
            contains:
              - "references ${reuslt}"
              - "no variable with that name is defined"

  - name: an unset env reference names the missing variable
    steps:
      - fixture:
          file: unsetenv.atago.yaml
          content: |
            version: "1"
            suite: {name: unsetenv}
            scenarios:
              - name: an unset env var stops the run
                steps:
                  - run: {command: "echo ${env:ATAGO_SURELY_UNSET_VAR}"}
      - run: {command: "${atago} run unsetenv.atago.yaml"}
      - assert:
          exit_code: 4
          stdout:
            contains: "environment variable ATAGO_SURELY_UNSET_VAR is not set"

  - name: the same rule covers the command that starts a pty session
    # Every entry inside `session:` was guarded from the start, while the
    # command that starts the session was expanded with the reference left
    # verbatim and handed to the OS — so the failure arrived from the program
    # instead of from the mistake in the spec.
    skip:
      os: windows
    steps:
      - fixture:
          file: ptytypo.atago.yaml
          content: |
            version: "1"
            suite: {name: ptytypo}
            scenarios:
              - name: a misspelled variable in a pty command stops the run
                steps:
                  - pty:
                      command: "cat $${no_such_file}"
                      timeout: 10s
                      session:
                        - send: {key: ctrl-d}
      - run: {command: "${atago} run ptytypo.atago.yaml"}
      - assert:
          exit_code: 4
          stdout:
            contains:
              - "ATG4505"
              - "pty.command references ${no_such_file}"

  - name: an unresolved reference reports one diagnostic code everywhere
    # The same failure used to be coded inside a pty session and uncoded for a
    # run step, so `atago explain` could answer for one and not the other.
    steps:
      - fixture:
          file: coded.atago.yaml
          content: |
            version: "1"
            suite: {name: coded}
            scenarios:
              - name: a run step
                steps:
                  - run: {command: "echo $${no_such_var}"}
      - run: {command: "${atago} run coded.atago.yaml"}
      - assert:
          exit_code: 4
          stdout:
            contains:
              - "ATG4505"
              - "run.command references ${no_such_var}"
