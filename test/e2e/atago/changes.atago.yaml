version: "1"

suite:
  name: atago self-hosting / changes (workdir delta assertions)

# Exercises #70: the `changes:` assert pins the EXACT set of files the
# immediately preceding run/pty step created, modified, and deleted in the
# scenario workdir — the "this command touches only these files" contract that
# per-path file: asserts cannot state. Each set field is exhaustive in both
# directions, so `modified: []` asserts "modified nothing" and an omitted field
# is unconstrained. Fixture writes are inputs (they land before the pre-scan),
# not changes.
#
# The multi-file setup uses a POSIX shell, so the first scenario skips on
# Windows; a portable stdout_to-only scenario runs everywhere to prove the
# created-counting rule on Windows too.
scenarios:
  - name: a generator touches exactly the files it should (POSIX)
    skip:
      os: windows
    steps:
      - fixture:
          file: config.yaml
          content: "theme: light\n"
      - fixture:
          file: stale.html
          content: "old\n"
      - run:
          shell: true
          command: >-
            printf 'theme: dark\n' > config.yaml &&
            rm stale.html &&
            mkdir -p site/assets &&
            printf '<html></html>' > site/index.html &&
            printf 'body{}' > site/assets/app.css
      - assert:
          exit_code: 0
          changes:
            created:
              - site/index.html
              - site/assets/*.css
            modified:
              - config.yaml
            deleted:
              - stale.html

  - name: an unexpected creation breaks the exact contract (POSIX)
    skip:
      os: windows
    steps:
      - fixture:
          file: check.atago.yaml
          content: |
            version: "1"
            suite:
              name: unexpected
            scenarios:
              - name: extra file
                steps:
                  - run:
                      shell: true
                      command: 'echo a > a.txt && echo b > b.txt'
                  - assert:
                      changes:
                        created:
                          - a.txt
      - run:
          command: ${atago} run check.atago.yaml
      # b.txt is an unexpected creation, so the inner run fails (exit 1).
      - assert:
          exit_code: 1
          stdout:
            contains: "unexpected created file"

  - name: stdout_to counts as created, and modified nothing holds (portable)
    steps:
      - fixture:
          file: input.txt
          content: seed
      - run:
          shell: true
          command: echo produced
          stdout_to: result.txt
      - assert:
          exit_code: 0
          changes:
            created:
              - result.txt
            modified: []
            deleted: []

  - name: the delta over a retried step reflects only the converged attempt (POSIX)
    skip:
      os: windows
    steps:
      # Pinned semantic (#251): with retry, atago re-scans the workdir baseline
      # before EVERY attempt, so the changes delta reflects only the final,
      # converged attempt — the state the until gate accepted — not the
      # cumulative footprint of every attempt. This command fails on attempt 1
      # (c does not exist yet) and passes on attempt 2. On attempt 2, a and b
      # already exist from attempt 1 (so they are baseline, not changes), and the
      # only new file the winning attempt creates is c.
      - run:
          shell: true
          command: 'touch a; [ -f b ] && touch c; touch b; [ -f c ]'
          retry:
            times: 3
            interval: 10ms
            until:
              exit_code: 0
      - assert:
          exit_code: 0
          changes:
            created:
              - c
            modified: []
            deleted: []

  - name: deleting and recreating a byte-identical file appears in no list (POSIX)
    skip:
      os: windows
    steps:
      # The delta is state based, not event based: a file that is removed and
      # rewritten with its ORIGINAL bytes and mode is indistinguishable from
      # untouched, so it appears in none of created/modified/deleted. The seed
      # is written by the shell rather than by a fixture so that both writes get
      # the same umask-derived mode — a fixture is written 0600, and recreating
      # it through the shell would be a permission change, which the delta does
      # report.
      - run:
          shell: true
          command: 'printf hello > f.txt'
      - run:
          shell: true
          command: 'rm f.txt && printf hello > f.txt'
      - assert:
          exit_code: 0
          changes:
            created: []
            modified: []
            deleted: []

  - name: deleting and recreating with different content is modified only (POSIX)
    skip:
      os: windows
    steps:
      # Same delete+recreate, but the new bytes differ — so the content hash
      # changes and the file reports as modified (not deleted+created).
      - fixture:
          file: f.txt
          content: "hello"
      - run:
          shell: true
          command: 'rm f.txt && printf world > f.txt'
      - assert:
          exit_code: 0
          changes:
            created: []
            modified:
              - f.txt
            deleted: []

  - name: stdout_to overwrites a fixture (modified) while stderr_to creates an empty file (POSIX)
    skip:
      os: windows
    steps:
      # stdout_to onto a pre-existing fixture rewrites it with new bytes, so it
      # is modified; stderr_to captures an empty stderr, which still creates a
      # brand-new 0-byte file that the delta counts as created.
      - fixture:
          file: existing.txt
          content: "old"
      - run:
          shell: true
          command: printf newcontent
          stdout_to: existing.txt
          stderr_to: err.txt
      - assert:
          exit_code: 0
          changes:
            created:
              - err.txt
            modified:
              - existing.txt
            deleted: []

  - name: a pty step feeds the delta scan just like a run step (POSIX)
    skip:
      os: windows
    steps:
      # The pre/post workdir scan wraps a pty step too: the file the
      # interactive command touched shows up in the very next changes assert.
      - pty:
          shell: true
          command: 'sh -c "touch from-pty; echo done"'
          timeout: 10s
          session:
            - expect: done
      - assert:
          changes:
            created:
              - from-pty

  - name: a doublestar glob pins an arbitrary-depth generated tree exactly (POSIX)
    skip:
      os: windows
    steps:
      # A generator that writes a 3-level tree of unknown depth: a single
      # `out/**` entry (#76) pins the whole subtree at once — impossible with
      # single-level `*`, which never crosses `/` — while modified/deleted stay
      # empty to keep the exhaustive-both-ways contract intact.
      - run:
          shell: true
          command: >-
            mkdir -p out/a/b &&
            printf '1' > out/top.txt &&
            printf '2' > out/a/mid.txt &&
            printf '3' > out/a/b/leaf.txt
      - assert:
          exit_code: 0
          changes:
            created:
              - "out/**"
            modified: []
            deleted: []

  - name: a stray file outside the doublestar prefix breaks the exact contract (POSIX)
    skip:
      os: windows
    steps:
      - fixture:
          file: check.atago.yaml
          content: |
            version: "1"
            suite:
              name: stray-outside-doublestar
            scenarios:
              - name: extra file beside the tree
                steps:
                  - run:
                      shell: true
                      command: 'mkdir -p out/a && printf x > out/a/leaf.txt && printf y > stray.txt'
                  - assert:
                      changes:
                        created:
                          - "out/**"
      - run:
          command: ${atago} run check.atago.yaml
      # stray.txt is created outside out/, so `out/**` cannot cover it and the
      # exhaustive contract fails (exit 1).
      - assert:
          exit_code: 1
          stdout:
            contains: "unexpected created file"

  - name: a doublestar glob matches a nested redirect target (portable)
    steps:
      # stdout_to writes into a directory atago creates; observed paths are
      # normalized to forward slashes, so `out/**` matches on Windows too — the
      # redirect and the glob need no POSIX shell.
      - run:
          shell: true
          command: echo produced
          stdout_to: out/deep/result.txt
      - assert:
          exit_code: 0
          changes:
            created:
              - "out/**"
            modified: []
            deleted: []

  - name: a doublestar prefix covers both redirect streams (portable)
    steps:
      # stdout_to and stderr_to both land under logs/; a single logs/** entry
      # covers the pair (an empty stderr still creates a 0-byte file).
      - run:
          shell: true
          command: echo out
          stdout_to: logs/out.txt
          stderr_to: logs/err.txt
      - assert:
          exit_code: 0
          changes:
            created:
              - "logs/**"
            modified: []
            deleted: []

  # A symlink is part of the workdir delta. Before this was tracked, a step that
  # planted a link slipped past `created: []` entirely — the assertion reported
  # "nothing happened" for a run that wired up a new path.
  - name: creating a symlink is a creation
    skip:
      os: windows
    steps:
      - fixture:
          file: real.txt
          content: "payload\n"
      - run:
          shell: true
          command: ln -s real.txt link.txt
      - assert:
          exit_code: 0
          changes:
            created: [link.txt]
            modified: []
            deleted: []

  - name: an exhaustive created list catches an unexpected symlink
    skip:
      os: windows
    steps:
      - fixture:
          file: check.atago.yaml
          content: |
            version: "1"
            suite:
              name: inner
            scenarios:
              - name: claims to create nothing
                steps:
                  - run:
                      shell: true
                      command: ln -s /etc/passwd sneaky
                  - assert:
                      exit_code: 0
                      changes:
                        created: []
      - run:
          command: ${atago} run check.atago.yaml
      - assert:
          exit_code: 1
          stdout:
            contains: "unexpected created file"

  # A symlink is compared by the target it names, so retargeting it is a
  # modification even though no file content changed.
  - name: retargeting a symlink is a modification
    skip:
      os: windows
    steps:
      - fixture:
          file: v1.txt
          content: "one\n"
      - fixture:
          file: v2.txt
          content: "two\n"
      - fixture:
          file: current
          symlink: v1.txt
      - run:
          shell: true
          command: ln -sfn v2.txt current
      - assert:
          exit_code: 0
          changes:
            created: []
            modified: [current]
            deleted: []

  # Writing through a link changes the target file, not the link: the link still
  # points where it did.
  - name: writing through a symlink modifies the target only
    skip:
      os: windows
    steps:
      - fixture:
          file: real.txt
          content: "before\n"
      - fixture:
          file: link.txt
          symlink: real.txt
      - run:
          shell: true
          command: printf 'after\n' > link.txt
      - assert:
          exit_code: 0
          changes:
            created: []
            modified: [real.txt]
            deleted: []

  - name: removing a symlink is a deletion
    skip:
      os: windows
    steps:
      - fixture:
          file: real.txt
          content: "payload\n"
      - fixture:
          file: link.txt
          symlink: real.txt
      - run:
          shell: true
          command: rm link.txt
      - assert:
          exit_code: 0
          changes:
            created: []
            modified: []
            deleted: [link.txt]

  # A dangling link names a target that does not exist. It is still an
  # observable creation: the delta reads the target, it never resolves it.
  - name: a dangling symlink is still a creation
    skip:
      os: windows
    steps:
      - run:
          shell: true
          command: ln -s no/such/target dangling
      - assert:
          exit_code: 0
          changes:
            created: [dangling]
            modified: []
            deleted: []

  # A workdir delta tracks regular files and symlinks. When an entry names a
  # directory the step really did create, "matched no file the step created" reads
  # as "the tool never made it" while the author can see it sitting there.
  - name: a changes entry naming a directory says what the path is
    steps:
      - fixture:
          file: direntry.atago.yaml
          content: |
            version: "1"
            suite: {name: direntry}
            scenarios:
              - name: the generator made a directory
                steps:
                  - run: {shell: true, command: "mkdir out"}
                  - assert:
                      changes:
                        created: [out]
      - run:
          command: ${atago} run direntry.atago.yaml
      - assert:
          exit_code: 1
          stdout:
            contains:
              - '"out" exists as a directory'
              - "tracks only regular files and symlinks"
              - "assert it with dir:"

  # A tool that writes a state file only on some runs cannot be pinned by an
  # exhaustive delta: naming the path fails on the runs that skip it, and dropping
  # the category asserts nothing. `ignore:` drops those paths from the observed
  # delta, so the rest of the claim stays exhaustive.
  - name: an ignored path does not break an exhaustive delta
    steps:
      - run:
          shell: true
          command: "mkdir -p cache && printf 'x' > cache/state.bin && printf 'y' > out.txt"
      - assert:
          exit_code: 0
          changes:
            ignore: ["cache/**"]
            created: [out.txt]
            modified: []
            deleted: []
      # The same spec is still exhaustive outside the ignored globs: a second file
      # the step did not declare fails.
      - fixture:
          file: strict.atago.yaml
          content: |
            version: "1"
            suite: {name: strict}
            scenarios:
              - name: an unignored surprise still fails
                steps:
                  - run: {shell: true, command: "mkdir -p cache && printf 'x' > cache/state.bin && printf 'y' > surprise.txt"}
                  - assert:
                      changes:
                        ignore: ["cache/**"]
                        created: []
      - run: {command: "${atago} run strict.atago.yaml"}
      - assert:
          exit_code: 1
          stdout:
            contains: 'unexpected created file "surprise.txt"'

  - name: an ignored path cannot satisfy an entry that names it
    steps:
      # Ignoring a path removes it from the delta entirely, so it is not evidence
      # for anything. Otherwise `ignore` would be a way to make a claim pass
      # without the claim being true.
      - fixture:
          file: contradiction.atago.yaml
          content: |
            version: "1"
            suite: {name: contradiction}
            scenarios:
              - name: ignored and expected at once
                steps:
                  - run: {shell: true, command: "printf 'y' > out.txt"}
                  - assert:
                      changes:
                        ignore: [out.txt]
                        created: [out.txt]
      - run: {command: "${atago} run contradiction.atago.yaml"}
      - assert:
          exit_code: 1
          stdout:
            contains: 'created entry "out.txt" matched no file the step created'

  # The delta compares what a step can observably change about an entry, not
  # only its bytes: a chmod is a modification, and an entry that is not a
  # regular file at all is still a creation. Both used to slip past an
  # exhaustive claim — a spec could assert `modified: []` on the same line as a
  # `file: {executable: true}` that proved the step had just made the file
  # world-writable and executable.
  - name: a permission-only change is a modification
    skip:
      os: windows
    steps:
      - fixture:
          file: cfg.yaml
          content: "k: v\n"
      - run:
          shell: true
          command: "chmod 777 cfg.yaml"
      - assert:
          exit_code: 0
          changes:
            created: []
            modified: [cfg.yaml]
            deleted: []
      # The other target that already saw this change agrees with the delta now.
      - assert:
          file:
            path: cfg.yaml
            executable: true

  - name: a planted fifo is a creation and is never opened
    skip:
      os: windows
    steps:
      # A scan that opened the FIFO would block until a writer appeared, so this
      # scenario is also the guard against the delta hanging a run.
      - run:
          shell: true
          command: "mkfifo pipe"
      - assert:
          exit_code: 0
          changes:
            created: [pipe]
            modified: []
            deleted: []
      # And an exhaustive claim that forgets it fails, rather than passing.
      - fixture:
          file: blind.atago.yaml
          content: |
            version: "1"
            suite: {name: blind}
            scenarios:
              - name: an undeclared fifo is not invisible
                steps:
                  - run: {shell: true, command: "mkfifo surprise"}
                  - assert:
                      changes:
                        created: []
      - run: {command: "${atago} run blind.atago.yaml"}
      - assert:
          exit_code: 1
          stdout:
            contains: 'unexpected created file "surprise"'
