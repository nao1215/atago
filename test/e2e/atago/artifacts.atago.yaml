version: "1"

suite:
  name: atago self-hosting / artifacts-dir failure payloads

# --artifacts-dir writes the compared payloads of each FAILED assertion to a
# durable tree for review tooling: the expected and actual bytes as sidecar
# files, one directory per failing scenario, nothing for a passing one. These
# drive atago against inner specs and inspect the written tree. The tree is
# located with a shell glob (the per-suite directory carries a hash), so the
# suite is POSIX-only; the artifact writer is unit-tested in internal/artifact.
scenarios:
  - name: a failing stdout equals writes expected and actual sidecars
    steps:
      - fixture:
          file: fail.atago.yaml
          content: |
            version: "1"
            suite: {name: fail}
            scenarios:
              - name: stdout drifts
                steps:
                  - run: {shell: true, command: "printf 'actual-value\\n'"}
                  - assert: {stdout: {equals: "expected-value"}}
      - run: {command: "${atago} run --artifacts-dir arts fail.atago.yaml"}
      - assert: {exit_code: 1}
      - run:
          shell: true
          command: "cat arts/*/*/*.actual.txt arts/*/*/*.expected.txt"
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "actual-value"
              - "expected-value"

  - name: a passing scenario writes no failure payload
    steps:
      - fixture:
          file: pass.atago.yaml
          content: |
            version: "1"
            suite: {name: pass}
            scenarios:
              - name: all good
                steps:
                  - run: {shell: true, command: "printf 'ok\\n'"}
                  - assert: {stdout: {equals: "ok"}}
      - run: {command: "${atago} run --artifacts-dir arts2 pass.atago.yaml"}
      - assert: {exit_code: 0}
      - run:
          shell: true
          command: "find arts2 -name '*.actual.txt' 2>/dev/null | wc -l"
      - assert:
          stdout:
            matches: "^\\s*0\\s*$"

  - name: the artifacts directory is created when it does not exist
    steps:
      - fixture:
          file: nested.atago.yaml
          content: |
            version: "1"
            suite: {name: nested}
            scenarios:
              - name: fails
                steps:
                  - run: {shell: true, command: "printf 'x\\n'"}
                  - assert: {stdout: {equals: "y"}}
      - run: {command: "${atago} run --artifacts-dir deep/made/arts nested.atago.yaml"}
      - assert: {exit_code: 1}
      - assert:
          dir: {path: deep/made/arts, exists: true}

  # A --repeat run executes one scenario several times, but the report describes
  # ONE iteration inline and points at its payloads. When every iteration wrote to
  # the same paths, the last one overwrote the evidence the report referenced, so
  # the sidecar disagreed with the diff printed beside it. Each iteration prints
  # its own workdir, which differs per iteration, so the payloads are distinct
  # without any timing dependence.
  - name: each repeat iteration keeps its own failure payloads
    steps:
      - fixture:
          file: repeated.atago.yaml
          content: |
            version: "1"
            suite: {name: repeated}
            scenarios:
              - name: prints its own workdir
                steps:
                  # $${workdir} escapes the OUTER expansion, so the inner run
                  # prints its own per-iteration workdir instead of a constant.
                  - run: {shell: true, command: "echo $${workdir}"}
                  - assert: {stdout: {equals: "never-this"}}
      - run: {command: "${atago} run --repeat 3 --artifacts-dir reparts repeated.atago.yaml"}
      - assert: {exit_code: 1}
      # Attempts 2 and 3 each get their own directory; attempt 1 stays at the
      # scenario directory, so a plain run is unaffected.
      - run:
          shell: true
          command: "find reparts -type d -name 'attempt-*' | sort | sed 's#.*/##'"
      - assert:
          exit_code: 0
          stdout:
            equals: "attempt-2\nattempt-3"
      # Three failing iterations leave three different actual payloads.
      - run:
          shell: true
          command: "find reparts -name '*.actual.txt' | wc -l | tr -d ' '"
      - assert:
          stdout:
            equals: "3"
      - run:
          shell: true
          command: "cat $(find reparts -name '*.actual.txt') | sort -u | wc -l | tr -d ' '"
      - assert:
          stdout:
            equals: "3"

  - name: a file-content mismatch also writes a payload
    steps:
      - fixture:
          file: filefail.atago.yaml
          content: |
            version: "1"
            suite: {name: filefail}
            scenarios:
              - name: file drifts
                steps:
                  - fixture: {file: out.txt, content: "written-bytes"}
                  - assert: {file: {path: out.txt, equals: "wanted-bytes"}}
      - run: {command: "${atago} run --artifacts-dir farts filefail.atago.yaml"}
      - assert: {exit_code: 1}
      - run:
          shell: true
          command: "find farts -type f | wc -l"
      - assert:
          stdout:
            not_matches: "^\\s*0\\s*$"

  # A teardown step's index counts from zero like a scenario step's, so a
  # teardown failure at index N used to overwrite the payload the report offered
  # for the scenario step at index N — the verdict said one thing and the file
  # beside it held the other phase's bytes. Teardown payloads live under a
  # teardown/ segment of the same scenario directory, the way suite-level
  # lifecycle blocks already have their own directory.
  - name: a teardown failure keeps the steps failure payloads
    steps:
      - fixture:
          file: bothfail.atago.yaml
          content: |
            version: "1"
            suite: {name: bothfail}
            scenarios:
              - name: both phases fail at index 1
                steps:
                  - run: {shell: true, command: "printf 'STEPS-ACTUAL\\n'"}
                  - assert: {stdout: {equals: "STEPS-EXPECTED"}}
                teardown:
                  - run: {shell: true, command: "printf 'TEARDOWN-ACTUAL\\n'"}
                  - assert: {stdout: {equals: "TEARDOWN-EXPECTED"}}
      - run: {command: "${atago} run --artifacts-dir tarts bothfail.atago.yaml"}
      - assert: {exit_code: 1}
      # The scenario step's evidence is where it always was.
      - run:
          shell: true
          command: "cat tarts/*/*/step-01-stdout.actual.txt"
      - assert:
          exit_code: 0
          stdout:
            equals: "STEPS-ACTUAL"
      # The teardown's evidence is beside it, under its own phase segment.
      - run:
          shell: true
          command: "cat tarts/*/*/teardown/step-01-stdout.actual.txt"
      - assert:
          exit_code: 0
          stdout:
            equals: "TEARDOWN-ACTUAL"
      - run:
          shell: true
          command: "find tarts -name '*.actual.txt' | wc -l | tr -d ' '"
      - assert:
          stdout:
            equals: "2"
