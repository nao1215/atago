version: "1"

# A `pty` step runs one command inside a REAL pseudo-terminal and drives it
# with a declarative expect/send session — for CLIs that branch on TTY-ness or
# present an interactive prompt (REPLs, wizards). The captured transcript
# (terminal echo included) becomes the step's stdout, so every stream matcher,
# snapshot, and `store from.stdout` works unchanged. An `expect` waits until
# the transcript matches the regexp; a `send` types into the terminal (include
# "\n" to press enter; an empty send: "" transmits EOF, i.e. Ctrl-D). The
# whole session is bounded by `timeout` (default 30s) — a prompt that never
# appears fails loudly instead of hanging. Each `expect` scans only the
# transcript AFTER the previous match, so a recurring prompt (`$ `) waits for
# its NEXT occurrence rather than matching a stale earlier one.
#
# The child runs with TERM=xterm-256color by default (matching the vt10x screen
# emulator, #27), so full-screen TUIs (less, vim, htop) actually draw — override
# with `env: {TERM: ...}` if a program needs a specific terminal type. Note: a
# TUI that uses the alternate screen buffer (most of them) RESTORES the primary
# screen when it exits cleanly, so a `screen:` assertion after a clean quit sees
# a blank screen. To assert a live TUI, capture it while it is still displayed
# (e.g. keep output on the primary screen, or let a short `timeout` end the step
# while the UI is up).
# POSIX-only for now; on Windows the step reports a clear execution error.
# Runs green as-is on Linux/macOS: atago run examples/pty.atago.yaml

suite:
  name: pty

scenarios:
  - name: the program sees a real terminal
    skip:
      os: windows
    steps:
      # `[ -t 0 ]` is the classic "am I connected to a TTY?" probe. Under a
      # plain `run:` step stdin is a pipe and this prints is-a-pipe.
      - pty:
          shell: true
          command: 'if [ -t 0 ]; then echo is-a-tty; else echo is-a-pipe; fi'
      - assert:
          exit_code: 0
          stdout:
            contains: is-a-tty

  - name: drive an interactive session with expect and send
    skip:
      os: windows
    steps:
      # cat in a terminal behaves like a tiny echo-REPL: each line you type is
      # echoed back. expect gates each send; the final empty send is Ctrl-D.
      - pty:
          command: cat
          timeout: 10s
          session:
            - send: "hello interactive world\n"
            - expect: "hello interactive world"
            - send: ""
      - assert:
          exit_code: 0
          stdout:
            contains: hello interactive world

  - name: named keys keep sessions readable
    skip:
      os: windows
    steps:
      # {key: <name>} presses a named key (#26) instead of embedding raw
      # \x1b escape bytes: enter, tab, shift-tab, esc, space, backspace,
      # delete, insert, the arrows, home/end, pageup/pagedown, f1-f12,
      # ctrl-a..ctrl-z, control-byte aliases such as ctrl-space / ctrl-[ /
      # ctrl-_, and modified key events such as ctrl-hyphen for apps that care
      # about the physical Ctrl+- key.
      # {key: ctrl-d} is the readable alias for the empty-send EOF rule.
      # `cat -v` renders control bytes visibly, so the down arrow it received
      # shows up as ^[[B in the transcript.
      - pty:
          command: cat -v
          timeout: 10s
          session:
            - send: { key: down }
            - send: { key: enter }
            - expect: '\^\[\[B'
            - send: { key: ctrl-d }
      - assert:
          exit_code: 0
          stdout:
            contains: "^[[B"

  - name: the chords a TUI binds have names too
    skip:
      os: windows
    steps:
      # Beyond the plain keys, the vocabulary covers the chords form- and
      # editor-style TUIs actually bind (#376): shift-tab (alias backtab) moves
      # focus backwards, alt-a..alt-z are the ESC-prefixed Meta chords readline
      # word operations use (with alt-enter and alt-backspace alongside), and
      # the arrows take ctrl-/shift- modifiers for word-wise and selection
      # movement. Each sends the sequence an xterm-class terminal would, which
      # `cat -v` shows verbatim.
      - pty:
          command: cat -v
          timeout: 10s
          session:
            - send: { key: shift-tab }
            - send: { key: enter }
            - expect: '\^\[\[Z'
            - send: { key: alt-b }
            - send: { key: enter }
            - expect: '\^\[b'
            - send: { key: ctrl-left }
            - send: { key: enter }
            - expect: '\^\[\[1;5D'
            - send: { key: ctrl-d }
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "^[[Z" # shift-tab, i.e. CSI Z
              - "^[b" # alt-b
              - "^[[1;5D" # ctrl-left
