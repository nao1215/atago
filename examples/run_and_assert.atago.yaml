version: "1"

# Run a command and assert on what a user observes: exit code, stdout, stderr.
# Runs green as-is: atago run examples/run_and_assert.atago.yaml

suite:
  name: run and assert

scenarios:
  - name: one assert can check several targets at once
    steps:
      - run:
          shell: true
          command: echo hello atago
      # Each target is an independent check; all must hold.
      - assert:
          exit_code: 0
          stdout:
            contains: hello
          stderr:
            empty: true

  - name: matchers beyond contains
    steps:
      - run:
          shell: true
          command: echo alpha beta
      - assert:
          stdout:
            equals: alpha beta
      # not_equals is the exact-text negation: assert the output is anything
      # BUT the given text — a trailing-newline-insensitive inequality.
      - assert:
          stdout:
            not_equals: gamma delta
      - assert:
          stdout:
            matches: "a.+a"
      # not_matches is the regexp negation: assert a pattern never appears —
      # e.g. that output carries no warning/error lines.
      - assert:
          stdout:
            not_matches: "(?i)warn|error"
      # A list is a single matcher: every element must be present (contains)
      # or absent (not_contains).
      - assert:
          stdout:
            contains:
              - alpha
              - beta
      - assert:
          stdout:
            not_contains: [panic, fatal]

  - name: the same lines in any order
    steps:
      # The line relations compare the LINES of a stream against a reference as
      # multisets: permutation_of is "the same lines, in any order", subset_of
      # is "every line was in the reference". They are what a spec states when
      # the content is the contract and the order is not — a listing in map
      # order, a parallel run, a filtered view of an earlier run — where equals
      # would be the wrong claim and three separate contains matchers would be a
      # weaker one (they would also pass on a fourth, unexpected line).
      - run:
          command: sort
          stdin: "b\na\nc\n"
      - assert:
          stdout:
            permutation_of: "b\na\nc"
      # A subset may leave reference lines out, but every line it does have must
      # be there — and a line printed twice needs two in the reference, so an
      # accidentally duplicated line is still a failure.
      - assert:
          stdout:
            subset_of: "a\nb\nc\nd"

  - name: comparing one run against another
    steps:
      # The metamorphic shape: run, remember the output, run again with the
      # input transformed in a way that must not change the result, and state
      # the relation between the two outputs. `${first}` is the reference.
      - run:
          command: sort
          stdin: "b\na\nc\n"
      - store:
          name: first
          from:
            stdout:
              trim: true
      - run:
          command: sort
          stdin: "c\nb\na\n"
      - assert:
          stdout:
            permutation_of: "${first}"

  - name: text matchers combine in one block
    steps:
      - run:
          shell: true
          command: echo "release 1.2.3 ready"
      # contains/not_contains/matches/not_matches can be set together on one
      # stream; every one has to hold (the common "has X but not Y" shape). The
      # whole-stream matchers (equals/empty/snapshot/json/yaml) are used alone.
      - assert:
          stdout:
            contains: ready
            not_contains: error
            matches: "[0-9]+\\.[0-9]+\\.[0-9]+"
      # empty is a boolean: `empty: false` asserts the stream is NOT empty.
      - assert:
          stdout:
            empty: false

  - name: negative exit code and line selection
    steps:
      - run:
          shell: true
          command: echo first
      - assert:
          exit_code:
            not: 1
      # line narrows the stream to a single 1-based line before matching.
      - assert:
          stdout:
            line: 1
            equals: first

  - name: exit code sets match a documented contract
    steps:
      # Real CLIs define exit-code SETS as their contract: grep exits 0 or 1
      # without error, terraform plan -detailed-exitcode exits 0 (clean) or 2
      # (changes). `in:` asserts membership in the accepted set (#19).
      - run:
          shell: true
          command: exit 2
      - assert:
          exit_code:
            in: [0, 2]
