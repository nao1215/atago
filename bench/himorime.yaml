# yaml-language-server: $schema=https://raw.githubusercontent.com/nao1215/himorime/main/schema/himorime.schema.json
#
# atago measured end to end with himorime (https://github.com/nao1215/himorime):
# the process a user or CI starts, from its first instruction to its exit.
#
#   make bench          measure the working tree
#   make bench-compare  compare main with the working tree
#
# On a pull request, .github/workflows/bench.yml runs `himorime ci bench`:
# the base of the pull request and its head are built and measured in
# interleaved rounds on the same runner. See bench/README.md.
#
# Inputs are generated by gen.sh before measuring. Both revisions run the
# working tree's gen.sh (${head_root}), so they read the same bytes.
version: "1"

suite:
  name: atago
  description: Start-up, running specs of 10 and 1000 scenarios serially and in parallel, and a missing spec.

build:
  command: [go, build, -trimpath, -o, "${artifact}", .]
  cwd: ..
  # The same build as `make build`.
  env:
    CGO_ENABLED: "0"

defaults:
  warmup: 2
  runs: 20
  # atago creates a temporary directory per scenario, and a failed run
  # records itself under .atago/ of the working directory; keep both, and
  # HOME, in the benchmark's own directory.
  cwd: "${workdir}"
  env:
    HOME: "${workdir}"
    XDG_CONFIG_HOME: "${workdir}/.config"
    XDG_CACHE_HOME: "${workdir}/.cache"
    TMPDIR: "${workdir}"
  metrics:
    cpu: true
    memory: true
  regression:
    confidence: 0.95
    latency:
      max_percent: 10
      min_difference: 1ms
    cpu:
      max_percent: 15
      min_difference: 2ms
    memory:
      max_percent: 15
      min_difference: 2MiB

benchmarks:
  - name: version
    description: Starting atago and exiting.
    tags: [smoke]
    commands:
      atago:
        command: ["${artifact}", version]

  - name: run 10
    description: A spec of 10 scenarios, each running echo and asserting its exit code and output, one at a time. Start-up and loading the spec dominate.
    tags: [smoke]
    setup:
      - command: [sh, "${head_root}/gen.sh", specs, "10", "${workdir}/specs/bench.atago.yaml"]
    commands:
      # --parallel 1: with the default concurrency, 10 scenarios take either
      # about 12ms or about 30ms from run to run, a spread wider than
      # regression.max_cv, so no comparison of it could be conclusive. One at
      # a time takes the same time on every run. run 1000 measures the
      # default concurrency, where that spread is small against the whole.
      atago:
        command: ["${artifact}", run, --parallel, "1", "${workdir}/specs"]

  - name: run 1000
    description: >-
      A spec of 1000 scenarios, run with the default concurrency and one at a
      time: loading the spec, a temporary directory and a process for every
      scenario, the assertions and the report.
    tags: [large]
    setup:
      - command: [sh, "${head_root}/gen.sh", specs, "1000", "${workdir}/specs/bench.atago.yaml"]
    baseline: parallel
    metrics:
      throughput:
        work: {value: 1000, unit: scenarios}
    commands:
      parallel:
        command: ["${artifact}", run, "${workdir}/specs"]
      serial:
        command: ["${artifact}", run, --parallel, "1", "${workdir}/specs"]

  - name: run error
    description: A spec path that does not exist, which fails with exit 3.
    tags: [smoke]
    exit_codes: [3]
    commands:
      atago:
        command: ["${artifact}", run, "${workdir}/missing.atago.yaml"]
