# Version updates arrive once a month, one pull request per ecosystem.
# Each group applies to version updates only. Security updates are switched on
# in the repository settings, not here; where they are on, Dependabot opens
# them as advisories appear, outside this schedule and these groups.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    ignore:
      # GHSA-2v4p-qf9q-27wj (GO-2026-6443): no 1.84 release carries the fix,
      # which is only on the 1.85 development line. Let a later release through.
      - dependency-name: google.golang.org/grpc
        versions: ["1.84.0"]
    groups:
      gomod:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
  # Dockerfile.goreleaser pins its base image by digest; this keeps it fresh.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    groups:
      docker:
        applies-to: version-updates
        patterns:
          - "*"
