name: reviewdog
on: [pull_request]

permissions:
  contents: read

jobs:
  misspell:
    name: misspell
    runs-on: ubuntu-latest
    # The github-pr-review reporter posts review comments.
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 10
    # The github-pr-review reporter 403s under Dependabot's read-only token.
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: misspell
        uses: reviewdog/action-misspell@7cea3d501cb3834c688e08c89ed77b71764d1784 # v1.30.1
        with:
          reporter: github-pr-review
          level: warning
          locale: "US"

  actionlint:
    runs-on: ubuntu-latest
    # The github-pr-review reporter posts review comments.
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 10
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: reviewdog/action-actionlint@13465d022aa41c282f730be17574b5ce692d0186 # v1.78.1
        with:
          reporter: github-pr-review
          level: warning
