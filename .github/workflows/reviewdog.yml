name: reviewdog
on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  misspell:
    name: misspell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The github-pr-review reporter 403s under Dependabot's read-only token.
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: misspell
        uses: reviewdog/action-misspell@da40ce414be6ce320a9322aa2bae10bd3b9e6ef3 # v1.29.0
        with:
          reporter: github-pr-review
          level: warning
          locale: "US"

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: reviewdog/action-actionlint@d290e336d5a743810aef4404f757dc862276d2ae # v1.73.4
        with:
          reporter: github-pr-review
          level: warning
