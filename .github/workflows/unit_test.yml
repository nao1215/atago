name: MultiPlatformUnitTest

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit_test:
    name: Unit test
    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
        go:
          # go.mod requires go >= 1.26; the CI uses GOTOOLCHAIN=local, so an older
          # toolchain cannot build the module. Test the declared minimum and latest.
          - "1"
          - "1.26"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Run tests
        # Force bash on every OS. The default Windows shell is PowerShell, which
        # mis-parses `-coverprofile=coverage.out ./...` and injects a phantom
        # `.out` package ("FAIL .out [setup failed]"), failing only the Windows
        # legs while the tests themselves pass. Git Bash ships on the windows
        # runner, so the command parses identically across all three OSes.
        #
        # -timeout 5m so a hung package explains itself. Go's default is 10m,
        # which equals this job's timeout-minutes: the runner killed the job at
        # the same moment Go would have panicked, so a hang left nothing but
        # "The operation was canceled" and a couple of orphan test binaries in
        # the cleanup log. No package here takes more than a few seconds, so 5m
        # only ever fires on a real hang — and then Go dumps every goroutine's
        # stack with five minutes of job time left to flush it.
        shell: bash
        run: go test -v -timeout 5m -cover -coverprofile=coverage.out ./...

  # Nothing was running the race detector, on a program whose whole job is
  # supervising concurrent work: a scenario worker pool, a goroutine draining
  # each pty, a semaphore shared across suites, and an atomic fail-stop. A data
  # race in any of that would have surfaced as an unreproducible CI flake with
  # nothing pointing at the cause. One leg is enough — a race is a property of
  # the code, not of the OS or the toolchain version — and it costs seconds,
  # because the detector's overhead lands on a suite that runs in under ten.
  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1"

      # -race needs cgo, so this is the one job that must not set
      # CGO_ENABLED=0. -timeout 10m rather than the 5m above: every test runs
      # instrumented here, so the margin over a real hang is the same.
      - name: Run tests under the race detector
        run: go test -v -race -timeout 10m ./...
