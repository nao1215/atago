name: CrossPlatformE2E

# atago's unit tests run on Linux/macOS/Windows; the PR-gating E2E baseline
# (e2e.yml) runs the full suite on Ubuntu plus the classified buckets on
# Windows. This workflow adds the missing coverage on a schedule: the FULL suite
# on macOS, and the Windows buckets again as a drift check, so OS-specific
# regressions in path handling, shell semantics, and report generation surface
# before release.
#
# Linux and macOS are POSIX and run the FULL self-hosted suite. Windows runs the
# two buckets classified in scripts/windows_specs.tsv — `cmd` under the native
# cmd.exe, `bash` with ATAGO_SHELL pointed at Git for Windows' bash — so the
# Windows story is intentional rather than accidental, and a target that runs
# nowhere on Windows has to say why in that file.
#
# It gates pull requests as well as running on a schedule. Every failure this
# workflow has recorded was macOS-only and real — a behavior difference the
# Ubuntu legs cannot see — so it is signal rather than noise, and a run takes
# about a minute and a half. Leaving it to the nightly meant a macOS regression
# lived on main until the next morning, which is how one shipped.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 05:00 UTC daily, before the dogfood matrix.
    - cron: "0 5 * * *"

permissions:
  contents: read

defaults:
  run:
    # bash is available on all three runner OSes (Git Bash on Windows), so the
    # spec targets and `go run` invocation are written once.
    shell: bash

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: "./test/e2e/atago ./test/e2e/thirdparty/git"
          - os: macos-latest
            targets: "./test/e2e/atago ./test/e2e/thirdparty/git"
          # The classified buckets, expanded from scripts/windows_specs.tsv
          # (shared with the e2e-windows job in e2e.yml) by the run step below.
          - os: windows-latest
            targets: "@windows"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      # `go run .` compiles atago and runs it; os.Executable() (which seeds the
      # ${atago} spec variable) points at that binary, so specs self-invoke atago
      # correctly on every OS without per-platform binary-name handling. The
      # Windows leg passes @windows and runs both classified buckets, each under
      # the shell it is classified for.
      # --retry-failed 1 absorbs the rare self-hosted pty replay flakes this
      # scheduled drift job exists to surface early, not to gate every merge on:
      # a recovered scenario is still reported as flaky, while a real regression
      # fails both attempts.
      - name: Run the self-hosted E2E specs
        run: |
          if [ "${{ matrix.targets }}" != "@windows" ]; then
            read -ra targets <<< "${{ matrix.targets }}"
            go run . run --retry-failed 1 --allow-flaky "${targets[@]}"
            exit 0
          fi
          mapfile -t native < <(bash scripts/windows_specs.sh cmd)
          go run . run --retry-failed 1 --allow-flaky "${native[@]}"
          mapfile -t posix < <(bash scripts/windows_specs.sh bash)
          ATAGO_SHELL='C:\Program Files\Git\bin\bash.exe' \
            go run . run --retry-failed 1 --allow-flaky "${posix[@]}"
