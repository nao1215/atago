name: ReleaseSmoke

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes its older run; pushes to main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Release smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          # The shared setup-go cache is saved by whichever job finishes first
          # and holds host-only build output, so the six cross-compiled targets
          # below always compiled from scratch (3m8s of a 5m31s job). This job
          # keeps its own cache instead: restored on every run, saved only from
          # main so PRs cannot evict or poison it. The key is the Go version
          # and go.sum, not the commit, and main saves only when that exact key
          # is missing, so pushes to main do not pile up a new entry each.
          cache: false

      - name: Locate Go caches
        id: go-env
        run: |
          {
            echo "version=$(go env GOVERSION)"
            echo "gocache=$(go env GOCACHE)"
            echo "gomodcache=$(go env GOMODCACHE)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the cross-compile cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
          key: ${{ runner.os }}-release-smoke-${{ steps.go-env.outputs.version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-release-smoke-${{ steps.go-env.outputs.version }}-

      - name: Install Syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Enable QEMU for arm64 container builds
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Create buildx builder
        run: |
          docker buildx create --name atago-release-smoke --use
          docker buildx inspect --bootstrap

      # Signing and publishing stay skipped on purpose: keyless cosign needs an
      # OIDC id-token, which fork PRs cannot mint, and a PR-signed cert identity
      # would differ from the release.yml identity users verify against. The
      # local docker image build still runs here via skip_push templates, so the
      # release promises — runnable archives and a runnable GHCR image — build on
      # every PR without publishing anything.
      - name: Install go-licenses
        run: go install github.com/google/go-licenses/v2@v2.0.1
      - name: Build artifacts for smoke test
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "v2.16.0"
          args: release --snapshot --clean --skip=publish,sign

      - name: Save the cross-compile cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      # Not just "does an archive exist": verifies every hash in checksums.txt,
      # requires a valid SPDX SBOM per archive, checks archive layout for all
      # six OS/arch targets, then extracts the host archive and runs the real
      # binary through version -> init -> run.
      - name: Smoke-test artifacts before publishing
        run: ./scripts/smoke_artifacts.sh dist

      - name: Smoke-test Docker image before publishing
        run: ./scripts/smoke_docker_image.sh
