name: SelfHostedE2E

# atago must be tested by atago. This builds the real binary
# and runs the self-hosted spec suite against it. A release must not be tagged
# unless this passes.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes its older run; pushes to main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Build atago
        run: go build -o ./dist/atago .

      - name: Run self-hosted E2E specs
        # Only the hermetic atago suite runs in CI. The dogfood suites under
        # test/e2e/tools/* (gup, sqly, truss, iso8583tool, jose, career,
        # mobilepkg, gup-offline, mimixbox) build the real third-party CLIs from
        # their checkouts and run locally via `make dogfood` /
        # `make dogfood-iso8583tool` / `make dogfood-jose` / `make dogfood-career`
        # / `make dogfood-gup` / `make dogfood-mimixbox` / `make dogfood-mobilepkg`.
        run: ./dist/atago run ./test/e2e/atago

      - name: Run the git suite (a third-party CLI, no build required)
        # Proof that atago tests a CLI nobody here wrote: git is preinstalled
        # on every runner, so this suite runs everywhere without a build step.
        run: ./dist/atago run ./test/e2e/thirdparty/git

  # The README leads with real-world proof (dogfood + third-party suites), so a
  # representative slice of that proof must gate every PR, not only the daily
  # schedules. One flagship self-hosted server (caddy) and one dogfood CLI
  # (sqly) run here at PINNED versions so the required check stays
  # deterministic; the daily thirdparty.yml / dogfood.yml matrices keep the
  # broader external-tool coverage on their own pinned versions.
  e2e-representative:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Build atago
        run: go build -o ./dist/atago .

      # Building caddy and sqly from source took 78s of this job on every run.
      # The binaries depend only on the pinned versions and the Go toolchain,
      # so they are cached under a key made of exactly those, restored on every
      # run and saved only from main.
      - name: Locate the tool cache
        id: tools
        run: |
          {
            echo "bin=$RUNNER_TEMP/atago-ci-tools/bin"
            echo "key=$RUNNER_OS-representative-tools-$(go env GOVERSION)-caddy-v2.11.4-sqly-v0.27.3"
          } >> "$GITHUB_OUTPUT"

      - name: Restore pinned representative programs
        id: tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.tools.outputs.bin }}
          key: ${{ steps.tools.outputs.key }}

      - name: Install pinned representative programs
        timeout-minutes: 10
        if: steps.tools-cache.outputs.cache-hit != 'true'
        env:
          GOBIN: ${{ steps.tools.outputs.bin }}
        run: |
          set -e
          bash ./scripts/retry.sh go install github.com/caddyserver/caddy/v2/cmd/caddy@v2.11.4
          bash ./scripts/retry.sh go install github.com/nao1215/sqly@v0.27.3

      - name: Save pinned representative programs
        if: steps.tools-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.tools.outputs.bin }}
          key: ${{ steps.tools.outputs.key }}

      - name: Put the pinned programs on PATH
        env:
          TOOLS_BIN: ${{ steps.tools.outputs.bin }}
        run: echo "$TOOLS_BIN" >> "$GITHUB_PATH"

      - name: Run the caddy suite (self-hosted web server, awesome-selfhosted)
        run: ./dist/atago run ./test/e2e/thirdparty/caddy

      - name: Run the sqly dogfood suite
        # --retry-failed: the interactive REPL specs (repl_pty.atago.yaml) drive
        # sqly's readline prompt over a pty, which is inherently racy — the prompt
        # is re-rendered a beat before its read loop is ready, so a fast quit can
        # occasionally be lost with no observable signal to expect on. A recovered
        # scenario is reported as flaky, never hidden, and a real regression still
        # fails after the retries.
        run: ./dist/atago run --retry-failed 3 --allow-flaky ./test/e2e/tools/sqly

  # Windows regressions must fail a PR, not surface days later in the daily
  # cross-platform run (#78 follow-up). The classification of every self-hosted
  # target lives in scripts/windows_specs.tsv, shared with e2e-cross.yml and
  # enforced complete by TestWindowsSpecs_EveryTargetClassified, so a new spec
  # cannot ship without a decision about Windows.
  #
  # Two buckets run here. `cmd` is the NATIVE story: specs whose commands are
  # builtins of both /bin/sh and cmd.exe, or that only drive atago itself, run
  # under the shell a Windows user gets by default. `bash` is everything else,
  # run with ATAGO_SHELL pointed at the bash that ships with Git for Windows —
  # there the shell is scaffolding rather than the subject, and what the leg
  # proves is that atago's own engine behaves on Windows across the whole
  # feature surface instead of only where the scaffolding happened to be
  # portable.
  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      # `go run .` compiles atago and runs it; os.Executable() (which seeds the
      # ${atago} spec variable) points at that binary, so specs self-invoke
      # atago correctly without per-platform binary-name handling.
      # --retry-failed 1 absorbs a Windows-only capture flake: a scenario that
      # drives a nested atago occasionally reads back an EMPTY stdout from it while
      # the run exits 0, which fails an assertion on output the child certainly
      # wrote. It reproduced once in fourteen runs of this job and a re-run of the
      # same commit was green. A retry re-runs in a fresh workdir and reports a
      # recovery as flaky, so a real regression still fails both attempts. See #339
      # for the cause; nothing here changes what any scenario asserts.
      - name: Run the cmd.exe bucket (the shell a Windows user gets by default)
        shell: bash
        run: |
          mapfile -t targets < <(bash scripts/windows_specs.sh cmd)
          go run . run --retry-failed 1 --allow-flaky "${targets[@]}"

      # ATAGO_SHELL is atago's own documented way to choose the interpreter for
      # `shell: true`, so this leg dogfoods it as well as widening coverage. The
      # bash that ships with Git for Windows is preinstalled on the runner, and
      # the `shell: bash` steps above already put its coreutils on PATH, which
      # is what the argv-form steps (`cat`, `wc`, `cp`) resolve through.
      - name: Run the POSIX-shell bucket (the rest of the feature surface)
        shell: bash
        env:
          ATAGO_SHELL: C:\Program Files\Git\bin\bash.exe
        run: |
          mapfile -t targets < <(bash scripts/windows_specs.sh bash)
          go run . run --retry-failed 1 --allow-flaky "${targets[@]}"

      # Real-world proof that the ConPTY pty runner drives an INTERACTIVE CLI on
      # Windows, not just self-terminating output: sqly's shell is a readline
      # REPL (built on nao1215/prompt) that only starts when stdin is a TTY. A
      # pinned sqly runs the pty specs that send a query and quit with EOF and
      # assert the result — exercising the ConPTY send path end to end.
      #
      # Building sqly from source took 101s of this job, the longest step of
      # every PR's Windows leg. The binary depends only on the pinned version
      # and the Go toolchain, so it is cached under exactly that key, restored
      # on every run and saved only from main.
      - name: Locate the tool cache
        id: tools
        shell: bash
        run: |
          {
            echo "bin=$(cygpath -w "$RUNNER_TEMP/atago-ci-tools/bin")"
            echo "key=$RUNNER_OS-windows-tools-$(go env GOVERSION)-sqly-v0.27.3"
          } >> "$GITHUB_OUTPUT"

      - name: Restore pinned sqly
        id: tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.tools.outputs.bin }}
          key: ${{ steps.tools.outputs.key }}

      - name: Install pinned sqly for the interactive pty check
        timeout-minutes: 10
        if: steps.tools-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GOBIN: ${{ steps.tools.outputs.bin }}
        run: bash ./scripts/retry.sh go install github.com/nao1215/sqly@v0.27.3

      - name: Save pinned sqly
        if: steps.tools-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.tools.outputs.bin }}
          key: ${{ steps.tools.outputs.key }}

      - name: Put pinned sqly on PATH
        shell: bash
        env:
          TOOLS_BIN: ${{ steps.tools.outputs.bin }}
        run: echo "$TOOLS_BIN" >> "$GITHUB_PATH"

      # --parallel 1 keeps the concurrent ConPTY sessions from starving each
      # other; --retry-failed absorbs the residual readline-prompt race (see the
      # sqly dogfood step above). A recovered scenario is reported as flaky.
      - name: Drive sqly's interactive shell over a Windows pty
        shell: bash
        run: go run . run --parallel 1 --retry-failed 3 --allow-flaky ./test/e2e/tools/sqly/repl_pty.atago.yaml
