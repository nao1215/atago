version: 2
project_name: atago
env:
  - GO111MODULE=on
before:
  hooks:
    - go mod tidy
builds:
  - main: .
    ldflags:
      - -s -w -X github.com/nao1215/atago/internal/buildinfo.Version=v{{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
# Linux system packages for apt/dnf/apk users (the same set gup and sqly ship).
nfpms:
  - maintainer: Naohiro CHIKAMATSU <n.chika156@gmail.com>
    description: "Tests CLI behavior from plain YAML: exit codes, output, files, snapshots, and interactive terminals (PTY/TUI)"
    homepage: https://github.com/nao1215/atago
    license: MIT License
    formats:
      - deb
      - rpm
      - apk
checksum:
  name_template: "checksums.txt"

# Homebrew distribution (#79). On a real tagged release GoReleaser publishes a
# cask to the shared nao1215/homebrew-tap (the same tap that ships gup), using a
# tap-scoped token. This block is skipped by `--skip=publish` (release-smoke), so
# snapshot builds stay hermetic and need no token.
homebrew_casks:
  - name: atago
    repository:
      owner: nao1215
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/nao1215/atago"
    description: "Tests CLI behavior from plain YAML: exit codes, output, files, snapshots, and interactive terminals (PTY/TUI)"
    # The binary is not signed/notarized, so strip the quarantine attribute on
    # install — otherwise Gatekeeper blocks the cask-installed binary with
    # "cannot verify the developer" (the pattern GoReleaser documents for
    # unsigned Go binaries).
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/atago"]
          end

# Scoop distribution for Windows, the one platform CI tests on every push but no
# package manager could reach. The bucket lives in this repository under
# `bucket/`, which Scoop accepts the same as a dedicated bucket repository:
#
#   scoop bucket add nao1215 https://github.com/nao1215/atago
#   scoop install nao1215/atago
#
# Keeping it here means GoReleaser publishes the manifest with the workflow's
# built-in GITHUB_TOKEN — there is no cross-repository token to provision, and
# no second repository whose only content is one generated JSON file. Skipped by
# `--skip=publish` (release-smoke), so snapshot builds stay hermetic.
scoops:
  - name: atago
    repository:
      owner: nao1215
      name: atago
      branch: main
    directory: bucket
    homepage: "https://github.com/nao1215/atago"
    description: "Tests CLI behavior from plain YAML: exit codes, output, files, snapshots, and interactive terminals (PTY/TUI)"
    license: MIT
    commit_msg_template: "chore(scoop): update the bucket manifest for {{ .Tag }}"

# winget distribution for Windows. The Windows archives are already zips, which
# winget installs as a portable package, so `winget install nao1215.atago` puts
# atago.exe on PATH without an installer. GoReleaser writes the three manifests
# (version, installer, locale) to a branch on nao1215/winget-pkgs — a fork of
# the community repository — and opens the pull request against
# microsoft/winget-pkgs, so a tag is still the only manual step. Skipped by
# `--skip=publish` (release-smoke) and, via `skip_upload: auto`, on pre-release
# tags, which the community repository does not accept.
winget:
  - name: atago
    package_identifier: nao1215.atago
    publisher: nao1215
    publisher_url: "https://github.com/nao1215"
    publisher_support_url: "https://github.com/nao1215/atago/issues"
    homepage: "https://github.com/nao1215/atago"
    short_description: "Tests CLI behavior from plain YAML: exit codes, output, files, snapshots, and interactive terminals (PTY/TUI)"
    description: |
      atago runs a command-line program the way a user does and checks what
      actually happened: the exit code, stdout and stderr, the files and
      directories the run created or changed, golden snapshots, and interactive
      terminal sessions driven through a real PTY. Scenarios are plain YAML, so
      a test suite needs no test framework and no shell scripting.
    license: MIT
    license_url: "https://github.com/nao1215/atago/blob/main/LICENSE"
    copyright: "Copyright (c) 2026 Naohiro CHIKAMATSU"
    release_notes_url: "https://github.com/nao1215/atago/releases/tag/{{ .Tag }}"
    tags:
      - cli
      - testing
      - e2e
      - end-to-end
      - yaml
      - tui
      - golang
    skip_upload: auto
    repository:
      owner: nao1215
      name: winget-pkgs
      branch: "atago-{{ .Version }}"
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

dockers_v2:
  - images:
      - "ghcr.io/nao1215/atago"
    tags:
      - "{{ .Version }}"
      - "latest"
    dockerfile: Dockerfile.goreleaser
    platforms:
      - "linux/amd64"
      - "linux/arm64"
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: "https://github.com/nao1215/atago"
      org.opencontainers.image.licenses: "MIT"

snapshot:
  version_template: "{{ incpatch .Version }}-next"
release:
  header: |
    ## atago {{ .Tag }}

    atago tests real CLI behavior from plain YAML: commands, files, snapshots,
    and interactive terminals.

    Every artifact is signed and ships with an SBOM and build provenance — see
    [Verifying release integrity](https://github.com/nao1215/atago#verifying-release-integrity).
  footer: |
    **Full changelog**: https://github.com/nao1215/atago/compare/{{ .PreviousTag }}...{{ .Tag }}
changelog:
  sort: asc
  use: github
  groups:
    - title: "Breaking changes"
      regexp: '^.*?[a-zA-Z]+(\(.+\))??!:.+$'
      order: 0
    - title: "Features"
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 1
    - title: "Bug fixes"
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 2
    - title: "Performance"
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 3
    - title: "Documentation"
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 4
    - title: "Others"
      order: 999
  filters:
    exclude:
      - "^tests?(\\(.+\\))?!?:"
      - "^chore(\\(.+\\))?!?:"
      - "^style(\\(.+\\))?!?:"
      - "^ci(\\(.+\\))?!?:"
      - "Merge pull request"
      - "Merge branch"
sboms:
  - artifacts: archive
    documents:
      - "${artifact}.sbom.json"
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true
